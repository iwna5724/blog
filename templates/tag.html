<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{tag}} 태그의 글 목록">
  
  <!-- 🔒 검색엔진 차단 (개인 블로그) -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  
  <title>{{tag}} - {{blogTitle}}</title>

  <link rel="icon" type="image/x-icon" href="../../static/images/favicon.ico">
  <link rel="manifest" href="../../manifest.json">
  <meta name="theme-color" content="#667eea">
  <link rel="apple-touch-icon" href="../../static/images/icon-192.png">

  <link rel="stylesheet" href="../../static/css/style.css">

  <script src="../../static/js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav class="nav">
        <a href="../../index.html" class="logo">{{blogTitle}}</a>
        <div class="nav-links">
          <a href="../../lists.html" data-i18n="nav.lists">일기</a>
          <a href="../../music.html" data-i18n="nav.music">음악</a>
          <a href="../../photo.html" data-i18n="nav.photo">사진</a>
          <div class="nav-utils">
            <button id="lang-toggle" class="lang-toggle" aria-label="언어 전환">
              <img src="../../static/images/flags/KOREA.svg" alt="한국어">
            </button>
            <button id="theme-toggle" class="theme-toggle" aria-label="테마 전환">
              🌙
            </button>
            <a href="../../admin/login.html" class="admin-link" title="관리자 로그인">
              ⚙️
            </a>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div class="current-tag-header">
        <div class="current-tag-info">
          <span class="tag-icon">🏷️</span>
          <div>
            <h1 class="current-tag-name">{{tag}}</h1>
            <p class="current-tag-count"><span data-lang-count="{{postCount}}">{{postCount}}</span><span data-i18n="postCount">개의 글</span></p>
          </div>
        </div>
        <a href="../../lists.html" class="back-link" data-i18n="backToAllTags">
          ← 일기 페이지로 돌아가기
        </a>
      </div>

      <section class="posts-section">
        <div class="posts-list">
          {{posts}}
        </div>
      </section>

      <div class="back-link-container" style="margin-top: 40px;">
        <a href="../../index.html" class="back-link" data-i18n="backToHome">← 홈으로 돌아가기</a>
      </div>
    </div>
  </main>

  <script src="../../static/js/language.js"></script>
  <script>
    // 관리자 로그인 상태 체크 및 로그아웃 처리
    (function() {
      var adminLink = document.querySelector('.admin-link');
      if (!adminLink) return;

      var isLoggedIn = !!localStorage.getItem('github_token');

      if (isLoggedIn) {
        adminLink.classList.add('logged-in');
        adminLink.title = '로그아웃';
      }

      adminLink.addEventListener('click', function(e) {
        if (isLoggedIn) {
          e.preventDefault();
          localStorage.removeItem('github_token');
          localStorage.removeItem('github_config');
          isLoggedIn = false;
          adminLink.classList.remove('logged-in');
          adminLink.title = '관리자 로그인';
          adminLink.href = '../../admin/login.html';
        } else {
          localStorage.setItem('return_url', window.location.href);
        }
      });
    })();
  </script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('../../sw.js');}</script>
</body>
</html>
