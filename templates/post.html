<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{description}}">
  <meta name="author" content="{{author}}">
  
  <!-- 🔒 검색엔진 차단 (개인 블로그) -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  
  <title>{{title}} - {{blogTitle}}</title>
  
  <link rel="icon" type="image/x-icon" href="../../static/images/favicon.ico">

  <link rel="stylesheet" href="../../static/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">

  <script src="../../static/js/theme.js"></script>
  
  <style>
    .post-header {
      padding-bottom: 20px;
    }
    
    .post-title {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: var(--text-primary);
      line-height: 1.2;
    }
    
    .post-meta {
      display: flex;
      align-items: baseline;
      gap: 20px;
      flex-wrap: wrap;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }
    
    .post-meta time {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .post-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    /* 태그 스타일 */
    .post-tags .tag {
      font-size: 1.2rem;
      padding: 4px 8px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    
    /* 도전 스타일 */
    .post-challenges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-left: 1px solid var(--border-color);
      padding-left: 20px;
    }
    
    .challenge-badge {
      font-size: 1.2rem;
      padding: 4px 8px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    
    .challenge-badge.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }
    
    .challenge-badge.inactive {
      background: var(--bg-secondary);
      opacity: 0.4;
    }
    
    /* 음악 스타일 (88-109번 줄: 추가) */
    .post-music {
      width: 100%;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }
    
    .music-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-primary);
      text-decoration: none;
      font-size: 1rem;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--bg-secondary);
      transition: all 0.2s;
      border: 1px solid var(--border-color);
    }
    
    .music-link:hover {
      background: var(--accent-primary);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    
    /* 모바일: 도전이 아래로 배치되면 가로 구분선 */
    @media (max-width: 768px) {
      .post-header {
        padding-bottom: 0;
      }
      
      .post-challenges {
        border-left: none;
        padding-left: 0;
        border-top: 1px solid var(--border-color);
        padding-top: 12px;
        margin-top: 0;
        width: 100%;
      }
    }
    
    .post-content {
      max-width: 1000px;
      margin: 0 auto;
      line-height: 1.8;
      font-size: 1.1rem;
    }
    
    .post-content h1,
    .post-content h2,
    .post-content h3,
    .post-content h4,
    .post-content h5,
    .post-content h6 {
      margin-top: 2em;
      margin-bottom: 1em;
      color: var(--text-primary);
      font-weight: 600;
    }
    
    .post-content h1 { font-size: 2rem; }
    .post-content h2 { font-size: 1.75rem; }
    .post-content h3 { font-size: 1.5rem; }
    .post-content h4 { font-size: 1.25rem; }
    
    .post-content a {
      color: var(--accent-primary);
      text-decoration: none;
      border-bottom: 1px solid var(--accent-primary);
      transition: all 0.2s;
    }
    
    .post-content a:hover {
      color: var(--accent-secondary);
      border-color: var(--accent-secondary);
    }
    
    .post-content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
    
    .post-content pre {
      background: #282c34;
      border-radius: 8px;
      padding: 1.5em;
      overflow-x: auto;
      margin: 2em 0;
    }
    
    .post-content code {
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 0.9em;
    }
    
    .post-content pre code {
      background: none;
      padding: 0;
      border-radius: 0;
      color: #abb2bf;
    }
    
    .post-content :not(pre) > code {
      background: var(--bg-secondary);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent-primary);
    }
    
    .post-content blockquote {
      border-left: 4px solid var(--accent-primary);
      padding-left: 1.5em;
      margin: 2em 0;
      color: var(--text-secondary);
      font-style: italic;
    }
    
    .post-content ul,
    .post-content ol {
      margin: 1.5em 0;
      padding-left: 2em;
    }
    
    .post-content li {
      margin: 0.5em 0;
    }
    
    .post-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 2em 0;
    }
    
    .post-content th,
    .post-content td {
      border: 1px solid var(--border-color);
      padding: 12px;
      text-align: left;
    }
    
    .post-content th {
      background: var(--bg-secondary);
      font-weight: 600;
    }
    
    .post-actions {
      padding-top: 40px;
      border-top: 2px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .back-link {
      color: var(--text-secondary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.2s;
    }
    
    .back-link:hover {
      color: var(--accent-primary);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav class="nav">
        <a href="../../index.html" class="logo">{{blogTitle}}</a>
        <div class="nav-links">
          <a href="../../lists.html" data-i18n="nav.lists">글 목록</a>
          <button id="lang-toggle" class="lang-toggle" aria-label="언어 전환">
            <img src="../../static/images/flags/KOREA.svg" alt="한국어">
          </button>
          <button id="theme-toggle" class="theme-toggle" aria-label="테마 전환">
            🌙
          </button>
          <a href="../../admin/login.html" class="admin-link" title="관리자 로그인">
            ⚙️
          </a>
        </div>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <article class="post-content-wrapper">
        <div class="post-header">
          <h1 class="post-title" data-lang-ko="{{titleKo}}" data-lang-ja="{{titleJa}}">{{titleKo}}</h1>
          <div class="post-meta">
            <time data-date="{{date}}">{{date}}</time>
            <div class="post-tags">{{tags}}</div>
            <div class="post-challenges">{{challenges}}</div>
            {{music}}
          </div>
        </div>
        
        <div class="post-content" id="post-content-ko" data-lang="ko">
          {{contentKo}}
        </div>
        
        <div class="post-content" id="post-content-ja" data-lang="ja" style="display: none;">
          {{contentJa}}
        </div>
        
        <div class="post-actions">
          <a href="../../" class="back-link" data-i18n="backToList">
            ← 목록으로 돌아가기
          </a>
        </div>
      </article>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    // 코드 블록 하이라이팅
    document.querySelectorAll('pre code').forEach((block) => {
      hljs.highlightElement(block);
    });

    // 언어별 content 전환
    function updatePostContent() {
      const currentLang = window.langManager ? window.langManager.getLanguage() : 'ko';
      const koContent = document.getElementById('post-content-ko');
      const jaContent = document.getElementById('post-content-ja');
      
      if (koContent && jaContent) {
        if (currentLang === 'ja') {
          koContent.style.display = 'none';
          jaContent.style.display = 'block';
        } else {
          koContent.style.display = 'block';
          jaContent.style.display = 'none';
        }
      }
    }
    
    // 언어 변경 이벤트 리스너
    document.addEventListener('languageChanged', updatePostContent);
    
    // 페이지 로드 시 실행
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', updatePostContent);
    } else {
      updatePostContent();
    }
  </script>

  <script src="../../static/js/language.js"></script>
</body>
</html>
