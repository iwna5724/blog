<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{description}}">
  <meta name="author" content="{{author}}">
  
  <!-- 🔒 검색엔진 차단 (개인 블로그) -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  
  <title>{{title}} - {{blogTitle}}</title>
  
  <link rel="stylesheet" href="../../static/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  
  <style>
    .post-header {
      margin-bottom: 40px;
      padding-bottom: 30px;
      border-bottom: 2px solid var(--border-color);
    }
    
    .post-title {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: var(--text-primary);
      line-height: 1.2;
    }
    
    .post-meta {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }
    
    .post-meta time {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .post-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .post-content {
      max-width: 1000px;
      margin: 0 auto;
      line-height: 1.8;
      font-size: 1.1rem;
    }
    
    .post-content h1,
    .post-content h2,
    .post-content h3,
    .post-content h4,
    .post-content h5,
    .post-content h6 {
      margin-top: 2em;
      margin-bottom: 1em;
      color: var(--text-primary);
      font-weight: 600;
    }
    
    .post-content h1 { font-size: 2rem; }
    .post-content h2 { font-size: 1.75rem; }
    .post-content h3 { font-size: 1.5rem; }
    .post-content h4 { font-size: 1.25rem; }
    
    .post-content p {
      margin-bottom: 1.5em;
    }
    
    .post-content a {
      color: var(--accent-primary);
      text-decoration: none;
      border-bottom: 1px solid var(--accent-primary);
      transition: all 0.2s;
    }
    
    .post-content a:hover {
      color: var(--accent-secondary);
      border-color: var(--accent-secondary);
    }
    
    .post-content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 2em 0;
    }
    
    .post-content pre {
      background: #282c34;
      border-radius: 8px;
      padding: 1.5em;
      overflow-x: auto;
      margin: 2em 0;
    }
    
    .post-content code {
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 0.9em;
    }
    
    .post-content pre code {
      background: none;
      padding: 0;
      border-radius: 0;
      color: #abb2bf;
    }
    
    .post-content :not(pre) > code {
      background: var(--bg-secondary);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent-primary);
    }
    
    .post-content blockquote {
      border-left: 4px solid var(--accent-primary);
      padding-left: 1.5em;
      margin: 2em 0;
      color: var(--text-secondary);
      font-style: italic;
    }
    
    .post-content ul,
    .post-content ol {
      margin: 1.5em 0;
      padding-left: 2em;
    }
    
    .post-content li {
      margin: 0.5em 0;
    }
    
    .post-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 2em 0;
    }
    
    .post-content th,
    .post-content td {
      border: 1px solid var(--border-color);
      padding: 12px;
      text-align: left;
    }
    
    .post-content th {
      background: var(--bg-secondary);
      font-weight: 600;
    }
    
    .post-actions {
      margin-top: 60px;
      padding-top: 40px;
      border-top: 2px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .back-link {
      color: var(--text-secondary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.2s;
    }
    
    .back-link:hover {
      color: var(--accent-primary);
    }
    
    /* 다국어 콘텐츠 표시/숨김 */
    .lang-ko,
    .lang-ja {
      display: none;
    }
    
    /* 한국어가 선택되었을 때 */
    body[data-lang="ko"] .lang-ko {
      display: block;
    }
    
    /* 일본어가 선택되었을 때 */
    body[data-lang="ja"] .lang-ja {
      display: block;
    }
    
    /* 기본값은 한국어 */
    body:not([data-lang]) .lang-ko {
      display: block;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav class="nav">
        <a href="../../index.html" class="logo">{{blogTitle}}</a>
        <div class="nav-links">
          <a href="../../index.html" data-i18n="nav.home">홈</a>
          <a href="../../tags.html" data-i18n="nav.tags">태그</a>
          <button id="lang-toggle" class="lang-toggle" aria-label="언어 전환">
            <img src="../../static/images/flags/KOREA.svg" alt="한국어">
          </button>
          <button id="theme-toggle" class="theme-toggle" aria-label="테마 전환">
            ☀️
          </button>
          <a href="../../admin/login.html" class="admin-link" title="관리자 로그인">
            ⚙️
          </a>
        </div>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <article class="post-content-wrapper">
        <div class="post-header">
          <h1 class="post-title">
            <span class="lang-ko">{{titleKo}}</span>
            <span class="lang-ja">{{titleJa}}</span>
          </h1>
          <div class="post-meta">
            <time>{{date}}</time>
            <div class="post-tags">{{tags}}</div>
          </div>
        </div>
        
        <div class="post-content">
          <div class="lang-ko">
            {{contentKo}}
          </div>
          <div class="lang-ja">
            {{contentJa}}
          </div>
        </div>
        
        <div class="post-actions">
          <a href="../../index.html" class="back-link">
            ← 목록으로 돌아가기
          </a>
        </div>
      </article>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    // 코드 블록 하이라이팅
    document.querySelectorAll('pre code').forEach((block) => {
      hljs.highlightElement(block);
    });
  </script>

  <script src="../../static/js/theme.js"></script>
  <script src="../../static/js/language.js"></script>
</body>
</html>
