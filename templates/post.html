<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{description}}">
  <meta name="author" content="{{author}}">
  
  <!-- 🔒 검색엔진 차단 (개인 블로그) -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  
  <title>{{title}} - {{blogTitle}}</title>
  
  <link rel="icon" type="image/x-icon" href="../../static/images/favicon.ico">
  <link rel="manifest" href="../../manifest.json">
  <meta name="theme-color" content="#667eea">
  <link rel="apple-touch-icon" href="../../static/images/icon-192.png">

  <link rel="stylesheet" href="../../static/css/style.css">
  <link rel="stylesheet" href="../../static/css/aes-modal.css">

  <script src="../../static/js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav class="nav">
        <a href="../../index.html" class="logo">{{blogTitle}}</a>
        <div class="nav-links">
          <a href="../../changelog.html" class="changelog-link" data-i18n="nav.changelog">패치노트</a>
          <a href="../../lists.html" data-i18n="nav.lists">일기</a>
          <a href="../../music.html" data-i18n="nav.music">음악</a>
          <a href="../../photo.html" data-i18n="nav.photo">사진</a>
          <div class="nav-utils">
            <button id="lang-toggle" class="lang-toggle" aria-label="언어 전환">
              <img src="../../static/images/flags/KOREA.svg" alt="한국어">
            </button>
            <a href="../../admin/login.html" class="admin-link" title="관리자 로그인">
              ⚙️
            </a>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <article class="post-content-wrapper">
        <div class="post-header">
          <h1 class="post-title" data-lang-ko="{{titleKo}}" data-lang-ja="{{titleJa}}">{{titleKo}}</h1>
          <div class="post-meta">
            <div class="post-meta-row">
              <time data-date="{{date}}">{{date}}</time>
              <div class="post-tags">{{tags}}</div>
              <a href="../../admin/editor.html?file={{slug}}.md" id="edit-post-btn" class="edit-link" style="display: none;">
                ✏️ 수정
              </a>
              <div class="post-challenges">{{challenges}}</div>
            </div>
            {{music}}
          </div>
        </div>

        <div class="post-content" id="post-content-ko" data-lang="ko">
          {{contentKo}}
        </div>
        
        <div class="post-content" id="post-content-ja" data-lang="ja" style="display: none;">
          {{contentJa}}
        </div>
        
        <!-- AES 복호화 버튼 (🦆 태그가 있을 때만 표시) -->
        <div id="aes-decrypt-section" style="display: none; padding: 12px; border-top: 1px solid var(--border-color);">
          <button class="aes-open-button" onclick="AESModal.open('decrypt-only')" data-i18n="aes.openButton">
            🔓 암호문 복호화
          </button>
        </div>
        
        <div class="post-actions">
          <a href="../../" class="back-link" data-i18n="backToHome">
            ← 홈으로 돌아가기
          </a>
        </div>
      </article>
    </div>
  </main>

  <script>
    // YouTube 플레이어 토글 (클릭 시 임베드 표시)
    function toggleYouTubePlayer(linkElement, videoId) {
      const wrapper = document.getElementById('youtube-wrapper-' + videoId);
      if (wrapper) {
        if (wrapper.style.display === 'none') {
          wrapper.style.display = 'block';
        } else {
          wrapper.style.display = 'none';
        }
      }
    }

    // 언어별 content 전환
    function updatePostContent() {
      const currentLang = window.langManager ? window.langManager.getLanguage() : 'ko';
      const koContent = document.getElementById('post-content-ko');
      const jaContent = document.getElementById('post-content-ja');
      
      if (koContent && jaContent) {
        if (currentLang === 'ja') {
          koContent.style.display = 'none';
          jaContent.style.display = 'block';
        } else {
          koContent.style.display = 'block';
          jaContent.style.display = 'none';
        }
      }
    }
    
    // 언어 변경 이벤트 리스너
    document.addEventListener('languageChanged', updatePostContent);
    
    // 페이지 로드 시 실행
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', updatePostContent);
    } else {
      updatePostContent();
    }
    
    // 🦆 태그 확인 및 AES 버튼 표시
    document.addEventListener('DOMContentLoaded', function() {
      const tagsContainer = document.querySelector('.post-tags');
      if (tagsContainer && tagsContainer.textContent.includes('🦆')) {
        const aesSection = document.getElementById('aes-decrypt-section');
        if (aesSection) {
          aesSection.style.display = 'block';
        }
      }

      // 로그인 상태 확인 → 수정 버튼 표시
      const token = localStorage.getItem('github_token');
      if (token) {
        const editBtn = document.getElementById('edit-post-btn');
        if (editBtn) {
          editBtn.style.display = '';
        }
      }
    });
  </script>

  <!-- CryptoJS 라이브러리 -->
  <script src="../../static/js/crypto.js"></script>
  
  <!-- AES 모달 -->
  <script src="../../static/js/aes-modal.js"></script>

  <script src="../../static/js/language.js"></script>
  <script>
    // 관리자 로그인 상태 체크 및 로그아웃 처리
    (function() {
      var adminLink = document.querySelector('.admin-link');
      if (!adminLink) return;

      var isLoggedIn = !!localStorage.getItem('github_token');

      if (isLoggedIn) {
        adminLink.classList.add('logged-in');
        adminLink.title = '로그아웃';
      }

      adminLink.addEventListener('click', function(e) {
        if (isLoggedIn) {
          e.preventDefault();
          localStorage.removeItem('github_token');
          localStorage.removeItem('github_config');
          isLoggedIn = false;
          adminLink.classList.remove('logged-in');
          adminLink.title = '관리자 로그인';
          adminLink.href = '../../admin/login.html';
        } else {
          localStorage.setItem('return_url', window.location.href);
        }
      });
    })();
  </script>
  <!-- 태그/도전 툴팁 -->
  <div id="post-tag-tooltip" class="post-tag-tooltip"></div>
  <script>
    (function() {
      var tooltip = document.getElementById('post-tag-tooltip');
      if (!tooltip) return;

      var locked = false;
      var lockedEl = null;
      var hoverTimeout = null;

      function getTooltipText(key) {
        if (!window.langManager) return '';
        var text = window.langManager.getUIText(key);
        // getUIText returns the key itself when translation is missing or empty
        return (text && text !== key) ? text : '';
      }

      function positionTooltip(el) {
        var rect = el.getBoundingClientRect();
        var tipW = tooltip.offsetWidth;
        var tipH = tooltip.offsetHeight;
        var left = rect.left + rect.width / 2 - tipW / 2;
        var top = rect.top - tipH - 8;
        // 화면 가장자리 보정
        if (left < 8) left = 8;
        if (left + tipW > window.innerWidth - 8) left = window.innerWidth - tipW - 8;
        // 위쪽 공간이 부족하면 아래에 표시
        if (top < 8) top = rect.bottom + 8;
        tooltip.style.left = left + 'px';
        tooltip.style.top = top + 'px';
      }

      function showTooltip(el) {
        clearTimeout(hoverTimeout);
        var key = el.dataset.tooltipKey;
        if (!key) return;
        var text = getTooltipText(key);
        if (!text) return;
        tooltip.innerHTML = text;
        // 잠깐 숨겨서 크기 측정 후 위치 지정
        tooltip.style.visibility = 'hidden';
        tooltip.style.display = 'block';
        positionTooltip(el);
        tooltip.style.visibility = '';
        tooltip.classList.add('hover-visible');
      }

      function hideTooltip() {
        tooltip.classList.remove('hover-visible');
        if (!locked) tooltip.style.display = 'none';
      }

      function scheduleHide() {
        hoverTimeout = setTimeout(function() {
          if (!locked) hideTooltip();
        }, 80);
      }

      function attachTooltips() {
        var elements = document.querySelectorAll('[data-tooltip-key]');
        elements.forEach(function(el) {
          el.style.cursor = 'pointer';

          el.addEventListener('mouseenter', function() {
            if (!locked) showTooltip(el);
          });
          el.addEventListener('mouseleave', function() {
            if (!locked) scheduleHide();
          });
          el.addEventListener('click', function(e) {
            e.stopPropagation();
            if (locked && lockedEl === el) {
              locked = false;
              lockedEl = null;
              tooltip.classList.remove('click-locked');
              hideTooltip();
            } else {
              locked = true;
              lockedEl = el;
              showTooltip(el);
              tooltip.classList.remove('hover-visible');
              tooltip.classList.add('click-locked');
            }
          });
        });
      }

      document.addEventListener('click', function(e) {
        if (locked && !e.target.closest('[data-tooltip-key]')) {
          locked = false;
          lockedEl = null;
          tooltip.classList.remove('click-locked');
          hideTooltip();
        }
      });

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', attachTooltips);
      } else {
        attachTooltips();
      }
    })();
  </script>

  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('../../sw.js');}</script>
</body>
</html>
