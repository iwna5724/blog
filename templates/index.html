<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{blogDescription}}">

  <!-- 🔒 검색엔진 차단 (개인 블로그) -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">

  <title>{{blogTitle}}</title>

  <link rel="icon" type="image/x-icon" href="./static/images/favicon.ico">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#667eea">
  <link rel="apple-touch-icon" href="./static/images/icon-192.png">

  <link rel="stylesheet" href="./static/css/style.css">

  <script src="./static/js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav class="nav">
        <a href="./" class="logo">{{blogTitle}}</a>
        <div class="nav-links">
          <a href="./changelog.html" class="changelog-link" data-i18n="nav.changelog">패치노트</a>
          <a href="./lists.html" data-i18n="nav.lists">일기</a>
          <a href="./music.html" data-i18n="nav.music">음악</a>
          <a href="./photo.html" data-i18n="nav.photo">사진</a>
          <div class="nav-utils">
            <button id="lang-toggle" class="lang-toggle" aria-label="언어 전환">
              <img src="./static/images/flags/KOREA.svg" alt="한국어">
            </button>
            <button id="theme-toggle" class="theme-toggle" aria-label="테마 전환">
              🌙
            </button>
            <a href="./admin/login.html" class="admin-link" title="관리자 로그인">
              ⚙️
            </a>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">

      <!-- 홈 2컬럼 레이아웃: 왼쪽 프로필 사이드바 + 오른쪽 콘텐츠 -->
      <div class="home-layout">

        <!-- 왼쪽: 프로필 사이드바 -->
        <aside class="home-sidebar">
          <div class="profile-card">
            <img
              src="./static/images/avatar.png"
              alt="avatar"
              class="profile-avatar"
              onerror="this.style.display='none';this.parentElement.classList.add('no-avatar')"
            >
            <h1 class="profile-name">{{blogTitle}}</h1>
            <p class="profile-bio" data-i18n="hero.description"><a href="https://bit.ly/iwna5724" target="_blank" class="read-more" rel="noopener noreferrer">클라우드</a>의 내용물을 구현중입니다.<br>갱신은 이 사이트에서만 이루어집니다.</p>
            <div class="profile-links">
              <a href="https://github.com/iwna5724" target="_blank" rel="noopener noreferrer" class="profile-link-btn" aria-label="GitHub">
                <img src="./static/images/github.svg" alt="GitHub" class="profile-link-icon">
              </a>
              <a href="https://www.instagram.com/iwna5724/" target="_blank" rel="noopener noreferrer" class="profile-link-btn" aria-label="Instagram">
                <img src="./static/images/Instagram.svg" alt="Instagram" class="profile-link-icon">
              </a>
              <a href="https://steamcommunity.com/id/iwna5724/" target="_blank" rel="noopener noreferrer" class="profile-link-btn" aria-label="Steam">
                <img src="./static/images/steam.svg" alt="Steam" class="profile-link-icon">
              </a>
            </div>
          </div>
        </aside>

        <!-- 오른쪽: 콘텐츠 영역 -->
        <div class="home-content">

          <!-- Posts Section -->
          <section class="posts-section">
            <div class="section-header">
              <h2 class="section-title"><span data-i18n="nav.recentPosts">최근 글</span> <span class="post-count">({{totalPosts}})</span></h2>
              <a href="./lists.html" class="section-more" data-i18n="home.more">더 보기 →</a>
            </div>

            <div class="posts-list">
              {{posts}}
            </div>

            <!-- Empty State -->
            {{emptyState}}
          </section>

          <!-- Recent Music Section -->
          {{recentMusicSection}}

          <!-- Recent Photos Section -->
          {{recentPhotosSection}}

          <!-- Recent Changelog Section -->
          {{recentChangelogSection}}

        </div>
      </div>

    </div>
  </main>

  <script src="./static/js/language.js"></script>
  <script>
    // 최근 변경사항 런타임 렌더링
    (function() {
      const catLabels = { blog: '블로그', diary: '일기', music: '음악', photo: '사진' };
      const catLabelsJa = { blog: 'ブログ', diary: '日記', music: '音楽', photo: '写真' };

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g,'&amp;').replace(/</g,'&lt;')
          .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      function renderChangelog(entries, lang) {
        const list = document.getElementById('home-changelog-list');
        if (!list) return;
        const labels = lang === 'ja' ? catLabelsJa : catLabels;
        // commitHash가 같은 항목끼리 그룹핑 (하나의 커밋 = 하나의 항목)
        const sorted = [...entries].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
        const groups = [];
        const hashIdx = {};
        sorted.forEach(e => {
          if (e.commitHash) {
            if (hashIdx[e.commitHash] !== undefined) {
              groups[hashIdx[e.commitHash]].push(e);
            } else {
              hashIdx[e.commitHash] = groups.length;
              groups.push([e]);
            }
          } else {
            groups.push([e]);
          }
        });
        const top4 = groups.slice(0, 4);
        list.innerHTML = top4.map(group => {
          const first = group[0];
          const cat = first.category || 'blog';
          const allKo = group.map(e => typeof e.description === 'object' ? (e.description.ko || '') : (e.description || ''));
          const allJa = group.map(e => typeof e.description === 'object' ? (e.description.ja || e.description.ko || '') : (e.description || ''));
          const descHtml = (lang === 'ja' ? allJa : allKo).map(escapeHtml).join('<br>');
          const commitLink = first.commitHash
            ? `<a class="changelog-commit-link" href="https://github.com/iwna5724/blog/commit/${encodeURIComponent(first.commitHash)}" target="_blank" rel="noopener noreferrer">🔗</a>`
            : '';
          const diaryLinks = group
            .filter(e => (e.category || 'blog') === 'diary' && e.slug)
            .map(e => `<a class="changelog-commit-link" href="./posts/${encodeURIComponent(e.slug)}/index.html">📄</a>`)
            .join('');
          return `<li class="home-changelog-item" data-desc-ko="${escapeHtml(allKo.join('\n'))}" data-desc-ja="${escapeHtml(allJa.join('\n'))}">
            <span class="home-changelog-date">${escapeHtml(first.date)}</span>
            <span class="home-changelog-cat cat-${cat}">${escapeHtml(labels[cat] || cat)}</span>
            <span class="home-changelog-desc">${descHtml}</span>
            ${commitLink}${diaryLinks}
          </li>`;
        }).join('');
      }

      let _entries = [];

      fetch('./changelog/changelog_data.json')
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(data => {
          _entries = data.entries || [];
          const lang = (window.langManager && window.langManager.currentLang)
            || localStorage.getItem('blog_language') || 'ko';
          renderChangelog(_entries, lang);
        })
        .catch(() => {});

      // 언어 전환 시 재렌더링
      window.addEventListener('languagechange', function(e) {
        if (_entries.length) renderChangelog(_entries, (e.detail && e.detail.language) || 'ko');
      });
    })();
  </script>
  <script>
    // 관리자 로그인 상태 체크 및 로그아웃 처리
    (function() {
      var adminLink = document.querySelector('.admin-link');
      if (!adminLink) return;

      var isLoggedIn = !!localStorage.getItem('github_token');

      if (isLoggedIn) {
        adminLink.classList.add('logged-in');
        adminLink.title = '로그아웃';
      }

      adminLink.addEventListener('click', function(e) {
        if (isLoggedIn) {
          e.preventDefault();
          localStorage.removeItem('github_token');
          localStorage.removeItem('github_config');
          isLoggedIn = false;
          adminLink.classList.remove('logged-in');
          adminLink.title = '관리자 로그인';
          adminLink.href = './admin/login.html';
        } else {
          localStorage.setItem('return_url', window.location.href);
        }
      });
    })();
  </script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js');}</script>
</body>
</html>
