<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{blogDescription}}">
  
  <!-- 🔒 검색엔진 차단 (개인 블로그) -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  
  <title>{{blogTitle}}</title>
  
  <link rel="icon" type="image/x-icon" href="./static/images/favicon.ico">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#667eea">
  <link rel="apple-touch-icon" href="./static/images/icon-192.png">

  <link rel="stylesheet" href="./static/css/style.css">
  
  <script src="./static/js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav class="nav">
        <a href="./" class="logo">{{blogTitle}}</a>
        <div class="nav-links">
          <a href="./changelog.html" class="changelog-link" data-i18n="nav.changelog">변경사항</a>
          <a href="./lists.html" data-i18n="nav.lists">일기</a>
          <a href="./music.html" data-i18n="nav.music">음악</a>
          <a href="./photo.html" data-i18n="nav.photo">사진</a>
          <div class="nav-utils">
            <button id="lang-toggle" class="lang-toggle" aria-label="언어 전환">
              <img src="./static/images/flags/KOREA.svg" alt="한국어">
            </button>
            <button id="theme-toggle" class="theme-toggle" aria-label="테마 전환">
              🌙
            </button>
            <a href="./admin/login.html" class="admin-link" title="관리자 로그인">
              ⚙️
            </a>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <!-- Hero Section -->
      <section class="hero">
        <p class="hero-description" data-i18n="hero.description"><a href="https://bit.ly/iwna5724" target="_blank" class="read-more" rel="noopener noreferrer">클라우드</a>의 내용물을 구현하는 작업 중입니다.<br>새로운 글은 이 사이트에서만 갱신됩니다.</p>
        
        <!-- Search Box -->
        <div class="search-container">
          <input 
            type="text" 
            id="search-input" 
            class="search-input" 
            placeholder="검색 - 타이틀 / 날짜(YY/MM/DD 혹은 YY-MM-DD)"
            data-i18n-placeholder="search.placeholder"
            autocomplete="off"
          >
          <div id="search-results" class="search-results"></div>
        </div>
      </section>

      <!-- Posts Section -->
      <section class="posts-section">
        <div class="section-header">
          <h2 class="section-title"><span data-i18n="nav.recentPosts">최근 글</span> <span class="post-count">({{totalPosts}})</span></h2>
        </div>
        
        <div class="posts-list">
          {{posts}}
        </div>

        <!-- Empty State -->
        {{emptyState}}
      </section>
    </div>
  </main>

  <script src="./static/js/language.js"></script>
  <script src="./static/js/search.js"></script>
  <script>
    // 관리자 로그인 상태 체크 및 로그아웃 처리
    (function() {
      var adminLink = document.querySelector('.admin-link');
      if (!adminLink) return;

      var isLoggedIn = !!localStorage.getItem('github_token');

      if (isLoggedIn) {
        adminLink.classList.add('logged-in');
        adminLink.title = '로그아웃';
      }

      adminLink.addEventListener('click', function(e) {
        if (isLoggedIn) {
          e.preventDefault();
          localStorage.removeItem('github_token');
          localStorage.removeItem('github_config');
          isLoggedIn = false;
          adminLink.classList.remove('logged-in');
          adminLink.title = '관리자 로그인';
          adminLink.href = './admin/login.html';
        } else {
          localStorage.setItem('return_url', window.location.href);
        }
      });
    })();
  </script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js');}</script>
</body>
</html>
