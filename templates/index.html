<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{blogDescription}}">
  
  <!-- 🔒 검색엔진 차단 (개인 블로그) -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  
  <title>{{blogTitle}}</title>
  
  <link rel="icon" type="image/x-icon" href="./static/images/favicon.ico">
  <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav class="nav">
        <a href="./" class="logo">{{blogTitle}}</a>
        <div class="nav-links">
          <a href="./index.html" data-i18n="nav.home">홈</a>
          <a href="./lists.html" data-i18n="nav.tags">글 목록</a>
          <button id="lang-toggle" class="lang-toggle" aria-label="언어 전환">
            <img src="./static/images/flags/KOREA.svg" alt="한국어">
          </button>
          <button id="theme-toggle" class="theme-toggle" aria-label="테마 전환">
            🌙
          </button>
          <a href="./admin/login.html" class="admin-link" title="관리자 로그인">
            ⚙️
          </a>
        </div>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <!-- Hero Section -->
      <section class="hero">
        <p class="hero-description" data-i18n="hero.description"><a href="https://bit.ly/iwna5724" target="_blank" rel="noopener noreferrer">클라우드</a>의 내용물을 구현하는 작업 중입니다.<br>새로운 글은 이 사이트에서만 갱신됩니다.</p>
        
        <!-- Search Box -->
        <div class="search-container">
          <input 
            type="text" 
            id="search-input" 
            class="search-input" 
            placeholder="글 검색... (Ctrl+K)"
            autocomplete="off"
          >
          <div id="search-results" class="search-results"></div>
        </div>
      </section>

      <!-- Posts Section -->
      <section class="posts-section">
        <div class="section-header">
          <h2 class="section-title"><span data-i18n="nav.recentPosts">최근 글</span> <span class="post-count">({{totalPosts}})</span></h2>
        </div>
        
        <div class="posts-list">
          {{posts}}
        </div>

        <!-- Empty State -->
        {{emptyState}}
      </section>
    </div>
  </main>

  <script src="./static/js/theme.js"></script>
  <script src="./static/js/language.js"></script>
  <script src="./static/js/search.js"></script>
</body>
</html>
