<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 🔒 검색엔진 차단 (개인 블로그) -->
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">

<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">

<title>음악 - {{blogTitle}}</title>

<link rel="icon" type="image/x-icon" href="./static/images/favicon.ico">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#667eea">
<link rel="apple-touch-icon" href="./static/images/icon-192.png">

<link rel="stylesheet" href="./static/css/style.css">
<link rel="stylesheet" href="./static/css/music.css">

<script src="./static/js/theme.js"></script>
<script src="./static/js/language.js"></script>
</head>
<body>

<!-- Header -->
<header class="site-header">
  <div class="container">
    <nav class="nav">
      <a href="./index.html" class="logo">{{blogTitle}}</a>
      <div class="nav-links">
        <a href="./lists.html" data-i18n="nav.lists">글 목록</a>
        <a href="./music.html" data-i18n="nav.music">음악</a>
        <button id="lang-toggle" class="lang-toggle" aria-label="언어 전환">
          <img src="./static/images/flags/KOREA.svg" alt="한국어">
        </button>
        <button id="theme-toggle" class="theme-toggle" aria-label="테마 전환">🌙</button>
        <a href="./admin/login.html" class="admin-link" title="관리자 로그인">⚙️</a>
      </div>
    </nav>
  </div>
</header>

<!-- Main Content -->
<main class="main-content">
  <div class="tags-header" style="text-align: center; margin-bottom: 40px;">
    <h1 class="page-title" data-i18n="music.pageTitle">앨범 그리드</h1>
    <p class="page-subtitle" data-i18n="music.pageSubtitle">그리드의 각 셀을 클릭하면 해당 앨범에 대한 정보를 확인할 수 있습니다.<br>로딩에 다소 시간이 소요될 수 있습니다.</p>
  </div>

  <div class="view-toggle">
    <button id="btn-grid" class="view-toggle-btn active" data-i18n="music.viewGrid">그리드로 보기</button>
    <button id="btn-list" class="view-toggle-btn" data-i18n="music.viewList">리스트로 보기</button>
  </div>

  <div id="album-container">
    <div id="album-grid" class="grid"></div>
  </div>

  <div id="album-list-container" style="display: none;">
    <button id="btn-mobile-sort" class="mobile-sort-btn" data-i18n="music.sortCriteria">정렬 기준</button>
    <table class="album-list-table">
      <thead>
        <tr>
          <th class="sortable" data-sort="id" data-i18n="music.list.id">ID</th>
          <th data-i18n="music.list.cover">앨범 커버</th>
          <th class="sortable" data-sort="artist" data-i18n="music.list.artist">아티스트</th>
          <th data-i18n="music.list.albumName">앨범명</th>
          <th class="sortable desktop-only" data-sort="release" data-i18n="music.list.release">발매일</th>
          <th class="sortable desktop-only" data-sort="duration" data-i18n="music.list.duration">재생 시간</th>
          <th class="sortable desktop-only" data-sort="rating" data-i18n="music.list.rating">선호도</th>
          <th class="sortable desktop-only" data-sort="category" data-i18n="music.list.category">구분</th>
        </tr>
      </thead>
      <tbody id="album-list-body"></tbody>
    </table>
  </div>

  <!-- Mobile Sort Modal -->
  <div id="sort-modal" class="sort-modal-overlay">
    <div class="sort-modal-content">
      <div class="sort-modal-header">
        <span data-i18n="music.sortCriteria">정렬 기준</span>
        <button class="modal-close" onclick="closeSortModal()">✕</button>
      </div>
      <div class="sort-modal-options">
        <button class="sort-option" data-sort="id" data-i18n="music.list.id">ID</button>
        <button class="sort-option" data-sort="artist" data-i18n="music.list.artist">아티스트</button>
        <button class="sort-option" data-sort="release" data-i18n="music.list.release">발매일</button>
        <button class="sort-option" data-sort="duration" data-i18n="music.list.duration">재생 시간</button>
        <button class="sort-option" data-sort="rating" data-i18n="music.list.rating">선호도</button>
        <button class="sort-option" data-sort="category" data-i18n="music.list.category">구분</button>
      </div>
    </div>
  </div>
</main>

<!-- Modal -->
<div id="album-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <div id="modal-category" class="modal-category-badge"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-image-wrapper">
        <img id="modal-image" class="modal-image" src="" alt="Album Cover">
      </div>
      <div class="modal-info">
        <div class="modal-info-item">
          <span class="modal-info-label" data-i18n="music.artistAlbum">아티스트・앨범명</span>
          <span id="modal-artist-album" class="modal-info-value"></span>
        </div>
        <div class="modal-info-item">
          <span class="modal-info-label" data-i18n="music.releaseDate">발매일</span>
          <span id="modal-release" class="modal-info-value"></span>
        </div>
        <div class="modal-info-item">
          <span class="modal-info-label" data-i18n="music.duration">재생 시간</span>
          <span id="modal-duration" class="modal-info-value"></span>
        </div>
        <div class="modal-info-item">
          <span class="modal-info-label" data-i18n="music.rating">개인적 선호도</span>
          <span id="modal-rating" class="modal-info-value rating"></span>
        </div>
        <div class="modal-info-item">
          <span class="modal-info-label" data-i18n="music.favTrack">최애 트랙</span>
          <span id="modal-fav-track" class="modal-info-value"></span>
        </div>
        <a id="modal-link" class="modal-spotify-link" href="#" target="_blank" rel="noopener noreferrer" style="display:none;">
          <img src="./static/images/spotify.png" alt="spotify">
        </a>
      </div>
    </div>
  </div>
</div>

<script>
// ================================
// i18n helpers
// ================================
const lang = window.langManager;
const noInfo = lang.getUIText('music.noInfo');
const defaultCategory = lang.getUIText('music.defaultCategory');
const trackExcludeSuffix = lang.getUIText('music.trackExcludeSuffix');

// 카테고리 번역 맵
const categoryMap = {
  '보유중인 CD': lang.getUIText('music.category.ownedCD'),
  '앨범': lang.getUIText('music.category.album'),
  '싱글': lang.getUIText('music.category.single'),
  'EP': lang.getUIText('music.category.ep')
};

function translateCategory(cat) {
  return categoryMap[cat] || cat || defaultCategory;
}

// Update page title
document.title = lang.getUIText('music.title') + '{{blogTitle}}';

// ================================
// View Toggle (localStorage 연동)
// ================================
const btnGrid = document.getElementById('btn-grid');
const btnList = document.getElementById('btn-list');
const albumContainer = document.getElementById('album-container');
const albumListContainer = document.getElementById('album-list-container');

function setView(mode) {
  localStorage.setItem('music_view_mode', mode);
  if (mode === 'list') {
    btnList.classList.add('active');
    btnGrid.classList.remove('active');
    albumContainer.style.display = 'none';
    albumListContainer.style.display = '';
    renderList();
  } else {
    btnGrid.classList.add('active');
    btnList.classList.remove('active');
    albumContainer.style.display = '';
    albumListContainer.style.display = 'none';
  }
}

btnGrid.addEventListener('click', () => setView('grid'));
btnList.addEventListener('click', () => setView('list'));

// ================================
// Album Grid
// ================================
const albumGrid = document.getElementById('album-grid');
let cells = [];

// Load data from JSON file
async function loadData() {
  try {
    const response = await fetch('./album/album_data.json');
    const data = await response.json();
    cells = data.cells || [];
  } catch (e) {
    console.log('No data file found');
    cells = [];
  }
}

// Initialize
loadData().then(() => {
  createGrid();
  // localStorage에서 뷰 모드 복원
  const savedView = localStorage.getItem('music_view_mode');
  if (savedView === 'list') {
    setView('list');
  }
});

// Create grid cells
function createGrid() {
  albumGrid.innerHTML = '';

  let id = 1;
  const gridSize = 15;
  const centerStart = 6;
  const centerEnd = 10;

  for (let r = 1; r <= gridSize; r++) {
    for (let c = 1; c <= gridSize; c++) {
      if (r >= centerStart && r <= centerEnd && c >= centerStart && c <= centerEnd) {
        if (r === centerStart && c === centerStart) {
          const cell = document.createElement('div');
          cell.className = 'cell center-cell';
          cell.dataset.id = 0;
          cell.style.gridColumn = `${centerStart} / span 5`;
          cell.style.gridRow = `${centerStart} / span 5`;

          const cellData = cells.find(c => c.id === 0);
          if (cellData && cellData.img) {
            const img = document.createElement('img');
            img.src = cellData.img;
            cell.appendChild(img);
            cell.onclick = () => openModal(cellData);
          }

          albumGrid.appendChild(cell);
        }
      } else {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.id = id;

        const cellData = cells.find(c => c.id === id);
        if (cellData && cellData.img) {
          const img = document.createElement('img');
          img.src = cellData.img;
          cell.appendChild(img);
          cell.onclick = () => openModal(cellData);
        }

        albumGrid.appendChild(cell);
        id++;
      }
    }
  }
}

// ================================
// Album List
// ================================
const albumListBody = document.getElementById('album-list-body');
let currentSort = { key: 'id', asc: true };

// 구분 정렬 우선순위
const categoryOrder = { '보유중인 CD': 0, '앨범': 1, 'EP': 2, '싱글': 3 };

// 재생 시간을 초 단위로 변환 (MM:SS → 0:MM:SS, HH:MM:SS → HH:MM:SS)
function durationToSeconds(d) {
  if (!d || !d.trim()) return -1;
  const parts = d.trim().split(':').map(Number);
  if (parts.some(isNaN)) return -1;
  if (parts.length === 2) return parts[0] * 60 + parts[1];
  if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
  return -1;
}

// 아티스트 주 이름 추출 (콤마 앞)
function getPrimaryArtist(artist) {
  if (!artist) return '';
  return artist.split(',')[0].trim().toLowerCase();
}

// 아티스트 출현 빈도 계산 (주 이름 기준)
function buildArtistFrequency(arr) {
  const freq = {};
  arr.forEach(c => {
    const primary = getPrimaryArtist(c.artist);
    if (primary) freq[primary] = (freq[primary] || 0) + 1;
  });
  return freq;
}

function sortCells(arr, key, asc) {
  let artistFreq = null;
  if (key === 'artist') {
    artistFreq = buildArtistFrequency(arr);
  }

  return [...arr].sort((a, b) => {
    let va, vb;
    if (key === 'category') {
      va = categoryOrder[a.category] !== undefined ? categoryOrder[a.category] : 99;
      vb = categoryOrder[b.category] !== undefined ? categoryOrder[b.category] : 99;
    } else if (key === 'rating') {
      va = a.rating || 0;
      vb = b.rating || 0;
    } else if (key === 'id') {
      va = a.id;
      vb = b.id;
    } else if (key === 'release') {
      va = (a.release || '').replace(/\./g, '');
      vb = (b.release || '').replace(/\./g, '');
    } else if (key === 'duration') {
      va = durationToSeconds(a.duration);
      vb = durationToSeconds(b.duration);
    } else if (key === 'artist') {
      // 1차: 출현 빈도 (내림차순이 기본 오름차순)
      const pa = getPrimaryArtist(a.artist);
      const pb = getPrimaryArtist(b.artist);
      const fa = artistFreq[pa] || 0;
      const fb = artistFreq[pb] || 0;
      if (fa !== fb) {
        return asc ? fb - fa : fa - fb;
      }
      // 2차: 이름 순
      if (pa !== pb) {
        va = pa;
        vb = pb;
      } else {
        // 3차: 같은 주 아티스트 내에서 콤마 있는 항목(합작)은 뒤로
        const ca = (a.artist || '').includes(',') ? 1 : 0;
        const cb = (b.artist || '').includes(',') ? 1 : 0;
        va = asc ? ca : cb;
        vb = asc ? cb : ca;
      }
    } else {
      va = a[key] || '';
      vb = b[key] || '';
    }
    if (va < vb) return asc ? -1 : 1;
    if (va > vb) return asc ? 1 : -1;
    return 0;
  });
}

function renderList() {
  const filtered = cells.filter(c => c.img);
  const sorted = sortCells(filtered, currentSort.key, currentSort.asc);

  albumListBody.innerHTML = '';
  sorted.forEach(cell => {
    const tr = document.createElement('tr');

    // ID
    const tdId = document.createElement('td');
    tdId.textContent = cell.id;
    tdId.className = 'list-cell-id';
    tr.appendChild(tdId);

    // 이미지
    const tdImg = document.createElement('td');
    if (cell.img) {
      const img = document.createElement('img');
      img.src = cell.img;
      img.className = 'list-cover-img';
      img.onclick = () => openModal(cell);
      tdImg.appendChild(img);
    }
    tr.appendChild(tdImg);

    // 아티스트
    const tdArtist = document.createElement('td');
    tdArtist.textContent = cell.artist || noInfo;
    if (!cell.artist) tdArtist.className = 'empty';
    tr.appendChild(tdArtist);

    // 앨범명
    const tdAlbum = document.createElement('td');
    tdAlbum.textContent = cell.album || noInfo;
    if (!cell.album) tdAlbum.className = 'empty';
    tr.appendChild(tdAlbum);

    // 발매일
    const tdRelease = document.createElement('td');
    tdRelease.textContent = cell.release || noInfo;
    tdRelease.className = 'desktop-only' + (!cell.release ? ' empty' : '');
    tr.appendChild(tdRelease);

    // 재생 시간
    const tdDuration = document.createElement('td');
    tdDuration.textContent = cell.duration || noInfo;
    tdDuration.className = 'desktop-only' + (!cell.duration ? ' empty' : '');
    tr.appendChild(tdDuration);

    // 선호도
    const tdRating = document.createElement('td');
    if (cell.rating && cell.rating > 0) {
      tdRating.textContent = getRatingStars(cell.rating);
      tdRating.className = 'desktop-only list-rating';
    } else {
      tdRating.textContent = noInfo;
      tdRating.className = 'desktop-only empty';
    }
    tr.appendChild(tdRating);

    // 구분
    const tdCategory = document.createElement('td');
    tdCategory.textContent = translateCategory(cell.category);
    tdCategory.className = 'desktop-only';
    tr.appendChild(tdCategory);

    albumListBody.appendChild(tr);
  });

  updateSortIndicators();
}

function updateSortIndicators() {
  document.querySelectorAll('.album-list-table th.sortable').forEach(th => {
    th.classList.remove('sort-asc', 'sort-desc');
    if (th.dataset.sort === currentSort.key) {
      th.classList.add(currentSort.asc ? 'sort-asc' : 'sort-desc');
    }
  });
}

// 정렬 클릭 이벤트
document.querySelectorAll('.album-list-table th.sortable').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    if (currentSort.key === key) {
      currentSort.asc = !currentSort.asc;
    } else {
      currentSort.key = key;
      currentSort.asc = true;
    }
    renderList();
  });
});

// ================================
// Modal Functions
// ================================
const modal = document.getElementById('album-modal');
const modalImage = document.getElementById('modal-image');
const modalCategory = document.getElementById('modal-category');
const modalArtistAlbum = document.getElementById('modal-artist-album');
const modalRelease = document.getElementById('modal-release');
const modalDuration = document.getElementById('modal-duration');
const modalRating = document.getElementById('modal-rating');
const modalFavTrack = document.getElementById('modal-fav-track');
const modalLink = document.getElementById('modal-link');

function getRatingStars(rating) {
  const filled = '★';
  const empty = '☆';
  return filled.repeat(rating) + empty.repeat(5 - rating);
}

function openModal(cell) {
  if (!cell.img) return;

  modal.classList.add('active');
  modalImage.src = cell.img;

  // 카테고리 (번역 적용)
  modalCategory.textContent = translateCategory(cell.category);

  // 아티스트・앨범명 통합 표시
  const hasArtist = cell.artist && cell.artist.trim();
  const hasAlbum = cell.album && cell.album.trim();
  if (hasArtist && hasAlbum) {
    modalArtistAlbum.textContent = `${cell.artist} ・ ${cell.album}`;
    modalArtistAlbum.className = 'modal-info-value';
  } else if (hasArtist) {
    modalArtistAlbum.textContent = cell.artist;
    modalArtistAlbum.className = 'modal-info-value';
  } else if (hasAlbum) {
    modalArtistAlbum.textContent = cell.album;
    modalArtistAlbum.className = 'modal-info-value';
  } else {
    modalArtistAlbum.textContent = noInfo;
    modalArtistAlbum.className = 'modal-info-value empty';
  }

  // 발매일
  modalRelease.textContent = cell.release || noInfo;
  modalRelease.className = cell.release ? 'modal-info-value' : 'modal-info-value empty';

  // 재생 시간 (제외 트랙 조건부 표시)
  if (cell.duration && cell.duration.trim()) {
    let durationText = cell.duration.trim();
    if (cell.excludedTracks && cell.excludedTracks.trim()) {
      durationText += ` (${cell.excludedTracks.trim()}${trackExcludeSuffix})`;
    }
    modalDuration.textContent = durationText;
    modalDuration.className = 'modal-info-value';
  } else {
    modalDuration.textContent = noInfo;
    modalDuration.className = 'modal-info-value empty';
  }

  // 개인적 선호도
  if (cell.rating && cell.rating > 0) {
    modalRating.textContent = getRatingStars(cell.rating);
    modalRating.className = 'modal-info-value rating';
  } else {
    modalRating.textContent = noInfo;
    modalRating.className = 'modal-info-value empty';
  }

  // 최애 트랙
  if (cell.favTrack && cell.favTrack.trim()) {
    modalFavTrack.textContent = cell.favTrack.trim();
    modalFavTrack.className = 'modal-info-value';
  } else {
    modalFavTrack.textContent = noInfo;
    modalFavTrack.className = 'modal-info-value empty';
  }

  // 링크 (Spotify 아이콘)
  if (cell.link) {
    modalLink.href = cell.link;
    modalLink.style.display = '';
  } else {
    modalLink.style.display = 'none';
  }
}

function closeModal() {
  modal.classList.remove('active');
}

modal.addEventListener('click', (e) => {
  if (e.target === modal) {
    closeModal();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeModal();
    closeSortModal();
  }
});

// ================================
// Mobile Sort Modal
// ================================
const sortModal = document.getElementById('sort-modal');

document.getElementById('btn-mobile-sort').addEventListener('click', () => {
  // 현재 정렬 상태 반영
  sortModal.querySelectorAll('.sort-option').forEach(btn => {
    btn.classList.remove('active', 'sort-asc', 'sort-desc');
    if (btn.dataset.sort === currentSort.key) {
      btn.classList.add('active', currentSort.asc ? 'sort-asc' : 'sort-desc');
    }
  });
  sortModal.classList.add('active');
});

function closeSortModal() {
  sortModal.classList.remove('active');
}

sortModal.addEventListener('click', (e) => {
  if (e.target === sortModal) closeSortModal();
});

sortModal.querySelectorAll('.sort-option').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.sort;
    if (currentSort.key === key) {
      currentSort.asc = !currentSort.asc;
    } else {
      currentSort.key = key;
      currentSort.asc = true;
    }
    renderList();
    closeSortModal();
  });
});
</script>

<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js');}</script>
</body>
</html>
