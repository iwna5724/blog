<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{blogTitle}}의 모든 태그">
  
  <!-- 🔒 검색엔진 차단 (개인 블로그) -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  
  <title>모든 태그 - {{blogTitle}}</title>
  
  <link rel="stylesheet" href="./static/css/style.css">
  
  <style>
    .tags-header {
      margin-bottom: 40px;
      text-align: center;
    }
    
    .tags-title {
      font-size: 2.5rem;
      margin-bottom: 15px;
      color: var(--text-primary);
    }
    
    .tags-subtitle {
      font-size: 1.1rem;
      color: var(--text-secondary);
    }
    
    .all-tags-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }
    
    .tag-card {
      background: var(--bg-secondary);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      text-decoration: none;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .tag-card:hover {
      border-color: var(--accent-primary);
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.15);
    }
    
    .tag-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .tag-card-icon {
      font-size: 1.5rem;
    }
    
    .tag-card-name {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .tag-card-count {
      font-size: 0.95rem;
      color: var(--text-secondary);
    }
    
    .tag-card-bar {
      height: 4px;
      background: var(--border-color);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
    }
    
    .tag-card-bar-fill {
      height: 100%;
      background: var(--accent-primary);
      transition: width 0.3s ease;
    }
    
    .back-link-container {
      margin-top: 60px;
      text-align: center;
    }
    
    .back-link {
      color: var(--text-secondary);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: color 0.2s;
      font-size: 1rem;
    }
    
    .back-link:hover {
      color: var(--accent-primary);
    }
    
    @media (max-width: 768px) {
      .all-tags-grid {
        grid-template-columns: 1fr;
      }
      
      .tags-title {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav class="nav">
        <a href="./index.html" class="logo">{{blogTitle}}</a>
        <div class="nav-links">
          <a href="./index.html">홈</a>
          <a href="./tags.html" class="active">태그</a>
          <button id="lang-toggle" class="lang-toggle" aria-label="언어 전환">
            <img src="./static/images/flags/KOREA.svg" alt="한국어">
          </button>
          <button id="theme-toggle" class="theme-toggle" aria-label="테마 전환">
            ☀️
          </button>
          <a href="./admin/login.html" class="admin-link" title="관리자 로그인">
            ⚙️
          </a>
        </div>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div class="tags-header">
        <h1 class="tags-title">🏷️ 모든 태그</h1>
        <p class="tags-subtitle">총 {{tagCount}}개의 태그</p>
      </div>

      <div class="all-tags-grid">
        {{tagsGrid}}
      </div>

      <div class="back-link-container">
        <a href="./index.html" class="back-link">
          ← 홈으로 돌아가기
        </a>
      </div>
    </div>
  </main>

  <script src="./static/js/theme.js"></script>
  <script src="./static/js/language.js"></script>
</body>
</html>
