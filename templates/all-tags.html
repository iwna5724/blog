<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모든 태그 - {{blogTitle}}</title>
  <link rel="stylesheet" href="./static/css/style.css">
  <style>
    .tags-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .tags-header {
      text-align: center;
      margin-bottom: 48px;
    }

    .tags-header h1 {
      font-size: 36px;
      font-weight: 700;
      color: #333;
      margin-bottom: 12px;
    }

    .tags-header p {
      font-size: 18px;
      color: #666;
    }

    /* 태그 섹션 */
    .tag-section {
      margin-bottom: 60px;
    }

    .tag-section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 3px solid #667eea;
    }

    .tag-section-header h2 {
      font-size: 28px;
      font-weight: 700;
      color: #333;
      margin: 0;
    }

    .tag-section-badge {
      background: #667eea;
      color: white;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 600;
    }

    /* 태그 그리드 */
    .tags-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .tag-card {
      background: white;
      border: 2px solid #e1e8ed;
      border-radius: 12px;
      padding: 20px;
      text-decoration: none;
      transition: all 0.3s;
      display: block;
    }

    .tag-card:hover {
      border-color: #667eea;
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(102, 126, 234, 0.2);
    }

    .tag-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .tag-card-icon {
      font-size: 32px;
    }

    .tag-card-name {
      font-size: 18px;
      font-weight: 600;
      color: #333;
    }

    .tag-card-count {
      font-size: 14px;
      color: #666;
      margin-bottom: 12px;
    }

    .tag-card-bar {
      height: 6px;
      background: #f0f0f0;
      border-radius: 3px;
      overflow: hidden;
    }

    .tag-card-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      transition: width 0.5s ease;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .tags-container {
        padding: 24px 16px;
      }

      .tags-header h1 {
        font-size: 28px;
      }

      .tag-section-header h2 {
        font-size: 22px;
      }

      .tags-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="tags-container">
    <div class="tags-header">
      <h1>🏷️ 모든 태그</h1>
      <p>총 <strong>{{tagCount}}</strong>개의 태그</p>
    </div>

    <!-- 종류 태그 섹션 -->
    <div class="tag-section">
      <div class="tag-section-header">
        <h2>📝 종류</h2>
      </div>
      <div class="tags-grid">
        {{typeTagsGrid}}
      </div>
    </div>

    <!-- 만족도 태그 섹션 -->
    <div class="tag-section">
      <div class="tag-section-header">
        <h2>😊 만족도</h2>
      </div>
      <div class="tags-grid">
        {{satisfactionTagsGrid}}
      </div>
    </div>

    <div style="text-align: center; margin-top: 48px;">
      <a href="./index.html" class="btn-secondary">← 홈으로 돌아가기</a>
    </div>
  </div>

  <script src="./static/js/lang.js"></script>
</body>
</html>
