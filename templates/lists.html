<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{blogTitle}}의 글 목록">
  
  <!-- 🔒 검색엔진 차단 (개인 블로그) -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  
  <title>글 목록 - {{blogTitle}}</title>
  
  <link rel="stylesheet" href="./static/css/style.css">
  
  <style>
    .tags-header {
      margin-bottom: 40px;
      text-align: center;
    }
    
    .tags-title {
      font-size: 2.5rem;
      margin-bottom: 15px;
      color: var(--text-primary);
    }
    
    .tags-subtitle {
      font-size: 1.1rem;
      color: var(--text-secondary);
    }
    
    /* 태그 섹션 구분 */
    .tag-section {
      margin-bottom: 50px;
    }
    
    .tag-section-header {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border-color);
    }
    
    /* 달력 스타일 */
    .calendar-section {
      margin-bottom: 60px;
    }
    
    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 15px;
      background: var(--bg-secondary);
      border-radius: 12px;
    }
    
    .calendar-nav-btn {
      background: var(--accent-primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }
    
    .calendar-current {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 6px;
      transition: background 0.2s;
      position: relative;
    }
    
    .calendar-current:hover {
      background: var(--bg-primary);
    }
    
    /* 드롭다운 메뉴 */
    .calendar-dropdown {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 10px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      z-index: 1000;
      display: none;
      min-width: 300px;
    }
    
    .calendar-dropdown.active {
      display: block;
    }
    
    /* 드롭다운 년도 선택 */
    .dropdown-year-selector {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }
    
    .dropdown-year-btn {
      background: var(--bg-primary);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      color: var(--text-primary);
      transition: all 0.2s;
    }
    
    .dropdown-year-btn:hover {
      background: var(--accent-primary);
      color: white;
    }
    
    .dropdown-year {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    /* 드롭다운 월 목록 */
    .dropdown-months {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    
    .dropdown-month-btn {
      background: var(--bg-primary);
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      color: var(--text-primary);
      transition: all 0.2s;
      text-align: center;
    }
    
    .dropdown-month-btn:hover {
      background: var(--accent-primary);
      color: white;
      transform: scale(1.05);
    }
    
    .dropdown-month-btn.current {
      background: var(--accent-primary);
      color: white;
      font-weight: 600;
    }
    
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      background: var(--bg-primary);
      padding: 8px;
      border-radius: 12px;
    }
    
    .calendar-day-header {
      text-align: center;
      padding: 8px;
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
    
    .calendar-day {
      padding: 6px;
      border-radius: 6px;
      background: var(--bg-secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 2px;
      position: relative;
      min-height: 70px;
    }
    
    .calendar-day.empty {
      background: transparent;
    }
    
    .calendar-day.today {
      border: 2px solid var(--accent-primary);
    }
    
    .calendar-day-number {
      font-size: 0.85rem;
      color: var(--text-primary);
      font-weight: 500;
      margin-bottom: 2px;
    }
    
    .calendar-day-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      justify-content: center;
      align-items: center;
    }
    
    .calendar-day-tag {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px;
      transition: transform 0.2s;
      line-height: 1;
    }
    
    .calendar-day-tag:hover {
      transform: scale(1.15);
    }
    
    @media (max-width: 768px) {
      .calendar-header {
        flex-direction: column;
        gap: 15px;
      }
      
      .calendar-nav-btn {
        font-size: 0.9rem;
        padding: 6px 12px;
      }
      
      .calendar-current {
        font-size: 1.2rem;
      }
      
      .calendar-dropdown {
        min-width: 280px;
        left: 0;
        right: 0;
        transform: none;
        margin-left: auto;
        margin-right: auto;
      }
      
      .dropdown-months {
        grid-template-columns: repeat(4, 1fr);
      }
      
      .dropdown-month-btn {
        padding: 8px;
        font-size: 0.85rem;
      }
      
      .calendar-day {
        min-height: 60px;
        padding: 4px;
      }
      
      .calendar-day-number {
        font-size: 0.75rem;
      }
      
      .calendar-day-tag {
        font-size: 1rem;
      }
    }
    
    .all-tags-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }
    
    .tag-card {
      background: var(--bg-secondary);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      text-decoration: none;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .tag-card:hover {
      border-color: var(--accent-primary);
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.15);
    }
    
    .tag-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .tag-card-icon {
      font-size: 1.5rem;
    }
    
    .tag-card-name {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .tag-card-count {
      font-size: 0.95rem;
      color: var(--text-secondary);
    }
    
    .tag-card-bar {
      height: 4px;
      background: var(--border-color);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
    }
    
    .tag-card-bar-fill {
      height: 100%;
      background: var(--accent-primary);
      transition: width 0.3s ease;
    }
    
    .back-link-container {
      margin-top: 60px;
      text-align: center;
    }
    
    .back-link {
      color: var(--text-secondary);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: color 0.2s;
      font-size: 1rem;
    }
    
    .back-link:hover {
      color: var(--accent-primary);
    }
    
    @media (max-width: 768px) {
      .all-tags-grid {
        grid-template-columns: 1fr;
      }
      
      .tags-title {
        font-size: 2rem;
      }
      
      .tag-section-header {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav class="nav">
        <a href="./index.html" class="logo">{{blogTitle}}</a>
        <div class="nav-links">
          <a href="./index.html" data-i18n="nav.home">홈</a>
          <a href="./lists.html" class="active" data-i18n="nav.lists">글 목록</a>
          <button id="lang-toggle" class="lang-toggle" aria-label="언어 전환">
            <img src="./static/images/flags/KOREA.svg" alt="한국어">
          </button>
          <button id="theme-toggle" class="theme-toggle" aria-label="테마 전환">
            🌙
          </button>
          <a href="./admin/login.html" class="admin-link" title="관리자 로그인">
            ⚙️
          </a>
        </div>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div class="tags-header">
        <h1 class="tags-title">📅 <span data-i18n="lists.title">글 목록</span></h1>
        <p class="tags-subtitle" data-i18n="lists.subtitle">날짜별 게시물과 태그를 확인하세요</p>
      </div>

      <!-- 달력 섹션 -->
      <div class="calendar-section">
        <h2 class="tag-section-header">📆 <span data-i18n="lists.calendar">달력</span></h2>
        <div class="calendar-header">
          <button class="calendar-nav-btn" id="prev-month" data-i18n="calendar.prev">◀ 이전</button>
          <div class="calendar-current" id="current-month">
            <!-- 드롭다운 메뉴 -->
            <div class="calendar-dropdown" id="calendar-dropdown">
              <div class="dropdown-year-selector">
                <button class="dropdown-year-btn" id="dropdown-prev-year">◀</button>
                <div class="dropdown-year" id="dropdown-year"></div>
                <button class="dropdown-year-btn" id="dropdown-next-year">▶</button>
              </div>
              <div class="dropdown-months" id="dropdown-months">
                <!-- JavaScript로 생성 -->
              </div>
            </div>
          </div>
          <button class="calendar-nav-btn" id="next-month" data-i18n="calendar.next">다음 ▶</button>
        </div>
        <div class="calendar-grid" id="calendar-grid">
          <!-- JavaScript로 생성 -->
        </div>
      </div>

      <!-- 종류 태그 섹션 -->
      <div class="tag-section">
        <h2 class="tag-section-header">📝 <span data-i18n="lists.type">종류</span></h2>
        <div class="all-tags-grid">
          {{typeTagsGrid}}
        </div>
      </div>

      <!-- 만족도 태그 섹션 -->
      <div class="tag-section">
        <h2 class="tag-section-header">😊 <span data-i18n="lists.satisfaction">만족도</span></h2>
        <div class="all-tags-grid">
          {{satisfactionTagsGrid}}
        </div>
      </div>

      <div class="back-link-container">
        <a href="./index.html" class="back-link" data-i18n="backToHome">
          ← 홈으로 돌아가기
        </a>
      </div>
    </div>
  </main>

  <!-- 게시물 데이터 -->
  <script>
    const postsByDateJsonStr = `{{postsByDateJson}}`;
    const postsByDate = JSON.parse(postsByDateJsonStr);
  </script>

  <script src="./static/js/theme.js"></script>
  <script src="./static/js/language.js"></script>
  
  <!-- 달력 JavaScript -->
  <script>
    // DOM 준비 후 실행
    document.addEventListener('DOMContentLoaded', function() {
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth(); // 0-11

    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      const currentMonthEl = document.getElementById('current-month');
      
      // 월 표시 업데이트 (드롭다운 제외한 텍스트만)
      const monthNames = window.langManager.getMonthNames();
      const yearSuffix = window.langManager.getUIText('year');
      const textNode = currentMonthEl.childNodes[0];
      if (textNode && textNode.nodeType === Node.TEXT_NODE) {
        textNode.textContent = `${currentYear}${yearSuffix} ${monthNames[currentMonth]}`;
      } else {
        // 첫 실행 시 텍스트 노드 생성
        currentMonthEl.insertBefore(
          document.createTextNode(`${currentYear}${yearSuffix} ${monthNames[currentMonth]}`),
          currentMonthEl.firstChild
        );
      }
      
      // 드롭다운 업데이트
      updateDropdown();
      
      // 그리드 초기화
      grid.innerHTML = '';
      
      // 요일 헤더 추가
      const dayHeaders = window.langManager.getDayNames();
      dayHeaders.forEach(day => {
        const header = document.createElement('div');
        header.className = 'calendar-day-header';
        header.textContent = day;
        grid.appendChild(header);
      });
      
      // 현재 월의 첫날과 마지막 날
      const firstDay = new Date(currentYear, currentMonth, 1);
      const lastDay = new Date(currentYear, currentMonth + 1, 0);
      
      // 시작 요일 (0 = 일요일)
      const startDay = firstDay.getDay();
      
      // 오늘 날짜
      const today = new Date();
      const isCurrentMonth = today.getFullYear() === currentYear && today.getMonth() === currentMonth;
      const todayDate = today.getDate();
      
      // 빈 칸 추가 (이전 월)
      for (let i = 0; i < startDay; i++) {
        const emptyDay = document.createElement('div');
        emptyDay.className = 'calendar-day empty';
        grid.appendChild(emptyDay);
      }
      
      // 날짜 추가
      for (let day = 1; day <= lastDay.getDate(); day++) {
        const dayEl = document.createElement('div');
        dayEl.className = 'calendar-day';
        
        // 오늘 표시
        if (isCurrentMonth && day === todayDate) {
          dayEl.classList.add('today');
        }
        
        // 날짜 번호
        const dayNumber = document.createElement('div');
        dayNumber.className = 'calendar-day-number';
        dayNumber.textContent = day;
        dayEl.appendChild(dayNumber);
        
        // 날짜 문자열 생성 (YYYY-MM-DD)
        const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        
        // 해당 날짜의 게시물 확인 (배열로 변경됨)
        if (postsByDate[dateStr] && Array.isArray(postsByDate[dateStr])) {
          const posts = postsByDate[dateStr];
          
          // 태그 버튼 컨테이너
          const tagsContainer = document.createElement('div');
          tagsContainer.className = 'calendar-day-tags';
          
          posts.forEach(post => {
            const tagBtn = document.createElement('button');
            tagBtn.className = 'calendar-day-tag';
            tagBtn.textContent = post.typeTag;
            tagBtn.title = post.titleKo || post.title;
            tagBtn.onclick = () => {
              window.location.href = `./posts/${post.slug}/index.html`;
            };
            tagsContainer.appendChild(tagBtn);
          });
          
          dayEl.appendChild(tagsContainer);
        }
        
        grid.appendChild(dayEl);
      }
    }
    
    // 이전 월
    document.getElementById('prev-month').addEventListener('click', () => {
      currentMonth--;
      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
      }
      renderCalendar();
    });
    
    // 다음 월
    document.getElementById('next-month').addEventListener('click', () => {
      currentMonth++;
      if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
      }
      renderCalendar();
    });
    
    // 드롭다운 관련 변수
    let dropdownYear = currentYear;
    const dropdown = document.getElementById('calendar-dropdown');
    
    // 드롭다운 업데이트
    function updateDropdown() {
      const dropdownYearEl = document.getElementById('dropdown-year');
      const yearSuffix = window.langManager.getUIText('year');
      dropdownYearEl.textContent = `${dropdownYear}${yearSuffix}`;
      
      const monthNames = window.langManager.getMonthNames();
      const monthsContainer = document.getElementById('dropdown-months');
      monthsContainer.innerHTML = '';
      
      monthNames.forEach((month, index) => {
        const btn = document.createElement('button');
        btn.className = 'dropdown-month-btn';
        btn.textContent = month;
        
        // 현재 선택된 월 표시
        if (dropdownYear === currentYear && index === currentMonth) {
          btn.classList.add('current');
        }
        
        btn.addEventListener('click', () => {
          currentYear = dropdownYear;
          currentMonth = index;
          renderCalendar();
          closeDropdown();
        });
        
        monthsContainer.appendChild(btn);
      });
    }
    
    // 드롭다운 열기/닫기
    function toggleDropdown() {
      dropdown.classList.toggle('active');
      if (dropdown.classList.contains('active')) {
        dropdownYear = currentYear;
        updateDropdown();
      }
    }
    
    function closeDropdown() {
      dropdown.classList.remove('active');
    }
    
    // current-month 클릭
    document.getElementById('current-month').addEventListener('click', (e) => {
      // 드롭다운 내부 클릭은 무시
      if (e.target.closest('.calendar-dropdown')) {
        return;
      }
      toggleDropdown();
    });
    
    // 드롭다운 이전 년도
    document.getElementById('dropdown-prev-year').addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownYear--;
      updateDropdown();
    });
    
    // 드롭다운 다음 년도
    document.getElementById('dropdown-next-year').addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownYear++;
      updateDropdown();
    });
    
    // 외부 클릭 시 드롭다운 닫기
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#current-month')) {
        closeDropdown();
      }
    });
    
    // 초기 렌더링
    renderCalendar();
    }); // DOMContentLoaded 끝
  </script>
</body>
</html>
