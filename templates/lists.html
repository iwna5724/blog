<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{blogTitle}}의 일기">
  
  <!-- 🔒 검색엔진 차단 (개인 블로그) -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  
  <title>일기 - {{blogTitle}}</title>
  
  <link rel="icon" type="image/x-icon" href="./static/images/favicon.ico">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#667eea">
  <link rel="apple-touch-icon" href="./static/images/icon-192.png">

  <link rel="stylesheet" href="./static/css/style.css">
  
  <script src="./static/js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav class="nav">
        <a href="./index.html" class="logo">{{blogTitle}}</a>
        <div class="nav-links">
          <a href="./lists.html" class="active" data-i18n="nav.lists">일기</a>
          <a href="./music.html" data-i18n="nav.music">음악</a>
          <a href="./photo.html" data-i18n="nav.photo">사진</a>
          <div class="nav-utils">
            <button id="lang-toggle" class="lang-toggle" aria-label="언어 전환">
              <img src="./static/images/flags/KOREA.svg" alt="한국어">
            </button>
            <button id="theme-toggle" class="theme-toggle" aria-label="테마 전환">
              🌙
            </button>
            <a href="./admin/login.html" class="admin-link" title="관리자 로그인">
              ⚙️
            </a>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div class="tags-header">
        <h1 class="page-title" data-i18n="lists.title">일기</h1>
        <p class="page-subtitle" data-i18n="lists.subtitle">각종 기준으로 정리한 글 목록</p>
        <div class="admin-controls" id="admin-controls" style="display: none;">
          <a href="./admin/index.html" class="page-admin-btn" id="sync-admin-btn">
            🔄 <span data-i18n="lists.syncAdmin">동기화 관리</span><span class="admin-btn-badge" id="sync-badge" style="display: none;"></span>
          </a>
        </div>
      </div>

      <!-- 달력 섹션 -->
      <div class="calendar-section">
        <h2 class="tag-section-header" data-i18n="lists.calendar"><span style="font-weight: 780;">작성일</span>로부터 찾기</h2>
        <div class="calendar-header">
          <button class="calendar-nav-btn" id="prev-month" data-i18n="calendar.prev">◀ 이전</button>
          <div class="calendar-current" id="current-month">
            <!-- 드롭다운 메뉴 -->
            <div class="calendar-dropdown" id="calendar-dropdown">
              <div class="dropdown-year-selector">
                <button class="dropdown-year-btn" id="dropdown-prev-year">◀</button>
                <div class="dropdown-year" id="dropdown-year"></div>
                <button class="dropdown-year-btn" id="dropdown-next-year">▶</button>
              </div>
              <div class="dropdown-months" id="dropdown-months">
                <!-- JavaScript로 생성 -->
              </div>
            </div>
          </div>
          <button class="calendar-nav-btn" id="next-month" data-i18n="calendar.next">다음 ▶</button>
        </div>
        <div class="calendar-grid" id="calendar-grid">
          <!-- JavaScript로 생성 -->
        </div>
      </div>

      <!-- 종류 태그 섹션 -->
      <div class="tag-section type-tags-section">
        <h2 class="tag-section-header" data-i18n="lists.type">글의 <span style="font-weight: 780;">종류</span>로부터 찾기</h2>
        <div class="all-tags-grid">
          {{typeTagsGrid}}
        </div>
      </div>

      <div class="back-link-container">
        <a href="./index.html" class="back-link" data-i18n="backToHome">
          ← 홈으로 돌아가기
        </a>
      </div>
    </div>
  </main>

  <!-- 게시물 데이터 -->
  <script>
    const postsByDateJsonStr = `{{postsByDateJson}}`;
    const postsByDate = JSON.parse(postsByDateJsonStr);
  </script>

  <script src="./static/js/language.js"></script>
  
  <!-- 달력 JavaScript -->
  <script>
    // DOM 준비 후 실행
    document.addEventListener('DOMContentLoaded', function() {
    // 달력 범위 제한: 2024년 4월 ~ 현재
    const MIN_YEAR = 2024;
    const MIN_MONTH = 3; // 0-indexed (4월 = 3)
    const START_DATE = new Date(2024, 3, 26); // 2024-04-26부터 🆕 표시

    const now = new Date();
    const MAX_YEAR = now.getFullYear();
    const MAX_MONTH = now.getMonth();

    let currentYear = MAX_YEAR;
    let currentMonth = MAX_MONTH;

    // 로그인 상태 확인
    function isLoggedIn() {
      return !!localStorage.getItem('github_token');
    }

    // 날짜 범위 내인지 확인
    function isInRange(year, month) {
      if (year < MIN_YEAR || year > MAX_YEAR) return false;
      if (year === MIN_YEAR && month < MIN_MONTH) return false;
      if (year === MAX_YEAR && month > MAX_MONTH) return false;
      return true;
    }

    // 네비게이션 버튼 상태 업데이트
    function updateNavButtons() {
      const prevBtn = document.getElementById('prev-month');
      const nextBtn = document.getElementById('next-month');

      // 이전 버튼: 최소 범위 체크
      if (currentYear === MIN_YEAR && currentMonth === MIN_MONTH) {
        prevBtn.disabled = true;
        prevBtn.style.opacity = '0.3';
        prevBtn.style.cursor = 'not-allowed';
      } else {
        prevBtn.disabled = false;
        prevBtn.style.opacity = '1';
        prevBtn.style.cursor = 'pointer';
      }

      // 다음 버튼: 최대 범위 체크
      if (currentYear === MAX_YEAR && currentMonth === MAX_MONTH) {
        nextBtn.disabled = true;
        nextBtn.style.opacity = '0.3';
        nextBtn.style.cursor = 'not-allowed';
      } else {
        nextBtn.disabled = false;
        nextBtn.style.opacity = '1';
        nextBtn.style.cursor = 'pointer';
      }
    }

    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      const currentMonthEl = document.getElementById('current-month');

      // 월 표시 업데이트 (드롭다운 제외한 텍스트만)
      const monthNames = window.langManager.getMonthNames();
      const yearSuffix = window.langManager.getUIText('year');
      const textNode = currentMonthEl.childNodes[0];
      if (textNode && textNode.nodeType === Node.TEXT_NODE) {
        textNode.textContent = `${currentYear}${yearSuffix} ${monthNames[currentMonth]}`;
      } else {
        // 첫 실행 시 텍스트 노드 생성
        currentMonthEl.insertBefore(
          document.createTextNode(`${currentYear}${yearSuffix} ${monthNames[currentMonth]}`),
          currentMonthEl.firstChild
        );
      }

      // 드롭다운 업데이트
      updateDropdown();

      // 네비게이션 버튼 상태 업데이트
      updateNavButtons();

      // 그리드 초기화
      grid.innerHTML = '';

      // 요일 헤더 추가
      const dayHeaders = window.langManager.getDayNames();
      dayHeaders.forEach(day => {
        const header = document.createElement('div');
        header.className = 'calendar-day-header';
        header.textContent = day;
        grid.appendChild(header);
      });

      // 현재 월의 첫날과 마지막 날
      const firstDay = new Date(currentYear, currentMonth, 1);
      const lastDay = new Date(currentYear, currentMonth + 1, 0);

      // 시작 요일 (0 = 일요일)
      const startDay = firstDay.getDay();

      // 오늘 날짜
      const today = new Date();
      const isCurrentMonth = today.getFullYear() === currentYear && today.getMonth() === currentMonth;
      const todayDate = today.getDate();

      // 로그인 상태
      const loggedIn = isLoggedIn();

      // 빈 칸 추가 (이전 월)
      for (let i = 0; i < startDay; i++) {
        const emptyDay = document.createElement('div');
        emptyDay.className = 'calendar-day empty';
        grid.appendChild(emptyDay);
      }

      // 날짜 추가
      for (let day = 1; day <= lastDay.getDate(); day++) {
        const dayEl = document.createElement('div');
        dayEl.className = 'calendar-day';

        // 오늘 표시
        if (isCurrentMonth && day === todayDate) {
          dayEl.classList.add('today');
        }

        // 날짜 번호
        const dayNumber = document.createElement('div');
        dayNumber.className = 'calendar-day-number';
        dayNumber.textContent = day;
        dayEl.appendChild(dayNumber);

        // 날짜 문자열 생성 (YYYY-MM-DD)
        const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const currentDate = new Date(currentYear, currentMonth, day);

        // 해당 날짜의 게시물 확인 (배열로 변경됨)
        if (postsByDate[dateStr] && Array.isArray(postsByDate[dateStr])) {
          const posts = postsByDate[dateStr];

          // 태그 버튼 컨테이너
          const tagsContainer = document.createElement('div');
          tagsContainer.className = 'calendar-day-tags';

          posts.forEach(post => {
            const tagBtn = document.createElement('button');
            tagBtn.className = 'calendar-day-tag';
            tagBtn.textContent = post.typeTag;
            tagBtn.title = post.titleKo || post.title;
            tagBtn.onclick = () => {
              window.location.href = `./posts/${post.slug}/index.html`;
            };
            tagsContainer.appendChild(tagBtn);
          });

          dayEl.appendChild(tagsContainer);
        } else if (loggedIn && currentDate >= START_DATE && currentDate <= today) {
          // 로그인 상태이고, 글이 없는 날짜이며, 2024-04-26 이후 ~ 오늘까지인 경우 🆕 버튼 표시
          const newBtn = document.createElement('button');
          newBtn.className = 'calendar-day-new';
          newBtn.textContent = '🆕';
          newBtn.title = '새 글 작성';
          newBtn.onclick = (e) => {
            e.stopPropagation();
            sessionStorage.setItem('new_post_date', dateStr);
            window.location.href = `./admin/editor.html`;
          };
          dayEl.appendChild(newBtn);
        }

        grid.appendChild(dayEl);
      }
    }

    // 이전 월
    document.getElementById('prev-month').addEventListener('click', () => {
      // 최소 범위 체크
      if (currentYear === MIN_YEAR && currentMonth === MIN_MONTH) return;

      currentMonth--;
      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
      }
      renderCalendar();
    });

    // 다음 월
    document.getElementById('next-month').addEventListener('click', () => {
      // 최대 범위 체크
      if (currentYear === MAX_YEAR && currentMonth === MAX_MONTH) return;

      currentMonth++;
      if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
      }
      renderCalendar();
    });

    // 드롭다운 관련 변수
    let dropdownYear = currentYear;
    const dropdown = document.getElementById('calendar-dropdown');

    // 드롭다운 업데이트
    function updateDropdown() {
      const dropdownYearEl = document.getElementById('dropdown-year');
      const yearSuffix = window.langManager.getUIText('year');
      dropdownYearEl.textContent = `${dropdownYear}${yearSuffix}`;

      const monthNames = window.langManager.getMonthNames();
      const monthsContainer = document.getElementById('dropdown-months');
      monthsContainer.innerHTML = '';

      monthNames.forEach((month, index) => {
        const btn = document.createElement('button');
        btn.className = 'dropdown-month-btn';
        btn.textContent = month;

        // 범위 밖의 월은 비활성화
        if (!isInRange(dropdownYear, index)) {
          btn.disabled = true;
          btn.style.opacity = '0.3';
          btn.style.cursor = 'not-allowed';
        }

        // 현재 선택된 월 표시
        if (dropdownYear === currentYear && index === currentMonth) {
          btn.classList.add('current');
        }

        btn.addEventListener('click', () => {
          if (!isInRange(dropdownYear, index)) return;
          currentYear = dropdownYear;
          currentMonth = index;
          renderCalendar();
          closeDropdown();
        });

        monthsContainer.appendChild(btn);
      });
    }

    // 드롭다운 열기/닫기
    function toggleDropdown() {
      dropdown.classList.toggle('active');
      if (dropdown.classList.contains('active')) {
        dropdownYear = currentYear;
        updateDropdown();
      }
    }

    function closeDropdown() {
      dropdown.classList.remove('active');
    }

    // current-month 클릭
    document.getElementById('current-month').addEventListener('click', (e) => {
      // 드롭다운 내부 클릭은 무시
      if (e.target.closest('.calendar-dropdown')) {
        return;
      }
      toggleDropdown();
    });

    // 드롭다운 이전 년도
    document.getElementById('dropdown-prev-year').addEventListener('click', (e) => {
      e.stopPropagation();
      // 최소 년도 체크
      if (dropdownYear > MIN_YEAR) {
        dropdownYear--;
        updateDropdown();
      }
    });

    // 드롭다운 다음 년도
    document.getElementById('dropdown-next-year').addEventListener('click', (e) => {
      e.stopPropagation();
      // 최대 년도 체크
      if (dropdownYear < MAX_YEAR) {
        dropdownYear++;
        updateDropdown();
      }
    });

    // 외부 클릭 시 드롭다운 닫기
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#current-month')) {
        closeDropdown();
      }
    });

    // 전역 함수로 노출 (로그아웃 시 호출용)
    window.renderCalendar = renderCalendar;

    // 초기 렌더링
    renderCalendar();
    }); // DOMContentLoaded 끝
  </script>
  <script>
    // 관리자 로그인 상태 체크 및 로그아웃 처리
    (function() {
      var adminLink = document.querySelector('.admin-link');
      var adminControls = document.getElementById('admin-controls');
      var syncBadge = document.getElementById('sync-badge');

      // 동기화 개수 업데이트 함수
      function updateSyncBadge() {
        if (!syncBadge) return;

        var draftsStored = localStorage.getItem('blog_drafts');
        var deletedStored = localStorage.getItem('blog_deleted_posts');

        var draftsCount = draftsStored ? JSON.parse(draftsStored).length : 0;
        var deletedCount = deletedStored ? JSON.parse(deletedStored).length : 0;
        var totalCount = draftsCount + deletedCount;

        if (totalCount > 0) {
          syncBadge.textContent = totalCount;
          syncBadge.style.display = 'inline-block';
        } else {
          syncBadge.style.display = 'none';
        }
      }

      if (localStorage.getItem('github_token')) {
        // 로그인 상태: 동기화 관리 버튼 표시
        if (adminControls) {
          adminControls.style.display = 'flex';
          updateSyncBadge();
        }

        // admin-link 로그아웃 기능
        if (adminLink) {
          adminLink.classList.add('logged-in');
          adminLink.title = '로그아웃';
          adminLink.addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('github_token');
            localStorage.removeItem('github_config');
            adminLink.classList.remove('logged-in');
            adminLink.title = '관리자 로그인';
            adminLink.href = './admin/login.html';
            // 동기화 버튼 숨기기
            if (adminControls) adminControls.style.display = 'none';
            // 달력 다시 렌더링하여 🆕 버튼 숨기기
            if (typeof window.renderCalendar === 'function') window.renderCalendar();
          });
        }
      } else {
        // 비로그인 상태: 로그인 페이지로 이동 전 현재 URL 저장
        if (adminLink) {
          adminLink.addEventListener('click', function(e) {
            localStorage.setItem('return_url', window.location.href);
          });
        }
      }
    })();
  </script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js');}</script>
</body>
</html>
