<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 검색엔진 차단 (개인 블로그) -->
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">

<title>사진 - {{blogTitle}}</title>

<link rel="icon" type="image/x-icon" href="./static/images/favicon.ico">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#667eea">
<link rel="apple-touch-icon" href="./static/images/icon-192.png">

<link rel="stylesheet" href="./static/css/style.css">
<link rel="stylesheet" href="./static/css/photo.css">

<script src="./static/js/theme.js"></script>
<script src="./static/js/language.js"></script>
</head>
<body>

<!-- Header -->
<header class="site-header">
  <div class="container">
    <nav class="nav">
      <a href="./index.html" class="logo">{{blogTitle}}</a>
      <div class="nav-links">
        <a href="./lists.html" data-i18n="nav.lists">글 목록</a>
        <a href="./music.html" data-i18n="nav.music">음악</a>
        <a href="./photo.html" class="active" data-i18n="nav.photo">사진</a>
        <button id="lang-toggle" class="lang-toggle" aria-label="언어 전환">
          <img src="./static/images/flags/KOREA.svg" alt="한국어">
        </button>
        <button id="theme-toggle" class="theme-toggle" aria-label="테마 전환">🌙</button>
        <a href="./admin/login.html" class="admin-link" title="관리자 로그인">⚙️</a>
      </div>
    </nav>
  </div>
</header>

<!-- Main Content -->
<main class="main-content photo-page">
  <div class="container">
    <div class="tags-header" style="text-align: center; margin-bottom: 40px;">
      <h1 class="page-title" data-i18n="photo.pageTitle">사진</h1>
      <p class="page-subtitle" data-i18n="photo.pageSubtitle">직접 촬영한 사진들</p>
    </div>

    <!-- 관리자 전용: 업로드 버튼 -->
    <div id="admin-controls" class="admin-controls" style="display: none;">
      <a href="./admin/photo.html" class="upload-btn" data-i18n="photo.upload">📷 사진 업로드</a>
    </div>

    <!-- 필터 툴바 -->
    <div class="photo-toolbar">
      <div class="photo-count">
        <span data-i18n="photo.count.prefix">총</span>
        <span id="photo-count-num">0</span>
        <span data-i18n="photo.count.suffix">장</span>
      </div>
      <div class="filter-wrapper">
        <button id="btn-filter" class="filter-btn" aria-label="Filter">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1.5 2h13L9.5 8.5V13l-3 1.5V8.5L1.5 2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          <span data-i18n="photo.filter">필터</span>
        </button>
        <div id="filter-popup" class="filter-popup">
          <label class="filter-item">
            <input type="checkbox" value="S21" checked>
            <span class="filter-checkbox"></span>
            <span class="filter-label">Galaxy S21</span>
          </label>
          <label class="filter-item">
            <input type="checkbox" value="S23FE" checked>
            <span class="filter-checkbox"></span>
            <span class="filter-label">Galaxy S23 FE</span>
          </label>
          <label class="filter-item">
            <input type="checkbox" value="Zfc" checked>
            <span class="filter-checkbox"></span>
            <span class="filter-label">Nikon Zfc</span>
          </label>
        </div>
      </div>
    </div>

    <!-- 사진 그리드 -->
    <div id="photo-grid" class="photo-grid">
      <!-- JavaScript로 생성 -->
    </div>

    <!-- 빈 상태 -->
    <div id="empty-state" class="empty-state" style="display: none;">
      <p data-i18n="photo.empty">표시할 사진이 없습니다.</p>
    </div>
  </div>
</main>

<!-- 사진 뷰어 모달 -->
<div id="photo-modal" class="photo-modal-overlay">
  <div class="photo-modal-content">
    <button class="photo-modal-close" id="modal-close">&times;</button>
    <div class="photo-modal-body">
      <button class="photo-modal-nav photo-modal-prev" id="modal-prev">&#10094;</button>
      <div class="photo-modal-image-wrapper">
        <img id="modal-image" class="photo-modal-image" src="" alt="">
      </div>
      <button class="photo-modal-nav photo-modal-next" id="modal-next">&#10095;</button>
    </div>
    <div class="photo-modal-info">
      <span id="modal-counter" class="photo-modal-counter"></span>
    </div>
  </div>
</div>

<script>
// 사진 데이터 로드
let photoData = [];
let filteredPhotos = [];
let currentIndex = 0;
let activeFilters = new Set(['S21', 'S23FE', 'Zfc']);

// 관리자 확인
function checkAdmin() {
  const token = localStorage.getItem('github_token');
  const config = localStorage.getItem('github_config');
  if (token && config) {
    const adminControls = document.getElementById('admin-controls');
    if (adminControls) adminControls.style.display = 'flex';
  }
}

// 데이터 로드
async function loadPhotoData() {
  try {
    const response = await fetch('./photo/photo_data.json');
    if (!response.ok) throw new Error('Failed to load photo data');
    photoData = await response.json();
    applyFilters();
  } catch (error) {
    console.error('Error loading photo data:', error);
    photoData = [];
    applyFilters();
  }
}

// 필터 적용
function applyFilters() {
  filteredPhotos = photoData.filter(photo => activeFilters.has(photo.camera));
  renderPhotoGrid();
  updatePhotoCount();
}

// 사진 개수 업데이트
function updatePhotoCount() {
  document.getElementById('photo-count-num').textContent = filteredPhotos.length;
}

// 사진 그리드 렌더링
function renderPhotoGrid() {
  const grid = document.getElementById('photo-grid');
  const emptyState = document.getElementById('empty-state');

  if (filteredPhotos.length === 0) {
    grid.style.display = 'none';
    emptyState.style.display = 'block';
    return;
  }

  grid.style.display = 'grid';
  emptyState.style.display = 'none';

  grid.innerHTML = filteredPhotos.map((photo, index) => `
    <div class="photo-item" data-index="${index}">
      <img src="${photo.thumbnail || photo.url}" alt="" loading="lazy">
    </div>
  `).join('');

  // 클릭 이벤트 추가
  grid.querySelectorAll('.photo-item').forEach(item => {
    item.addEventListener('click', () => {
      const index = parseInt(item.dataset.index);
      openModal(index);
    });
  });
}

// 카메라 라벨 변환
function getCameraLabel(camera) {
  const labels = {
    'S21': 'Galaxy S21',
    'S23FE': 'Galaxy S23 FE',
    'Zfc': 'Nikon Zfc'
  };
  return labels[camera] || camera;
}

// 모달 열기
function openModal(index) {
  currentIndex = index;
  const modal = document.getElementById('photo-modal');
  updateModalContent();
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';

  // 뒤로가기 지원
  history.pushState({ photoModal: true }, '');
}

// 모달 닫기
function closeModal() {
  const modal = document.getElementById('photo-modal');
  modal.classList.remove('active');
  document.body.style.overflow = '';
}

// 모달 내용 업데이트
function updateModalContent() {
  const photo = filteredPhotos[currentIndex];
  if (!photo) return;

  document.getElementById('modal-image').src = photo.url;
  document.getElementById('modal-counter').textContent = `${currentIndex + 1} / ${filteredPhotos.length}`;
}

// 이전 사진
function prevPhoto() {
  if (currentIndex > 0) {
    currentIndex--;
    updateModalContent();
  }
}

// 다음 사진
function nextPhoto() {
  if (currentIndex < filteredPhotos.length - 1) {
    currentIndex++;
    updateModalContent();
  }
}

// 필터 팝업 토글
function initFilterPopup() {
  const filterBtn = document.getElementById('btn-filter');
  const filterPopup = document.getElementById('filter-popup');

  filterBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    filterPopup.classList.toggle('active');
  });

  document.addEventListener('click', (e) => {
    if (!filterPopup.contains(e.target) && e.target !== filterBtn) {
      filterPopup.classList.remove('active');
    }
  });

  // 체크박스 변경 이벤트
  filterPopup.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
    checkbox.addEventListener('change', () => {
      if (checkbox.checked) {
        activeFilters.add(checkbox.value);
      } else {
        activeFilters.delete(checkbox.value);
      }
      applyFilters();

      // 필터 버튼 상태 업데이트
      const allChecked = activeFilters.size === 3;
      filterBtn.classList.toggle('filter-active', !allChecked);
    });
  });
}

// 이벤트 리스너 설정
function initEventListeners() {
  // 모달 닫기 (x버튼 또는 배경 클릭)
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('photo-modal').addEventListener('click', (e) => {
    // 이미지나 네비게이션 버튼이 아닌 곳을 클릭하면 닫기
    if (e.target.id === 'photo-modal' || e.target.classList.contains('photo-modal-content') || e.target.classList.contains('photo-modal-body')) {
      closeModal();
    }
  });

  // 이전/다음
  document.getElementById('modal-prev').addEventListener('click', (e) => {
    e.stopPropagation();
    prevPhoto();
  });
  document.getElementById('modal-next').addEventListener('click', (e) => {
    e.stopPropagation();
    nextPhoto();
  });

  // 키보드 네비게이션
  document.addEventListener('keydown', (e) => {
    const modal = document.getElementById('photo-modal');
    if (!modal.classList.contains('active')) return;

    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowLeft') prevPhoto();
    if (e.key === 'ArrowRight') nextPhoto();
  });

  // 뒤로가기 지원
  window.addEventListener('popstate', (e) => {
    const modal = document.getElementById('photo-modal');
    if (modal.classList.contains('active')) {
      closeModal();
    }
  });
}

// 초기화
document.addEventListener('DOMContentLoaded', () => {
  checkAdmin();
  initFilterPopup();
  initEventListeners();
  loadPhotoData();
});
</script>

<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js');}</script>
</body>
</html>
