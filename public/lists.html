  <script>
    // DOM 준비 후 실행
    document.addEventListener('DOMContentLoaded', function() {
    // 달력 범위 제한: 2024년 4월 ~ 현재
    const MIN_YEAR = 2024;
    const MIN_MONTH = 3; // 0-indexed (4월 = 3)
    const START_DATE = new Date(2024, 3, 26); // 2024-04-26부터 🆕 표시

    const now = new Date();
    const MAX_YEAR = now.getFullYear();
    const MAX_MONTH = now.getMonth();

    let currentYear = MAX_YEAR;
    let currentMonth = MAX_MONTH;

    // 로그인 상태 확인
    function isLoggedIn() {
      return !!localStorage.getItem('github_token');
    }

    // 날짜 범위 내인지 확인
    function isInRange(year, month) {
      if (year < MIN_YEAR || year > MAX_YEAR) return false;
      if (year === MIN_YEAR && month < MIN_MONTH) return false;
      if (year === MAX_YEAR && month > MAX_MONTH) return false;
      return true;
    }

    // 네비게이션 버튼 상태 업데이트
    function updateNavButtons() {
      const prevBtn = document.getElementById('prev-month');
      const nextBtn = document.getElementById('next-month');

      // 이전 버튼: 최소 범위 체크
      if (currentYear === MIN_YEAR && currentMonth === MIN_MONTH) {
        prevBtn.disabled = true;
        prevBtn.style.opacity = '0.3';
        prevBtn.style.cursor = 'not-allowed';
      } else {
        prevBtn.disabled = false;
        prevBtn.style.opacity = '1';
        prevBtn.style.cursor = 'pointer';
      }

      // 다음 버튼: 최대 범위 체크
      if (currentYear === MAX_YEAR && currentMonth === MAX_MONTH) {
        nextBtn.disabled = true;
        nextBtn.style.opacity = '0.3';
        nextBtn.style.cursor = 'not-allowed';
      } else {
        nextBtn.disabled = false;
        nextBtn.style.opacity = '1';
        nextBtn.style.cursor = 'pointer';
      }
    }

    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      const currentMonthEl = document.getElementById('current-month');

      // 월 표시 업데이트 (드롭다운 제외한 텍스트만)
      const monthNames = window.langManager.getMonthNames();
      const yearSuffix = window.langManager.getUIText('year');
      const textNode = currentMonthEl.childNodes[0];
      if (textNode && textNode.nodeType === Node.TEXT_NODE) {
        textNode.textContent = `${currentYear}${yearSuffix} ${monthNames[currentMonth]}`;
      } else {
        // 첫 실행 시 텍스트 노드 생성
        currentMonthEl.insertBefore(
          document.createTextNode(`${currentYear}${yearSuffix} ${monthNames[currentMonth]}`),
          currentMonthEl.firstChild
        );
      }

      // 드롭다운 업데이트
      updateDropdown();

      // 네비게이션 버튼 상태 업데이트
      updateNavButtons();

      // 그리드 초기화
      grid.innerHTML = '';

      // 요일 헤더 추가
      const dayHeaders = window.langManager.getDayNames();
      dayHeaders.forEach(day => {
        const header = document.createElement('div');
        header.className = 'calendar-day-header';
        header.textContent = day;
        grid.appendChild(header);
      });

      // 현재 월의 첫날과 마지막 날
      const firstDay = new Date(currentYear, currentMonth, 1);
      const lastDay = new Date(currentYear, currentMonth + 1, 0);

      // 시작 요일 (0 = 일요일)
      const startDay = firstDay.getDay();

      // 오늘 날짜
      const today = new Date();
      const isCurrentMonth = today.getFullYear() === currentYear && today.getMonth() === currentMonth;
      const todayDate = today.getDate();

      // 로그인 상태
      const loggedIn = isLoggedIn();

      // 빈 칸 추가 (이전 월)
      for (let i = 0; i < startDay; i++) {
        const emptyDay = document.createElement('div');
        emptyDay.className = 'calendar-day empty';
        grid.appendChild(emptyDay);
      }

      // 날짜 추가
      for (let day = 1; day <= lastDay.getDate(); day++) {
        const dayEl = document.createElement('div');
        dayEl.className = 'calendar-day';

        // 오늘 표시
        if (isCurrentMonth && day === todayDate) {
          dayEl.classList.add('today');
        }

        // 날짜 번호
        const dayNumber = document.createElement('div');
        dayNumber.className = 'calendar-day-number';
        dayNumber.textContent = day;
        dayEl.appendChild(dayNumber);

        // 날짜 문자열 생성 (YYYY-MM-DD)
        const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const currentDate = new Date(currentYear, currentMonth, day);

        // 해당 날짜의 게시물 확인 (배열로 변경됨)
        if (postsByDate[dateStr] && Array.isArray(postsByDate[dateStr])) {
          const posts = postsByDate[dateStr];

          // 태그 버튼 컨테이너
          const tagsContainer = document.createElement('div');
          tagsContainer.className = 'calendar-day-tags';

          posts.forEach(post => {
            const tagBtn = document.createElement('button');
            tagBtn.className = 'calendar-day-tag';
            tagBtn.textContent = post.typeTag;
            tagBtn.title = post.titleKo || post.title;
            tagBtn.onclick = () => {
              window.location.href = `./posts/${post.slug}/index.html`;
            };
            tagBtn.addEventListener('mousedown', (e) => {
              if (e.button === 1) {
                e.preventDefault();
                window.open(`./posts/${post.slug}/index.html`, '_blank');
              }
            });
            tagsContainer.appendChild(tagBtn);
          });

          dayEl.appendChild(tagsContainer);
        } else if (loggedIn && currentDate >= START_DATE && currentDate <= today) {
          // 로그인 상태이고, 글이 없는 날짜이며, 2024-04-26 이후 ~ 오늘까지인 경우 🆕 버튼 표시
          const newBtn = document.createElement('button');
          newBtn.className = 'calendar-day-new';
          newBtn.textContent = '🆕';
          newBtn.title = '새 글 작성';
          newBtn.onclick = (e) => {
            e.stopPropagation();
            sessionStorage.setItem('new_post_date', dateStr);
            window.location.href = `./admin/editor.html`;
          };
          dayEl.appendChild(newBtn);
        }

        grid.appendChild(dayEl);
      }
    }

    // 이전 월
    document.getElementById('prev-month').addEventListener('click', () => {
      // 최소 범위 체크
      if (currentYear === MIN_YEAR && currentMonth === MIN_MONTH) return;

      currentMonth--;
      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
      }
      renderCalendar();
    });

    // 다음 월
    document.getElementById('next-month').addEventListener('click', () => {
      // 최대 범위 체크
      if (currentYear === MAX_YEAR && currentMonth === MAX_MONTH) return;

      currentMonth++;
      if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
      }
      renderCalendar();
    });

    // 드롭다운 관련 변수
    let dropdownYear = currentYear;
    const dropdown = document.getElementById('calendar-dropdown');

    // 드롭다운 업데이트
    function updateDropdown() {
      const dropdownYearEl = document.getElementById('dropdown-year');
      const yearSuffix = window.langManager.getUIText('year');
      dropdownYearEl.textContent = `${dropdownYear}${yearSuffix}`;

      const monthNames = window.langManager.getMonthNames();
      const monthsContainer = document.getElementById('dropdown-months');
      monthsContainer.innerHTML = '';

      monthNames.forEach((month, index) => {
        const btn = document.createElement('button');
        btn.className = 'dropdown-month-btn';
        btn.textContent = month;

        // 범위 밖의 월은 비활성화
        if (!isInRange(dropdownYear, index)) {
          btn.disabled = true;
          btn.style.opacity = '0.3';
          btn.style.cursor = 'not-allowed';
        }

        // 현재 선택된 월 표시
        if (dropdownYear === currentYear && index === currentMonth) {
          btn.classList.add('current');
        }

        btn.addEventListener('click', () => {
          if (!isInRange(dropdownYear, index)) return;
          currentYear = dropdownYear;
          currentMonth = index;
          renderCalendar();
          closeDropdown();
        });

        monthsContainer.appendChild(btn);
      });
    }

    // 드롭다운 열기/닫기
    function toggleDropdown() {
      dropdown.classList.toggle('active');
      if (dropdown.classList.contains('active')) {
        dropdownYear = currentYear;
        updateDropdown();
      }
    }

    function closeDropdown() {
      dropdown.classList.remove('active');
    }

    // current-month 클릭
    document.getElementById('current-month').addEventListener('click', (e) => {
      // 드롭다운 내부 클릭은 무시
      if (e.target.closest('.calendar-dropdown')) {
        return;
      }
      toggleDropdown();
    });

    // 드롭다운 이전 년도
    document.getElementById('dropdown-prev-year').addEventListener('click', (e) => {
      e.stopPropagation();
      // 최소 년도 체크
      if (dropdownYear > MIN_YEAR) {
        dropdownYear--;
        updateDropdown();
      }
    });

    // 드롭다운 다음 년도
    document.getElementById('dropdown-next-year').addEventListener('click', (e) => {
      e.stopPropagation();
      // 최대 년도 체크
      if (dropdownYear < MAX_YEAR) {
        dropdownYear++;
        updateDropdown();
      }
    });

    // 외부 클릭 시 드롭다운 닫기
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#current-month')) {
        closeDropdown();
      }
    });

    // 전역 함수로 노출 (로그아웃 시 호출용)
    window.renderCalendar = renderCalendar;

    // 초기 렌더링
    renderCalendar();
    }); // DOMContentLoaded 끝
  </script>
  <!-- 리스트 섹션 JavaScript -->
  <script>
  (function() {
    var ALL_CHALLENGES = ['🛌', '🚶', '📖', '🎸', '🏋️', '🎓'];

    function renderChallenges(activeChallenges) {
      var set = new Set(Array.isArray(activeChallenges) ? activeChallenges : []);
      return ALL_CHALLENGES.map(function(c) {
        var cls = set.has(c) ? 'challenge-badge active' : 'challenge-badge inactive';
        return '<span class="' + cls + '">' + c + '</span>';
      }).join('');
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderMusic(music) {
      if (!music || !music.title) return '';
      return '💽 ' + escHtml(music.title);
    }

    var activeListYear = null;
    var activeTypeTags = new Set(); // 기본: 모두 비활성화 (비활성화 = 전체 표시)
    var activeHideNoPost = false;   // — 필터: 기본 비활성화 (활성화 시 —태그 글 숨김)

    function applyFilters() {
      var noTypeFilter = activeTypeTags.size === 0;
      document.querySelectorAll('#list-tbody [data-list-year]').forEach(function(tr) {
        var yearMatch = tr.getAttribute('data-list-year') === activeListYear;
        if (!yearMatch) { tr.style.display = 'none'; return; }

        var hasPost = tr.getAttribute('data-has-post') === 'true';

        // no-post 행: activeHideNoPost가 활성화된 경우 숨김
        if (!hasPost) {
          tr.style.display = activeHideNoPost ? 'none' : '';
          return;
        }

        // has-post 행: 개별 stack item 표시 여부 결정
        var stackItems = tr.querySelectorAll('.list-title-stack-item');
        var visibleCount = 0;
        stackItems.forEach(function(item) {
          var tag = item.getAttribute('data-type-tag') || '';
          var itemVisible = noTypeFilter || activeTypeTags.has(tag);
          item.style.display = itemVisible ? '' : 'none';
          item.classList.toggle('list-title-stack-border', itemVisible && visibleCount > 0);
          if (itemVisible) visibleCount++;
        });

        tr.style.display = visibleCount > 0 ? '' : 'none';
      });
    }

    window.toggleNoPost = function() {
      activeHideNoPost = !activeHideNoPost;
      document.querySelectorAll('.list-nopost-filter-btn').forEach(function(btn) {
        btn.classList.toggle('active', activeHideNoPost);
      });
      applyFilters();
    };

    window.setListYear = function(year) {
      activeListYear = year;
      document.querySelectorAll('.list-year-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.getAttribute('data-year') === year);
      });
      applyFilters();
    };

    window.toggleTypeTag = function(tag) {
      if (activeTypeTags.has(tag)) {
        activeTypeTags.delete(tag);
      } else {
        activeTypeTags.add(tag);
      }
      document.querySelectorAll('.list-tag-filter-btn:not(.list-nopost-filter-btn)').forEach(function(btn) {
        btn.classList.toggle('active', activeTypeTags.has(btn.getAttribute('data-tag')));
      });
      applyFilters();
    };

    function buildAndRender(listEntries) {
      var lang = window.langManager ? window.langManager.getLanguage() : 'ko';
      var currentYear = String(new Date().getFullYear());
      var rows = [];

      // list_data.json → date 맵 (포스트 날짜 오버라이드용)
      var listMap = {};
      (listEntries || []).forEach(function(e) { if (e.date) listMap[e.date] = e; });

      // postsByDate (빌드 시 임베드) → 행 변환 (list_data.json 오버라이드 적용)
      var postDateSet = new Set();
      Object.keys(postsByDate).forEach(function(date) {
        postDateSet.add(date);
        (postsByDate[date] || []).forEach(function(p) {
          var ov = listMap[date];
          rows.push({
            date: date,
            challenges: ov ? (ov.challenges || []) : (p.challenges || []),
            music: ov ? (ov.music || null) : (p.music || null),
            slug: p.slug,
            typeTag: p.typeTag || '',
            titleKo: p.titleKo || p.title || '',
            titleJa: p.titleJa || p.title || ''
          });
        });
      });

      // list_data.json 항목 → 포스트 없는 날짜만 추가
      (listEntries || []).forEach(function(e) {
        if (postDateSet.has(e.date)) return;
        rows.push({
          date: e.date,
          challenges: e.challenges || [],
          music: e.music || null,
          slug: null,
          titleKo: e.titleKo || '',
          titleJa: e.titleJa || '',
          typeTag: e.typeTag || ''
        });
      });

      // 날짜 내림차순 정렬
      rows.sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });

      if (rows.length === 0) {
        document.getElementById('list-year-tabs').innerHTML = '';
        document.getElementById('list-tag-filters').innerHTML = '';
        document.getElementById('list-tbody').innerHTML =
          '<tr><td colspan="4" class="list-empty-cell">항목이 없습니다</td></tr>';
        return;
      }

      // 데이터에 존재하는 태그 목록 수집 (정의된 순서 유지)
      var TAG_ORDER = ['✏️', '📝', '⭐', '💀', '🦆'];
      var presentTags = TAG_ORDER.filter(function(tag) {
        return rows.some(function(row) { return row.typeTag === tag; });
      });

      // 태그 필터 버튼 렌더링
      var filtersEl = document.getElementById('list-tag-filters');
      var hasNoPostRows = rows.some(function(r) { return !r.slug; });
      var tagBtns = presentTags.map(function(tag) {
        var isActive = activeTypeTags.has(tag);
        return '<button class="list-tag-filter-btn' + (isActive ? ' active' : '') +
          '" data-tag="' + escHtml(tag) + '" onclick="toggleTypeTag(\'' + escHtml(tag) + '\')">' +
          escHtml(tag) + '</button>';
      }).join('');
      var noPostBtn = hasNoPostRows
        ? '<span class="list-filter-sep"></span><button class="list-tag-filter-btn list-nopost-filter-btn' +
          (activeHideNoPost ? ' active' : '') + '" onclick="toggleNoPost()">—</button>'
        : '';
      filtersEl.innerHTML = tagBtns + noPostBtn;

      // 년도별 그룹화
      var byYear = {};
      var yearOrder = [];
      rows.forEach(function(row) {
        var year = (row.date || '').substring(0, 4);
        if (!byYear[year]) { byYear[year] = []; yearOrder.push(year); }
        byYear[year].push(row);
      });

      // 활성 년도 결정 (현재 연도 우선, 없으면 최신)
      if (!activeListYear || yearOrder.indexOf(activeListYear) < 0) {
        activeListYear = yearOrder.indexOf(currentYear) >= 0 ? currentYear : yearOrder[0];
      }

      // 년도 탭 버튼 생성
      document.getElementById('list-year-tabs').innerHTML = yearOrder.map(function(year) {
        return '<button class="list-year-btn' + (year === activeListYear ? ' active' : '') +
          '" data-year="' + year + '" onclick="setListYear(\'' + year + '\')">' + year + '</button>';
      }).join('');

      // 날짜별로 행 그룹화 (같은 날짜의 글들을 하나의 행으로)
      function makeTitleCell(row) {
        if (row.slug) {
          var displayTitle = (lang === 'ja' && row.titleJa) ? row.titleJa : row.titleKo;
          return (row.typeTag ? '<span class="list-type-tag">' + escHtml(row.typeTag) + '</span>' : '') +
            '<a href="./posts/' + escHtml(row.slug) + '/index.html" class="list-post-title">' + escHtml(displayTitle) + '</a>';
        } else if (row.titleKo || row.titleJa || row.typeTag) {
          var displayTitle = (lang === 'ja' && row.titleJa) ? row.titleJa : (row.titleKo || '');
          return (row.typeTag ? '<span class="list-type-tag">' + escHtml(row.typeTag) + '</span>' : '') +
            '<span class="list-nopost-title">' + escHtml(displayTitle) + '</span>';
        } else {
          return '<span class="list-no-title">—</span>';
        }
      }

      // 날짜별로 행을 그룹화
      function groupByDate(yearRows) {
        var dateMap = {};
        var dateOrder = [];
        yearRows.forEach(function(row) {
          if (!dateMap[row.date]) { dateMap[row.date] = []; dateOrder.push(row.date); }
          dateMap[row.date].push(row);
        });
        return { dateMap: dateMap, dateOrder: dateOrder };
      }

      // 행 생성 (data-type-tag 속성 추가)
      var html = '';
      yearOrder.forEach(function(year) {
        var isActive = year === activeListYear;
        var grouped = groupByDate(byYear[year]);
        grouped.dateOrder.forEach(function(date) {
          var dateRows = grouped.dateMap[date];

          // 🦆가 있으면 아래로, 나머지는 위로 정렬
          dateRows.sort(function(a, b) {
            var aIsDuck = a.typeTag === '🦆' ? 1 : 0;
            var bIsDuck = b.typeTag === '🦆' ? 1 : 0;
            return aIsDuck - bIsDuck;
          });

          // 필터 가시성: applyFilters와 동일한 로직
          var noTypeFilter = activeTypeTags.size === 0;
          var hasPost = dateRows.some(function(r) { return !!r.slug; });
          var rowVisible;
          if (!hasPost) {
            rowVisible = !activeHideNoPost;
          } else if (noTypeFilter) {
            rowVisible = true;
          } else {
            rowVisible = dateRows.some(function(r) { return activeTypeTags.has(r.typeTag); });
          }
          var visible = isActive && rowVisible;

          // 대표 타입태그 (data-type-tag 속성용 — 필터링은 위에서 직접 처리)
          var typeTags = dateRows.map(function(r) { return r.typeTag; }).join(',');

          // challenges, music은 첫 번째 행 기준 (non-duck 우선)
          var primaryRow = dateRows[0];

          // 제목 셀: 항상 stack-item으로 감싸기 (data-type-tag로 개별 필터링)
          var titleCellContent = dateRows.map(function(r, i) {
            var cls = 'list-title-stack-item' + (i > 0 ? ' list-title-stack-border' : '');
            return '<div class="' + cls + '" data-type-tag="' + escHtml(r.typeTag) + '">' + makeTitleCell(r) + '</div>';
          }).join('');

          html += '<tr data-list-year="' + year + '" data-type-tags="' + escHtml(typeTags) + '" data-has-post="' + hasPost + '"' +
            (visible ? '' : ' style="display:none"') + '>' +
            '<td class="list-col-date">' + escHtml(date || '') + '</td>' +
            '<td class="list-col-challenges">' + renderChallenges(primaryRow.challenges) + '</td>' +
            '<td class="list-col-title">' + titleCellContent + '</td>' +
            '<td class="list-col-music">' + renderMusic(primaryRow.music) + '</td>' +
            '</tr>';
        });
      });

      document.getElementById('list-tbody').innerHTML = html;
    }

    function loadAndRender() {
      fetch('./list/list_data.json', { cache: 'no-cache' })
        .then(function(r) { return r.ok ? r.json() : { entries: [] }; })
        .catch(function() { return { entries: [] }; })
        .then(function(data) { buildAndRender(data.entries || []); });
    }

    // 언어 변경 시 제목 컬럼 재렌더링
    window.addEventListener('languagechange', loadAndRender);

    document.addEventListener('DOMContentLoaded', loadAndRender);
  })();
  </script>
  <!-- 태그 정보 툴팁 -->
  <script>
    (function() {
      var trigger = document.getElementById('list-tag-info-trigger');
      var tooltip = document.getElementById('list-tag-info-tooltip');
      if (!trigger || !tooltip) return;

      var locked = false;
      var hoverTimeout = null;

      var typeTags = ['✏️', '📝', '⭐', '💀', '🦆'];
      var challengeTags = ['🛌', '🚶', '📖', '🎸', '🏋️', '🎓'];

      function getText(key) {
        if (!window.langManager) return '';
        var t = window.langManager.getUIText(key);
        return (t && t !== key) ? t : '';
      }

      function buildContent() {
        var typeTitle = getText('lists.tagInfoSectionType');
        var challengeTitle = getText('lists.tagInfoSectionChallenge');
        var html = '';

        var typeRows = typeTags.map(function(tag) {
          var desc = getText('post.tag.' + tag);
          if (!desc) return '';
          return '<div class="tag-info-row"><span class="tag-info-emoji">' + tag + '</span><span class="tag-info-desc">' + desc + '</span></div>';
        }).filter(Boolean).join('');

        if (typeRows) {
          html += '<div class="tag-info-section">';
          if (typeTitle) html += '<div class="tag-info-section-title">' + typeTitle + '</div>';
          html += typeRows + '</div>';
        }

        var challengeRows = challengeTags.map(function(tag) {
          var desc = getText('post.challenge.' + tag);
          if (!desc) return '';
          return '<div class="tag-info-row"><span class="tag-info-emoji">' + tag + '</span><span class="tag-info-desc">' + desc + '</span></div>';
        }).filter(Boolean).join('');

        if (challengeRows) {
          if (html) html += '<hr class="tag-info-divider">';
          html += '<div class="tag-info-section">';
          if (challengeTitle) html += '<div class="tag-info-section-title">' + challengeTitle + '</div>';
          html += challengeRows + '</div>';
        }

        tooltip.innerHTML = html;
      }

      function updateActive() {
        if (locked || tooltip.classList.contains('hover-visible')) {
          trigger.classList.add('active');
        } else {
          trigger.classList.remove('active');
        }
      }

      function applyFlip() {
        tooltip.style.visibility = 'hidden';
        tooltip.style.display = 'block';
        var tipH = tooltip.offsetHeight;
        tooltip.style.visibility = '';
        tooltip.style.display = '';
        var triggerTop = trigger.getBoundingClientRect().top;
        tooltip.classList.toggle('flip-down', triggerTop < tipH + 8);
      }

      function showTooltip() {
        clearTimeout(hoverTimeout);
        buildContent();
        applyFlip();
        if (!locked) tooltip.classList.add('hover-visible');
        updateActive();
      }

      function scheduleHide() {
        hoverTimeout = setTimeout(function() {
          if (!locked) {
            tooltip.classList.remove('hover-visible');
            updateActive();
          }
        }, 80);
      }

      trigger.addEventListener('mouseenter', showTooltip);
      trigger.addEventListener('mouseleave', scheduleHide);
      tooltip.addEventListener('mouseenter', function() { clearTimeout(hoverTimeout); });
      tooltip.addEventListener('mouseleave', scheduleHide);

      trigger.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        if (locked) {
          locked = false;
          tooltip.classList.remove('click-locked');
        } else {
          locked = true;
          buildContent();
          applyFlip();
          tooltip.classList.remove('hover-visible');
          tooltip.classList.add('click-locked');
        }
        updateActive();
      });

      document.addEventListener('click', function(e) {
        if (locked && !tooltip.contains(e.target) && e.target !== trigger) {
          locked = false;
          tooltip.classList.remove('click-locked');
          updateActive();
        }
      });

      window.addEventListener('languagechange', function() {
        if (locked || tooltip.classList.contains('hover-visible')) {
          buildContent();
        }
      });
    })();
  </script>

  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js');}</script>

  <script>
    // Scroll to Top Button
    const scrollTopBtn = document.getElementById('scroll-top-btn');
    const SCROLL_THRESHOLD = 300;

    window.addEventListener('scroll', () => {
      if (window.scrollY > SCROLL_THRESHOLD) {
        scrollTopBtn.classList.add('visible');
      } else {
        scrollTopBtn.classList.remove('visible');
      }
    });

    scrollTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
