name: Build and Deploy Blog

on:
  push:
    branches: [ main ]
    paths:
      - 'templates/**'
      - 'build/**'
      - 'static/**'
      - 'admin/**'
      - 'config.json'
      - 'package.json'
  workflow_dispatch:  # 수동 실행 가능

# 동일 브랜치에서 새 워크플로우 실행 시 이전 실행 취소
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # github-actions[bot]의 자동 커밋은 재귀 트리거 방지를 위해 무시
    if: github.actor != 'github-actions[bot]'

    permissions:
      contents: write

    steps:
    - name: Checkout 코드
      uses: actions/checkout@v4
      with:
        fetch-depth: 50  # git log 감지용, 전체 히스토리 불필요
        lfs: true        # LFS 파일(앨범/포토 이미지) 다운로드

    - name: Node.js 설정
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 의존성 설치
      run: npm ci

    - name: blog 항목 commitHash 채워넣기
      run: |
        cd $GITHUB_WORKSPACE
        COMMIT_HASH="${{ github.sha }}"
        CHANGELOG="changelog/changelog_data.json"

        # commitHash가 없는 blog 항목이 있는지 확인
        NEEDS_UPDATE=$(node -e "
          const data = JSON.parse(require('fs').readFileSync('$CHANGELOG', 'utf-8'));
          const found = data.entries.some(e =>
            e.category === 'blog' && !e.commitHash
          );
          process.stdout.write(found ? 'true' : 'false');
        ")

        if [ "$NEEDS_UPDATE" = "true" ]; then
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('$CHANGELOG', 'utf-8'));
            data.entries.forEach(e => {
              if (e.category === 'blog' && !e.commitHash) {
                e.commitHash = '$COMMIT_HASH';
              }
            });
            fs.writeFileSync('$CHANGELOG', JSON.stringify(data, null, 2));
          "
          echo "commitHash 채워넣기 완료: $COMMIT_HASH"
        else
          echo "commitHash 없는 blog 항목 없음, 스킵"
        fi

    - name: 블로그 빌드
      run: npm run build

    - name: 변경사항 데이터 커밋
      run: |
        cd $GITHUB_WORKSPACE
        if git diff --quiet changelog/changelog_data.json 2>/dev/null; then
          echo "changelog_data.json 변경 없음"
        else
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add changelog/changelog_data.json
          git commit -m '변경사항 데이터 업데이트'
          git push
        fi

    - name: 리스트 데이터 정리 커밋
      run: |
        cd $GITHUB_WORKSPACE
        if git diff --quiet list/list_data.json 2>/dev/null; then
          echo "list_data.json 변경 없음"
        else
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add list/list_data.json
          git commit -m '리스트 데이터 정리'
          git push
        fi

    - name: 배포 디렉토리 준비
      run: |
        mkdir -p deploy
        cp -r public deploy/

        cat > deploy/index.html << 'EOF'
        <!DOCTYPE html>
        <html lang="ko">
        <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./public/">
          <link rel="canonical" href="./public/">
          <script>window.location.href = './public/';</script>
          <title>Redirecting...</title>
        </head>
        <body>
          <p>Redirecting to <a href="./public/">blog</a>...</p>
        </body>
        </html>
        EOF

    - name: GitHub Pages 배포
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./deploy
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Deploy: ${{ github.event.head_commit.message }}'
        force_orphan: true  # gh-pages 브랜치를 단일 커밋으로 유지 (히스토리 누적 방지)
