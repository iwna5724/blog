name: Build and Deploy Blog

on:
  push:
    branches: [ main ]
    paths:
      - 'templates/**'
      - 'build/**'
      - 'static/**'
      - 'admin/**'
      - 'config.json'
      - 'package.json'
  workflow_dispatch:  # 수동 실행 가능

# 동일 브랜치에서 새 워크플로우 실행 시 이전 실행 취소
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # github-actions[bot]의 자동 커밋은 재귀 트리거 방지를 위해 무시
    if: github.actor != 'github-actions[bot]'

    permissions:
      contents: write  # GitHub Pages 배포 권한

    steps:
    - name: Checkout 코드
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 전체 히스토리 (증분 빌드용)

    - name: Node.js 설정
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 의존성 설치
      run: npm ci

    - name: 블로그 빌드
      run: npm run build

    - name: 변경사항 데이터 커밋
      run: |
        cd $GITHUB_WORKSPACE
        if git diff --quiet changelog/changelog_data.json 2>/dev/null; then
          echo "changelog_data.json 변경 없음"
        else
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add changelog/changelog_data.json
          git commit -m '변경사항 데이터 업데이트'
          git push
        fi

    - name: 배포 디렉토리 준비
      run: |
        mkdir -p deploy
        cp -r public deploy/

        # 루트에 리다이렉트 index.html 생성
        cat > deploy/index.html << 'EOF'
        <!DOCTYPE html>
        <html lang="ko">
        <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./public/">
          <link rel="canonical" href="./public/">
          <script>window.location.href = './public/';</script>
          <title>Redirecting...</title>
        </head>
        <body>
          <p>Redirecting to <a href="./public/">blog</a>...</p>
        </body>
        </html>
        EOF

    - name: GitHub Pages 배포
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./deploy
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Deploy: ${{ github.event.head_commit.message }}'
