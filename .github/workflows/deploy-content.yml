name: Deploy Content

on:
  push:
    branches: [ main ]
    paths:
      - 'content/**'
      - 'album/**'
      - 'photo/photo_data.json'   # 원본 JPG는 Release에 저장되므로 제외
      - 'photo/thumb_*'           # 썸네일만 트리거
      - 'changelog/**'

# 동일 브랜치에서 새 워크플로우 실행 시 이전 실행 취소
concurrency:
  group: deploy-content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-content:
    runs-on: ubuntu-latest
    # github-actions[bot]의 자동 커밋(변경사항 데이터 업데이트)은 재귀 트리거 방지를 위해 무시
    if: github.actor != 'github-actions[bot]'

    permissions:
      contents: write

    steps:
    - name: Checkout 코드
      uses: actions/checkout@v4
      with:
        fetch-depth: 50  # git log 감지용, 전체 히스토리 불필요

    # 블로그 파일(templates/build/static/admin 등)이 이 커밋에 포함되어 있으면
    # Build and Deploy Blog 워크플로우가 전체 빌드·배포를 담당하므로 여기서는 중단
    - name: 블로그 파일 변경 여부 확인
      id: check-blog-files
      run: |
        BLOG_CHANGED=$(git diff-tree --no-commit-id -r --name-only ${{ github.sha }} \
          | grep -E '^(templates/|build/|static/|admin/|config\.json|package\.json|package-lock\.json)' \
          | head -1)
        if [ -n "$BLOG_CHANGED" ]; then
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "블로그 파일 감지됨: $BLOG_CHANGED → Build and Deploy Blog가 처리, Deploy Content 스킵"
        else
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "콘텐츠 전용 커밋 → Deploy Content 실행"
        fi

    - name: Node.js 설정
      if: steps.check-blog-files.outputs.skip != 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 의존성 설치
      if: steps.check-blog-files.outputs.skip != 'true'
      run: npm ci

    - name: 블로그 빌드
      if: steps.check-blog-files.outputs.skip != 'true'
      run: npm run build

    - name: 변경사항 데이터 커밋
      if: steps.check-blog-files.outputs.skip != 'true'
      run: |
        cd $GITHUB_WORKSPACE
        if git diff --quiet changelog/changelog_data.json 2>/dev/null; then
          echo "changelog_data.json 변경 없음"
        else
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add changelog/changelog_data.json
          git commit -m '변경사항 데이터 업데이트'
          git push
        fi

    - name: 배포 디렉토리 준비
      if: steps.check-blog-files.outputs.skip != 'true'
      run: |
        mkdir -p deploy
        cp -r public deploy/

        cat > deploy/index.html << 'EOF'
        <!DOCTYPE html>
        <html lang="ko">
        <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./public/">
          <link rel="canonical" href="./public/">
          <script>window.location.href = './public/';</script>
          <title>Redirecting...</title>
        </head>
        <body>
          <p>Redirecting to <a href="./public/">blog</a>...</p>
        </body>
        </html>
        EOF

    - name: GitHub Pages 배포
      if: steps.check-blog-files.outputs.skip != 'true'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./deploy
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Content: ${{ github.event.head_commit.message }}'
        force_orphan: true  # gh-pages 브랜치를 단일 커밋으로 유지 (히스토리 누적 방지)
