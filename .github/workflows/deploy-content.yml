name: Deploy Content

on:
  push:
    branches: [ main ]
    paths:
      - 'content/**'
      - 'album/**'
      - 'photo/**'

# 동일 브랜치에서 새 워크플로우 실행 시 이전 실행 취소
concurrency:
  group: deploy-content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-content:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # GitHub Pages 배포 권한

    steps:
    - name: Checkout 코드
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 전체 히스토리 (증분 빌드용)

    - name: Node.js 설정
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 의존성 설치
      run: npm ci

    - name: 블로그 빌드
      run: npm run build

    - name: 배포 디렉토리 준비
      run: |
        mkdir -p deploy
        cp -r public deploy/

        # 루트에 리다이렉트 index.html 생성
        cat > deploy/index.html << 'EOF'
        <!DOCTYPE html>
        <html lang="ko">
        <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./public/">
          <link rel="canonical" href="./public/">
          <script>window.location.href = './public/';</script>
          <title>Redirecting...</title>
        </head>
        <body>
          <p>Redirecting to <a href="./public/">blog</a>...</p>
        </body>
        </html>
        EOF

    - name: GitHub Pages 배포
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./deploy
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Content: ${{ github.event.head_commit.message }}'
