name: Deploy Content

on:
  push:
    branches: [ main ]
    paths:
      - 'content/**'
      - 'album/**'
      - 'photo/photo_data.json'   # 원본 JPG는 Release에 저장되므로 제외
      - 'photo/thumb_*'           # 썸네일만 트리거
      - 'changelog/**'
      - 'list/**'

# 동일 브랜치에서 새 워크플로우 실행 시 이전 실행 취소
concurrency:
  group: gh-pages-deploy-content
  cancel-in-progress: true

jobs:
  deploy-content:
    runs-on: ubuntu-latest
    # 실행 조건:
    # 1. github-actions[bot] 자동 커밋은 재귀 트리거 방지를 위해 무시
    # 2. 블로그 파일(templates/build/static/admin) 커밋은 Build and Deploy Blog가 처리
    #    → 커밋 메시지로 구분: 관리 페이지 저장은 항상 고정 메시지 사용
    #      - album 저장:     "앨범 데이터 업데이트"
    #      - photo 저장:     "사진 데이터 업데이트"
    #      - diary 저장:     "content: add/update N post(s)"
    #    → 위 패턴이 아닌 커밋(= 블로그 파일 수정 커밋)은 제외
    if: |
      github.actor != 'github-actions[bot]' &&
      (
        startsWith(github.event.head_commit.message, '앨범 데이터 업데이트') ||
        startsWith(github.event.head_commit.message, '사진 데이터 업데이트') ||
        startsWith(github.event.head_commit.message, '리스트 데이터 업데이트') ||
        startsWith(github.event.head_commit.message, '변경사항 데이터 업데이트') ||
        startsWith(github.event.head_commit.message, 'content:') ||
        startsWith(github.event.head_commit.message, 'Content:')
      )

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: write

    steps:
    - name: Checkout 코드
      uses: actions/checkout@v4
      with:
        fetch-depth: 50  # git log 감지용, 전체 히스토리 불필요
        lfs: true        # LFS 파일(앨범/포토 이미지) 다운로드

    - name: Node.js 설정
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 의존성 설치
      run: npm ci

    - name: 블로그 빌드
      run: npm run build

    - name: 리스트 데이터 정리 커밋
      run: |
        cd $GITHUB_WORKSPACE
        if git diff --quiet list/list_data.json 2>/dev/null; then
          echo "list_data.json 변경 없음"
        else
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add list/list_data.json
          git commit -m '리스트 데이터 정리'
          git push
        fi

    - name: 배포 디렉토리 준비
      run: |
        mkdir -p deploy
        cp -r public deploy/

        cat > deploy/index.html << 'EOF'
        <!DOCTYPE html>
        <html lang="ko">
        <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./public/">
          <link rel="canonical" href="./public/">
          <script>window.location.href = './public/';</script>
          <title>Redirecting...</title>
        </head>
        <body>
          <p>Redirecting to <a href="./public/">blog</a>...</p>
        </body>
        </html>
        EOF

    - name: GitHub Pages 배포
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./deploy
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Content: ${{ github.event.head_commit.message }}'
        force_orphan: true  # gh-pages 브랜치를 단일 커밋으로 유지 (히스토리 누적 방지)

  # 앨범 데이터가 변경된 경우에만: 음악 페이지를 별도 레포(iwna5724/music)로 미러링
  mirror-music:
    needs: deploy-content
    if: startsWith(github.event.head_commit.message, '앨범 데이터 업데이트')
    uses: ./.github/workflows/mirror-music.yml
    secrets:
      MUSIC_MIRROR_TOKEN: ${{ secrets.MUSIC_MIRROR_TOKEN }}
