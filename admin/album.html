<script>
// ================================
// Data Management
// ================================
let cells = [];
let currentSort = { key: 'id', asc: true };
const categoryFilters = new Set(['CD', 'ALBUM', 'EP', 'SINGLE']);
const categoryOrder = { 'CD': 0, 'ALBUM': 1, 'EP': 2, 'SINGLE': 3 };

const SNAPSHOT_FIELDS = ['artist', 'album', 'release', 'category', 'rating', 'duration', 'favTrack', 'likingTrack', 'discSplit', 'spotifyLink', 'commentKo', 'commentJa', 'tracks'];
const FIELD_LABELS_KO = { artist: '아티스트', album: '앨범명', release: '발매일', category: '구분', rating: '선호도', duration: '재생 시간', favTrack: '최애 트랙', likingTrack: '선호 트랙', discSplit: '더블 앨범', spotifyLink: 'Spotify', commentKo: '코멘트(한국어)', commentJa: '코멘트(일본어)', tracks: '수록곡' };
const FIELD_LABELS_JA = { artist: 'アーティスト', album: 'アルバム名', release: '発売日', category: '区分', rating: '選好度', duration: '再生時間', favTrack: '一番好きなトラック', likingTrack: '好きなトラック', discSplit: 'ダブルアルバム', spotifyLink: 'Spotify', commentKo: 'コメント(韓国語)', commentJa: 'コメント(日本語)', tracks: '収録曲' };

function snapshotCell(c) {
  const snap = {};
  for (const f of SNAPSHOT_FIELDS) {
    if (f === 'tracks' || f === 'favTrack' || f === 'likingTrack') snap[f] = JSON.stringify(c[f] || []);
    else snap[f] = c[f] !== undefined ? c[f] : (f === 'rating' || f === 'discSplit' ? 0 : '');
  }
  return snap;
}

function fieldDisplayVal(field, val) {
  if (field === 'rating') return (val || 0) === 0 ? '-' : String(val);
  if (field === 'discSplit') return (val && val > 0) ? `더블 앨범 (${val}트랙 후)` : '-';
  if (field === 'tracks') {
    const arr = typeof val === 'string' ? JSON.parse(val || '[]') : (val || []);
    return arr.length > 0 ? `${arr.length}곡` : '-';
  }
  if (field === 'favTrack' || field === 'likingTrack') {
    const arr = typeof val === 'string' ? JSON.parse(val || '[]') : (val || []);
    return arr.length > 0 ? arr.join(',') : '-';
  }
  return (val === undefined || val === null || val === '') ? '-' : String(val);
}

function durationToSeconds(d) {
  if (!d || !d.trim()) return -1;
  const parts = d.trim().split(':').map(Number);
  if (parts.some(isNaN)) return -1;
  if (parts.length === 2) return parts[0] * 60 + parts[1];
  if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
  return -1;
}

function calcCellDuration(cell) {
  const tracks = cell.tracks || [];
  let total = 0, hasAny = false;
  for (const t of tracks) {
    const d = typeof t === 'object' ? (t.duration || '') : '';
    const sec = durationToSeconds(d);
    if (sec >= 0) { total += sec; hasAny = true; }
  }
  if (!hasAny) return '';
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  return `${m}:${String(s).padStart(2, '0')}`;
}

function calcDiscDurations(cell) {
  const discSplit = cell.discSplit || 0;
  if (!discSplit) return null;
  const tracks = cell.tracks || [];
  let s1 = 0, s2 = 0;
  tracks.forEach((t, i) => {
    const d = typeof t === 'object' ? (t.duration || '') : '';
    const sec = durationToSeconds(d);
    if (sec < 0) return;
    if (i < discSplit) s1 += sec; else s2 += sec;
  });
  function fmt(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    return `${m}:${String(s).padStart(2,'0')}`;
  }
  return { disc1: fmt(s1), disc2: fmt(s2) };
}

function renderDurationField(el, cell, total) {
  if (!el) return;
  const discDurs = calcDiscDurations(cell);
  if (discDurs) {
    el.innerHTML = (total || '—') + `<span class="disc-dur-detail"> (${discDurs.disc1} + ${discDurs.disc2})</span>`;
  } else {
    el.textContent = total || '—';
  }
}

function updateComputedDuration() {
  if (!currentModalCell) return;
  const computed = calcCellDuration(currentModalCell);
  currentModalCell.duration = computed;
  renderDurationField(document.getElementById('modal-field-duration'), currentModalCell, computed);
}

function renderStars(rating) {
  if (!rating || rating === 0) return '';
  const full = Math.floor(rating);
  const half = (rating % 1 >= 0.5) ? 1 : 0;
  const empty = 5 - full - half;
  const base = '../static/images/';
  let html = '';
  for (let i = 0; i < full; i++) html += `<img src="${base}star.svg" class="star-img" alt="★">`;
  if (half) html += `<img src="${base}star_half.svg" class="star-img" alt="½">`;
  for (let i = 0; i < empty; i++) html += `<img src="${base}star_empty.svg" class="star-img" alt="☆">`;
  return html;
}

function updateRatingPreview() {
  const preview = document.getElementById('modal-field-rating-preview');
  if (preview && currentModalCell) {
    preview.innerHTML = renderStars(currentModalCell.rating);
  }
}

function getRatingDisplay(cell) {
  if (!cell || !cell.rating || cell.rating === 0) return null;
  return renderStars(cell.rating);
}

function sortCells(arr, key, asc) {
  return [...arr].sort((a, b) => {
    let va, vb;
    if (key === 'id') { va = a.id; vb = b.id; }
    else if (key === 'category') {
      va = categoryOrder[a.category] !== undefined ? categoryOrder[a.category] : 99;
      vb = categoryOrder[b.category] !== undefined ? categoryOrder[b.category] : 99;
    } else if (key === 'rating') { va = a.rating || 0; vb = b.rating || 0; }
    else if (key === 'release') {
      va = (a.release || '').replace(/\./g, '');
      vb = (b.release || '').replace(/\./g, '');
    } else if (key === 'duration') {
      va = durationToSeconds(a.duration);
      vb = durationToSeconds(b.duration);
    } else if (key === 'artist') {
      va = (a.artist || '').toLowerCase();
      vb = (b.artist || '').toLowerCase();
    } else {
      va = (a[key] || '').toString().toLowerCase();
      vb = (b[key] || '').toString().toLowerCase();
    }
    if (va < vb) return asc ? -1 : 1;
    if (va > vb) return asc ? 1 : -1;
    return 0;
  });
}

// ================================
// GitHub API
// ================================
let github = null;
let albumDataSha = null;
let deletedImgPaths = [];
let deletedAlbums = [];

function initGitHub() {
  const token = localStorage.getItem('github_token');
  const configStr = localStorage.getItem('github_config');
  if (!token || !configStr) return false;
  try {
    const config = JSON.parse(configStr);
    github = new GitHubAPI(token, config);
    return true;
  } catch (e) { return false; }
}

function generateUniqueFilename(ext) {
  return `${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${ext}`;
}

function getExtFromBase64(base64Data) {
  if (base64Data.startsWith('data:image/png')) return 'png';
  if (base64Data.startsWith('data:image/gif')) return 'gif';
  if (base64Data.startsWith('data:image/webp')) return 'webp';
  return 'jpg';
}

// ================================
// Load Data
// ================================
async function loadData() {
  try {
    const response = await fetch('../album/album_data.json');
    const data = await response.json();
    cells = data.cells || [];
  } catch (e) {
    cells = [];
  }
  cells.forEach(c => {
    if (c.link && !c.spotifyLink) c.spotifyLink = c.link;
    if (c.spotifyLink === undefined) c.spotifyLink = '';
    delete c.link; delete c.ytMusicLink; delete c.text;
    if (c.imgPath === undefined) c.imgPath = '';
    if (c.commentKo === undefined) c.commentKo = '';
    if (c.commentJa === undefined) c.commentJa = '';
    if (!Array.isArray(c.favTrack)) c.favTrack = c.favTrack ? [c.favTrack] : [];
    if (!Array.isArray(c.likingTrack)) c.likingTrack = c.likingTrack ? [c.likingTrack] : [];
    if (!c.discSplit) c.discSplit = 0;
    if (!Array.isArray(c.tracks)) c.tracks = [{ title: '', duration: '', excluded: false }];
    c.tracks = c.tracks.map(t => {
      if (typeof t === 'string') return { title: t, duration: '', excluded: false };
      return { title: t.title || '', duration: t.duration || '', excluded: !!t.excluded };
    });
    delete c.excludedTracks;
  });
  while (cells.length < 201) {
    cells.push({
      id: cells.length, img: '', imgPath: '', artist: '', album: '',
      release: '', category: 'ALBUM', rating: 0, duration: '',
      favTrack: [], likingTrack: [], discSplit: 0, spotifyLink: '', commentKo: '', commentJa: '',
      tracks: [{ title: '', duration: '', excluded: false }]
    });
  }
  cells.forEach(c => { c._snapshot = snapshotCell(c); });
}

// ================================
// Save Data
// ================================
async function saveData() {
  if (!initGitHub()) {
    alert('❌ GitHub 로그인이 필요합니다.\n관리자 페이지에서 먼저 로그인해주세요.');
    return;
  }
  const saveBtn = document.getElementById('save-data');
  const originalText = saveBtn.textContent;
  saveBtn.textContent = '⏳ 저장 준비 중...';
  saveBtn.disabled = true;

  try {
    const changes = [];
    let imageCount = 0;
    const currentImgPaths = new Set(cells.map(c => c.imgPath).filter(Boolean));
    for (const imgPath of deletedImgPaths) {
      if (!currentImgPaths.has(imgPath)) changes.push({ type: 'delete', path: imgPath });
    }
    for (const cell of cells) {
      if (cell.img && cell.img.startsWith('data:')) {
        const ext = getExtFromBase64(cell.img);
        const path = cell.imgPath || `album/images/${generateUniqueFilename(ext)}`;
        changes.push({ type: cell.imgPath ? 'update' : 'add', path, content: cell.img, binary: true });
        cell.imgPath = path;
        imageCount++;
      }
    }
    const dataForSave = {
      cells: cells.map(c => {
        const { img, isContentChanged, isNew, _snapshot, ...rest } = c;
        return rest;
      })
    };
    changes.push({ type: albumDataSha ? 'update' : 'add', path: 'album/album_data.json', content: JSON.stringify(dataForSave, null, 2), binary: false });

    const commitMessage = imageCount > 0 ? `앨범 데이터 업데이트 (이미지 ${imageCount}개 포함)` : '앨범 데이터 업데이트';
    await github.createBatchCommit(changes, commitMessage, (status) => { saveBtn.textContent = `⏳ ${status}`; });

    albumDataSha = null; deletedImgPaths = []; deletedAlbums = [];
    cells.forEach(c => { delete c.isContentChanged; delete c.isNew; c._snapshot = snapshotCell(c); });
    saveBtn.textContent = originalText;
    saveBtn.disabled = false;
    alert(imageCount > 0
      ? `✅ 데이터가 GitHub에 저장되었습니다.\n(${changes.length}개 파일, 이미지 ${imageCount}개 포함)\n단일 커밋으로 처리되어 빌드가 1회만 실행됩니다.`
      : '✅ 데이터가 GitHub에 저장되었습니다.\nGitHub Actions에서 자동으로 빌드가 시작됩니다.');

  } catch (e) {
    console.error('Save failed:', e);
    saveBtn.textContent = '💾 데이터 저장';
    saveBtn.disabled = false;
    if (e.message.includes('sha') || e.message.includes('409') || e.message.includes('reference')) {
      albumDataSha = null;
      alert('❌ 저장에 실패했습니다.\n파일이 외부에서 수정되었을 수 있습니다.\n다시 시도해주세요.');
    } else {
      alert('❌ 저장에 실패했습니다.\n' + e.message);
    }
  }
}

async function checkAlbumDraft() {
  try {
    const draft = await DraftDB.getAlbumDraft();
    if (!draft || !draft.savedAt) return;
    const banner = document.getElementById('draft-restore-banner');
    const msg = document.getElementById('draft-restore-msg');
    const savedAt = new Date(draft.savedAt);
    const fmt = `${savedAt.getMonth()+1}/${savedAt.getDate()} ${String(savedAt.getHours()).padStart(2,'0')}:${String(savedAt.getMinutes()).padStart(2,'0')}`;
    msg.textContent = `임시저장된 앨범 데이터가 있습니다 (${fmt})`;
    banner.style.display = 'flex';
  } catch (e) {
    console.warn('draft 확인 실패:', e);
  }
}

async function saveAlbumDraft() {
  const btn = document.getElementById('save-draft-btn');
  const orig = btn.textContent;
  btn.textContent = '⏳ 저장 중...';
  btn.disabled = true;
  try {
    const snapshot = cells.map(c => {
      const { _snapshot, ...rest } = c;
      return rest;
    });
    await DraftDB.putAlbumDraft({
      cells: snapshot,
      deletedImgPaths: [...deletedImgPaths],
      deletedAlbums: [...deletedAlbums],
      savedAt: Date.now(),
    });
    btn.textContent = '✅ 저장됨';
    setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1500);
  } catch (e) {
    console.error('임시저장 실패:', e);
    alert('임시저장 실패: ' + e.message);
    btn.textContent = orig;
    btn.disabled = false;
  }
}

async function restoreAlbumDraft() {
  try {
    const draft = await DraftDB.getAlbumDraft();
    if (!draft || !draft.cells) return;
    cells = draft.cells.map(c => {
      if (c.spotifyLink === undefined) c.spotifyLink = '';
      if (c.commentKo === undefined) c.commentKo = '';
      if (c.commentJa === undefined) c.commentJa = '';
      if (!Array.isArray(c.favTrack)) c.favTrack = c.favTrack ? [c.favTrack] : [];
      if (!Array.isArray(c.likingTrack)) c.likingTrack = c.likingTrack ? [c.likingTrack] : [];
      if (!c.discSplit) c.discSplit = 0;
      if (!Array.isArray(c.tracks)) c.tracks = [{ title: '', duration: '', excluded: false }];
      c._snapshot = snapshotCell(c);
      return c;
    });
    deletedImgPaths = draft.deletedImgPaths || [];
    deletedAlbums = draft.deletedAlbums || [];
    document.getElementById('draft-restore-banner').style.display = 'none';
    createGrid();
    const savedView = localStorage.getItem('admin_album_view');
    if (savedView === 'list') renderList();
    alert('✅ 임시저장 데이터를 불러왔습니다.');
  } catch (e) {
    console.error('draft 불러오기 실패:', e);
    alert('불러오기 실패: ' + e.message);
  }
}

const albumListBody = document.getElementById('album-list-body');
const COL_COUNT = 8;
const noInfo = '-';

function getRatingStars(rating) {
  return renderStars(rating);
}

function getPrimaryArtist(artist) {
  if (!artist) return '';
  return artist.split(',')[0].trim().toLowerCase();
}

function buildArtistFrequency(arr) {
  const freq = {};
  arr.forEach(c => {
    const primary = getPrimaryArtist(c.artist);
    if (primary) freq[primary] = (freq[primary] || 0) + 1;
  });
  return freq;
}

function getGroupKey(cell, key, artistFreq) {
  if (key === 'id') return null;
  if (key === 'artist') {
    const primary = getPrimaryArtist(cell.artist);
    return String(artistFreq[primary] || 0);
  }
  if (key === 'release') {
    const year = parseInt((cell.release || '').split('.')[0]);
    if (isNaN(year)) return 'unknown';
    return String(Math.floor(year / 10) * 10);
  }
  if (key === 'duration') {
    const sec = durationToSeconds(cell.duration);
    if (sec < 0) return 'none';
    const min = sec / 60;
    if (min < 10) return 'under9';
    if (min < 30) return '10to29';
    if (min < 60) return '30to59';
    return 'over60';
  }
  if (key === 'rating') {
    const r = cell.rating || 0;
    if (r === 0) return '0';
    const rounded = Math.round(r * 2) / 2;
    return String(rounded);
  }
  if (key === 'category') return cell.category || '';
  return null;
}

const groupDurLabels = { under9: '9분 미만', '10to29': '10~29분', '30to59': '30~59분', over60: '60분 이상', none: noInfo };

function getGroupLabel(key, groupKey) {
  if (key === 'artist') return `${groupKey}회 등장`;
  if (key === 'release') {
    if (groupKey === 'unknown') return noInfo;
    return `${groupKey}년대`;
  }
  if (key === 'duration') return groupDurLabels[groupKey] || noInfo;
  if (key === 'rating') {
    const r = parseFloat(groupKey);
    if (r === 0) return '선호도 없음';
    return getRatingStars(r);
  }
  if (key === 'category') return groupKey || noInfo;
  return '';
}

function insertSeparator(label, stats) {
  const tr = document.createElement('tr');
  tr.className = 'list-group-separator';
  const td = document.createElement('td');
  td.colSpan = COL_COUNT;
  if (stats) {
    const labelSpan = document.createElement('span');
    labelSpan.innerHTML = label;
    td.appendChild(labelSpan);
    const statsSpan = document.createElement('span');
    statsSpan.className = 'separator-stats';
    statsSpan.textContent = `(${stats.count}/${stats.total}) … ${stats.percent}%`;
    td.appendChild(statsSpan);
  } else {
    td.innerHTML = label;
  }
  tr.appendChild(td);
  albumListBody.appendChild(tr);
}

function renderList() {
  const filtered = cells.filter(c => (c.img || c.imgPath) && c.id !== 0 && categoryFilters.has(c.category));
  let artistFreq = null;
  if (currentSort.key === 'artist') artistFreq = buildArtistFrequency(filtered);

  const sortedForList = [...filtered].sort((a, b) => {
    let va, vb;
    if (currentSort.key === 'category') {
      va = categoryOrder[a.category] !== undefined ? categoryOrder[a.category] : 99;
      vb = categoryOrder[b.category] !== undefined ? categoryOrder[b.category] : 99;
    } else if (currentSort.key === 'rating') { va = a.rating || 0; vb = b.rating || 0; }
    else if (currentSort.key === 'id') { va = a.id; vb = b.id; }
    else if (currentSort.key === 'release') {
      va = (a.release || '').replace(/\./g, '');
      vb = (b.release || '').replace(/\./g, '');
    } else if (currentSort.key === 'duration') {
      va = durationToSeconds(a.duration); vb = durationToSeconds(b.duration);
    } else if (currentSort.key === 'artist') {
      const pa = getPrimaryArtist(a.artist), pb = getPrimaryArtist(b.artist);
      const fa = artistFreq[pa] || 0, fb = artistFreq[pb] || 0;
      if (fa !== fb) return currentSort.asc ? fb - fa : fa - fb;
      if (pa !== pb) { va = pa; vb = pb; } else {
        const ca = (a.artist || '').includes(',') ? 1 : 0;
        const cb = (b.artist || '').includes(',') ? 1 : 0;
        va = currentSort.asc ? ca : cb; vb = currentSort.asc ? cb : ca;
      }
    } else { va = a[currentSort.key] || ''; vb = b[currentSort.key] || ''; }
    if (va < vb) return currentSort.asc ? -1 : 1;
    if (va > vb) return currentSort.asc ? 1 : -1;
    return 0;
  });

  const showStats = currentSort.key !== 'artist' && currentSort.key !== 'id';
  let groupStats = {}, totalForStats = 0;
  if (showStats) {
    totalForStats = filtered.length;
    sortedForList.forEach(cell => {
      const gk = getGroupKey(cell, currentSort.key, artistFreq);
      if (gk !== null) groupStats[gk] = (groupStats[gk] || 0) + 1;
    });
  }

  albumListBody.innerHTML = '';
  let lastGroupKey = null;

  sortedForList.forEach(cell => {
    const gk = getGroupKey(cell, currentSort.key, artistFreq);
    if (gk !== null && gk !== lastGroupKey) {
      let stats = null;
      if (showStats && groupStats[gk] !== undefined) {
        const count = groupStats[gk];
        const percent = totalForStats > 0 ? Math.round(count / totalForStats * 100) : 0;
        stats = { count, total: totalForStats, percent };
      }
      insertSeparator(getGroupLabel(currentSort.key, gk), stats);
      lastGroupKey = gk;
    }

    const tr = document.createElement('tr');
    tr.style.cursor = 'pointer';
    tr.onclick = () => openModal(cell);

    const tdId = document.createElement('td');
    tdId.textContent = cell.id; tdId.className = 'list-cell-id';
    tr.appendChild(tdId);

    const tdImg = document.createElement('td');
    const imgSrc = getImageSrc(cell);
    if (imgSrc) {
      const img = document.createElement('img');
      img.loading = 'lazy'; img.src = imgSrc; img.className = 'list-cover-img';
      tdImg.appendChild(img);
    }
    tr.appendChild(tdImg);

    const tdArtist = document.createElement('td');
    tdArtist.textContent = cell.artist || noInfo;
    if (!cell.artist) tdArtist.className = 'empty';
    tr.appendChild(tdArtist);

    const tdAlbum = document.createElement('td');
    tdAlbum.textContent = cell.album || noInfo;
    if (!cell.album) tdAlbum.className = 'empty';
    tr.appendChild(tdAlbum);

    const tdRelease = document.createElement('td');
    tdRelease.textContent = cell.release || noInfo;
    tdRelease.className = 'desktop-only' + (!cell.release ? ' empty' : '');
    tr.appendChild(tdRelease);

    const tdDuration = document.createElement('td');
    tdDuration.textContent = cell.duration || noInfo;
    tdDuration.className = 'desktop-only' + (!cell.duration ? ' empty' : '');
    tr.appendChild(tdDuration);

    const tdRating = document.createElement('td');
    if (cell.rating && cell.rating > 0) {
      tdRating.innerHTML = getRatingStars(cell.rating);
      tdRating.className = 'desktop-only list-rating';
    } else {
      tdRating.textContent = noInfo; tdRating.className = 'desktop-only empty';
    }
    tr.appendChild(tdRating);

    const tdCategory = document.createElement('td');
    tdCategory.textContent = cell.category || noInfo;
    tdCategory.className = 'desktop-only';
    tr.appendChild(tdCategory);

    albumListBody.appendChild(tr);
  });

  const table = document.querySelector('.album-list-table');
  if (currentSort.key === 'id') table.classList.add('no-groups');
  else table.classList.remove('no-groups');

  updateSortIndicators();
}

function updateSortIndicators() {
  document.querySelectorAll('.album-list-table th.sortable').forEach(th => {
    th.classList.remove('sort-asc', 'sort-desc');
    if (th.dataset.sort === currentSort.key) {
      th.classList.add(currentSort.asc ? 'sort-asc' : 'sort-desc');
    }
  });
}

document.querySelectorAll('.album-list-table th.sortable').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    if (currentSort.key === key) currentSort.asc = !currentSort.asc;
    else { currentSort.key = key; currentSort.asc = key === 'rating' ? false : true; }
    renderList();
  });
});

// 수록곡 행 간 위/아래 방향키 네비게이션
tracksEditor.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowUp' && e.key !== 'Enter') return;
  const rows = Array.from(tracksEditor.querySelectorAll('.track-editor-row'));
  const currentRow = e.target.closest('.track-editor-row');
  if (!currentRow) return;
  const rowIndex = rows.indexOf(currentRow);
  if (rowIndex === -1) return;

  const focusables = (row) => Array.from(row.querySelectorAll('input, select'));
  const currentFocusables = focusables(currentRow);
  const colIndex = currentFocusables.indexOf(e.target);
  if (colIndex === -1) return;

  const targetRowIndex = e.key === 'Enter' ? rowIndex + 1 : rowIndex - 1;
  if (targetRowIndex < 0 || targetRowIndex >= rows.length) return;

  const targetFocusables = focusables(rows[targetRowIndex]);
  const targetEl = targetFocusables[colIndex];
  if (targetEl) {
    e.preventDefault();
    targetEl.focus();
    if (targetEl.tagName === 'INPUT' && targetEl.type === 'text') {
      targetEl.select();
    }
  }
});

function createDiscHeaderRow(label) {
  const row = document.createElement('div');
  row.className = 'disc-header-row';
  row.textContent = label;
  return row;
}

function renderTracksEditor(cell) {
  tracksEditor.innerHTML = '';
  const tracks = cell.tracks || [];
  const discSplit = cell.discSplit || 0;

  if (discSplit > 0) {
    tracksEditor.appendChild(createDiscHeaderRow('Disc 1'));
  }

  tracks.forEach((t, i) => {
    if (discSplit > 0 && i === discSplit) {
      tracksEditor.appendChild(createDiscHeaderRow('Disc 2'));
    }

    const track = typeof t === 'string'
      ? { title: t, duration: '', excluded: false }
      : { title: t.title || '', duration: t.duration || '', excluded: !!t.excluded };

    const isFav = !track.excluded && track.title.trim() !== '' && (cell.favTrack || []).includes(track.title);
    const isLiking = !track.excluded && track.title.trim() !== '' && (cell.likingTrack || []).includes(track.title);
    // heartState: 0=없음(heart_select), 1=특히 좋아하는 곡(heart_empty), 2=가장 좋아하는 곡(heart)
    let heartState = track.excluded || track.title.trim() === '' ? 0 : (isFav ? 2 : (isLiking ? 1 : 0));

    const row = document.createElement('div');
    row.className = 'track-editor-row' + (track.excluded ? ' is-excluded' : '') + (isFav ? ' is-fav' : '') + (isLiking ? ' is-liking' : '');

    // 트랙 번호 (더블 앨범의 경우 Disc 2는 1부터 다시 시작)
    const numSpan = document.createElement('span');
    numSpan.className = 'track-num';
    numSpan.textContent = (discSplit > 0 && i >= discSplit) ? (i - discSplit + 1) : (i + 1);

    // 하트 버튼 (3단계: 없음→특히 좋아하는 곡→가장 좋아하는 곡→없음)
    const HEART_SRCS = ['../static/images/heart_select.svg', '../static/images/heart_empty.svg', '../static/images/heart.svg'];
    const heartBtn = document.createElement('img');
    heartBtn.className = 'track-heart-btn';
    heartBtn.src = HEART_SRCS[heartState];
    heartBtn.draggable = false;
    if (!track.excluded) {
      heartBtn.addEventListener('click', () => {
        if (!currentModalCell) return;
        const title = currentModalCell.tracks[i].title;
        if (!title.trim()) return;
        heartState = (heartState + 1) % 3;
        heartBtn.src = HEART_SRCS[heartState];
        currentModalCell.favTrack = currentModalCell.favTrack.filter(t => t !== title);
        if (!Array.isArray(currentModalCell.likingTrack)) currentModalCell.likingTrack = [];
        currentModalCell.likingTrack = currentModalCell.likingTrack.filter(t => t !== title);
        if (heartState === 2) {
          currentModalCell.favTrack = [...currentModalCell.favTrack, title];
        } else if (heartState === 1) {
          currentModalCell.likingTrack = [...currentModalCell.likingTrack, title];
        }
        row.classList.remove('is-fav', 'is-liking');
        if (heartState === 2) row.classList.add('is-fav');
        else if (heartState === 1) row.classList.add('is-liking');
        markUpdated();
      });
    }

    // 제목 입력
    const titleInput = document.createElement('input');
    titleInput.type = 'text';
    titleInput.className = 'edit-field-input track-title-input';
    titleInput.placeholder = '곡 제목';
    titleInput.value = track.title;
    titleInput.addEventListener('input', () => {
      if (!currentModalCell) return;
      const oldTitle = currentModalCell.tracks[i].title;
      currentModalCell.tracks[i].title = titleInput.value;
      // 최애/선호 트랙이었다면 title 업데이트
      const fi = currentModalCell.favTrack.indexOf(oldTitle);
      if (fi !== -1) {
        currentModalCell.favTrack = [...currentModalCell.favTrack];
        currentModalCell.favTrack[fi] = titleInput.value;
      }
      if (!Array.isArray(currentModalCell.likingTrack)) currentModalCell.likingTrack = [];
      const li2 = currentModalCell.likingTrack.indexOf(oldTitle);
      if (li2 !== -1) {
        currentModalCell.likingTrack = [...currentModalCell.likingTrack];
        currentModalCell.likingTrack[li2] = titleInput.value;
      }
      markUpdated();
    });

    // 재생 시간 입력
    const durInput = document.createElement('input');
    durInput.type = 'text';
    durInput.className = 'edit-field-input track-dur-input';
    durInput.placeholder = 'M:SS';
    durInput.value = track.duration;
    durInput.disabled = track.excluded;
    durInput.addEventListener('input', () => {
      if (!currentModalCell) return;
      currentModalCell.tracks[i].duration = durInput.value;
      updateComputedDuration();
      markUpdated();
    });

    // 제외 체크박스
    const excludedLabel = document.createElement('label');
    excludedLabel.className = 'track-excluded-label';
    excludedLabel.title = '제외 트랙';
    const excludedCb = document.createElement('input');
    excludedCb.type = 'checkbox';
    excludedCb.checked = track.excluded;
    excludedCb.addEventListener('change', () => {
      if (!currentModalCell) return;
      currentModalCell.tracks[i].excluded = excludedCb.checked;
      // 제외로 변경 시 최애/선호 트랙이었다면 해제
      if (excludedCb.checked) {
        const exTitle = currentModalCell.tracks[i].title;
        currentModalCell.favTrack = currentModalCell.favTrack.filter(t => t !== exTitle);
        if (!Array.isArray(currentModalCell.likingTrack)) currentModalCell.likingTrack = [];
        currentModalCell.likingTrack = currentModalCell.likingTrack.filter(t => t !== exTitle);
      }
      markUpdated();
      renderTracksEditor(currentModalCell);
    });
    excludedLabel.appendChild(excludedCb);
    excludedLabel.appendChild(document.createTextNode('⨂'));

    // 삭제 버튼
    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'track-del-btn';
    delBtn.textContent = '−';
    delBtn.title = '삭제';
    delBtn.addEventListener('click', () => {
      if (!currentModalCell) return;
      // 삭제된 트랙이 최애/선호였다면 제거
      const delTitle = currentModalCell.tracks[i].title;
      currentModalCell.favTrack = currentModalCell.favTrack.filter(t => t !== delTitle);
      if (!Array.isArray(currentModalCell.likingTrack)) currentModalCell.likingTrack = [];
      currentModalCell.likingTrack = currentModalCell.likingTrack.filter(t => t !== delTitle);
      currentModalCell.tracks.splice(i, 1);
      markUpdated();
      renderTracksEditor(currentModalCell);
    });

    row.appendChild(numSpan);
    row.appendChild(heartBtn);
    row.appendChild(titleInput);
    row.appendChild(durInput);
    row.appendChild(excludedLabel);
    row.appendChild(delBtn);
    tracksEditor.appendChild(row);
  });

  // 재생 시간 자동 계산
  updateComputedDuration();
}

btnAddTrack.addEventListener('click', () => {
  if (!currentModalCell) return;
  if (!Array.isArray(currentModalCell.tracks)) currentModalCell.tracks = [];
  currentModalCell.tracks.push({ title: '', duration: '', excluded: false });
  markUpdated();
  renderTracksEditor(currentModalCell);
  // 새로 추가된 입력란으로 포커스
  const inputs = tracksEditor.querySelectorAll('.track-title-input');
  if (inputs.length > 0) inputs[inputs.length - 1].focus();
});

function updateDoubleAlbumBtn() {
  if (!btnDoubleAlbum) return;
  const split = currentModalCell ? (currentModalCell.discSplit || 0) : 0;
  if (split > 0) {
    btnDoubleAlbum.textContent = `◑ 더블 앨범 (${split}트랙 후)`;
    btnDoubleAlbum.classList.add('is-active');
  } else {
    btnDoubleAlbum.textContent = '◑ 더블 앨범';
    btnDoubleAlbum.classList.remove('is-active');
  }
}

btnDoubleAlbum.addEventListener('click', () => {
  if (!currentModalCell) return;
  const tracks = currentModalCell.tracks || [];
  const current = currentModalCell.discSplit || 0;
  const max = tracks.length - 1;
  let msg = `Disc 1의 마지막 트랙 번호를 입력하세요. (1 ~ ${max})\n0 또는 빈칸으로 입력하면 더블 앨범 설정을 해제합니다.`;
  if (current > 0) msg = `현재 Disc 1은 ${current}트랙입니다.\n${msg}`;
  const input = prompt(msg, current > 0 ? String(current) : '');
  if (input === null) return;
  const n = parseInt(input.trim(), 10);
  if (input.trim() === '' || n === 0 || isNaN(n)) {
    currentModalCell.discSplit = 0;
  } else if (n >= 1 && n <= max) {
    currentModalCell.discSplit = n;
  } else {
    alert(`1부터 ${max} 사이의 숫자를 입력해주세요.`);
    return;
  }
  markUpdated();
  renderTracksEditor(currentModalCell);
  updateDoubleAlbumBtn();
});

// 이미지 업로드
modalImageInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file || !currentModalCell) return;
  const reader = new FileReader();
  reader.onload = () => {
    currentModalCell.img = reader.result;
    currentModalCell.updatedAt = Date.now();
    currentModalCell.isContentChanged = true;
    modalImage.src = reader.result;
    modalImage.style.display = '';
    modalImageLabel.classList.add('has-image');
    // 그리드 해당 셀 업데이트
    const gridCell = albumGrid.querySelector(`[data-id="${currentModalCell.id}"]`);

      gridCell.classList.remove('empty-cell');

      if (!img) { img = document.createElement('img'); gridCell.appendChild(img); }
      img.src = reader.result;
    }
  };

  e.target.value = '';
});

function openModal(cell) {
  if (!cell) return;
  updateNavigableCells();
  modal.classList.add('active');
  populateEditModal(cell);
}

function closeModal() {
  if (!modal.classList.contains('active')) return;
  modal.classList.remove('active');
  currentModalCell = null;
}

modal.addEventListener('click', (e) => {

});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeModal(); closeSortModal(); }
});

// ================================
// ID 변경
// ================================
function changeId(cell, newId) {
  const oldId = cell.id;
  if (newId < oldId) {
    cells.forEach(c => { if (c !== cell && c.id >= newId && c.id < oldId) { c.id++; c.updatedAt = Date.now(); } });
  } else {
    cells.forEach(c => { if (c !== cell && c.id > oldId && c.id <= newId) { c.id--; c.updatedAt = Date.now(); } });
  }
  cell.id = newId;
  cell.updatedAt = Date.now();
}

// ================================
// 전체 ID 자동 재계산
// ================================
function recalculateAllIds() {
  // id=0 (center album) 제외
  const sortKey = c => c.release ? c.release : '9999.99.99';
  const sortByDate = (a, b) => sortKey(a).localeCompare(sortKey(b));

  const cdAlbums = cells.filter(c => c.id !== 0 && c.category === 'CD').sort(sortByDate);
  const nonCdAlbums = cells.filter(c => c.id !== 0 && c.category !== 'CD').sort(sortByDate);

  cdAlbums.forEach((c, i) => { c.id = i + 1; });
  const numCds = cdAlbums.length;
  nonCdAlbums.forEach((c, i) => { c.id = numCds + i + 1; });
}

// ================================
// 앨범 삭제
// ================================
document.getElementById('modal-delete-btn').addEventListener('click', () => {
  if (!currentModalCell) return;
  const cell = currentModalCell;
  const label = cell.artist && cell.album ? `${cell.artist} - ${cell.album}` : `ID ${cell.id}`;
  if (!confirm(`정말로 삭제하시겠습니까?\n\n${label}`)) return;

  if (cell.imgPath) deletedImgPaths.push(cell.imgPath);
  deletedAlbums.push({ id: cell.id, artist: cell.artist || '', album: cell.album || '' });
  const removedId = cell.id;

  // 데이터 초기화 (배열에서 제거하지 않고 빈 셀로 대체)
  const idx = cells.indexOf(cell);
  cells.splice(idx, 1);
  cells.forEach(c => { if (c.id > removedId) c.id--; });

  closeModal();
  createGrid();
  if (albumListContainer.style.display !== 'none') renderList();
});

document.getElementById('btn-add-album').addEventListener('click', () => {

    id: -1, img: '', imgPath: '', artist: '', album: '', release: '',
    category: 'ALBUM', rating: 0, duration: '', favTrack: [],
    spotifyLink: '', commentKo: '', commentJa: '', tracks: [{ title: '', duration: '', excluded: false }],
    updatedAt: Date.now(), isNew: true
  };

});

// ================================
// PNG Export
// ================================
document.getElementById('save-png').addEventListener('click', async () => {
  const tempGrid = document.createElement('div');
  tempGrid.style.cssText = 'display:grid;grid-template-columns:repeat(15,50px);grid-template-rows:repeat(15,50px);position:fixed;left:-9999px;';
  document.body.appendChild(tempGrid);

  let id = 1;
  const gridSize = 15, centerStart = 6, centerEnd = 10;

  function getImgSrc(cellData) {
    if (!cellData) return '';
    if (cellData.img) return cellData.img;
    if (cellData.imgPath) return '../' + cellData.imgPath;
    return '';
  }

  for (let r = 1; r <= gridSize; r++) {
    for (let c = 1; c <= gridSize; c++) {
      if (r >= centerStart && r <= centerEnd && c >= centerStart && c <= centerEnd) {
        if (r === centerStart && c === centerStart) {
          const cell = document.createElement('div');
          cell.style.cssText = `width:250px;height:250px;grid-column:${centerStart}/span 5;grid-row:${centerStart}/span 5;overflow:hidden;background:#e9ecef;`;
          const img = document.createElement('img');
          img.src = '../static/images/music_center.png'; img.style.cssText = 'width:100%;height:100%;object-fit:cover;';
          cell.appendChild(img);
          tempGrid.appendChild(cell);
        }
      } else {
        const cell = document.createElement('div');
        cell.style.cssText = 'width:50px;height:50px;overflow:hidden;background:#e9ecef;';
        const cellData = cells.find(c => c.id === id);
        const imgSrc = getImgSrc(cellData);
        if (imgSrc) {
          const img = document.createElement('img');
          img.src = imgSrc; img.style.cssText = 'width:100%;height:100%;object-fit:cover;';
          cell.appendChild(img);
        }
        tempGrid.appendChild(cell);
        id++;
      }
    }
  }

  try {
    const canvas = await html2canvas(tempGrid, { scale: 4005 / 750, useCORS: true, backgroundColor: '#ffffff' });
    const link = document.createElement('a');
    link.download = 'album.png'; link.href = canvas.toDataURL('image/png'); link.click();
  } catch (error) {
    console.error('PNG 저장 실패:', error);
    alert('PNG 저장에 실패했습니다.');
  } finally {
    document.body.removeChild(tempGrid);
  }
});
