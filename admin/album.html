<script>
// ================================
// Data Management
// ================================
let cells = [];
let currentSort = { key: 'id', asc: true };
const categoryFilters = new Set(['CD', 'ALBUM', 'EP', 'SINGLE']);

const categoryOrder = { 'CD': 0, 'ALBUM': 1, 'EP': 2, 'SINGLE': 3 };

function durationToSeconds(d) {
  if (!d || !d.trim()) return -1;
  const parts = d.trim().split(':').map(Number);
  if (parts.some(isNaN)) return -1;
  if (parts.length === 2) return parts[0] * 60 + parts[1];
  if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
  return -1;
}

function sortCells(arr, key, asc) {
  return [...arr].sort((a, b) => {
    let va, vb;
    if (key === 'id') {
      va = a.id; vb = b.id;
    } else if (key === 'category') {
      va = categoryOrder[a.category] !== undefined ? categoryOrder[a.category] : 99;
      vb = categoryOrder[b.category] !== undefined ? categoryOrder[b.category] : 99;
    } else if (key === 'rating') {
      va = a.rating || 0; vb = b.rating || 0;
    } else if (key === 'release') {
      va = (a.release || '').replace(/\./g, '');
      vb = (b.release || '').replace(/\./g, '');
    } else if (key === 'duration') {
      va = durationToSeconds(a.duration);
      vb = durationToSeconds(b.duration);
    } else if (key === 'artist') {
      va = (a.artist || '').toLowerCase();
      vb = (b.artist || '').toLowerCase();
    } else {
      va = (a[key] || '').toString().toLowerCase();
      vb = (b[key] || '').toString().toLowerCase();
    }
    if (va < vb) return asc ? -1 : 1;
    if (va > vb) return asc ? 1 : -1;
    return 0;
  });
}

// Load data from JSON file
async function loadData() {
  try {
    const response = await fetch('../album/album_data.json');
    const data = await response.json();
    cells = data.cells || [];
  } catch (e) {
    console.log('No existing data file, starting fresh');
    cells = [];
  }

  // 마이그레이션: 기존 Base64 img → imgPath 필드로 변환
  cells.forEach(c => {
    // 기존 link → spotifyLink 마이그레이션
    if (c.link && !c.spotifyLink) {
      c.spotifyLink = c.link;
    }
    if (c.spotifyLink === undefined) c.spotifyLink = '';
    delete c.link;
    delete c.ytMusicLink;
    delete c.text;

    // 새 필드 초기화
    if (c.imgPath === undefined) c.imgPath = '';

    // 기존 Base64 img가 있고 imgPath가 없으면 마이그레이션 대기 상태
    // (실제 마이그레이션은 저장 시 수행)
  });

  // Ensure we have at least 201 cells (0-200)
  while (cells.length < 201) {
    cells.push({
      id: cells.length,
      img: '',       // 미리보기용 (Base64 또는 URL)
      imgPath: '',   // 저장된 이미지 경로 (예: album/images/1.jpg)
      artist: '',
      album: '',
      release: '',
      category: 'ALBUM',
      rating: 0,
      duration: '',
      excludedTracks: '',
      favTrack: '',
      spotifyLink: ''
    });
  }

  // 로드 시점 상태를 스냅샷으로 저장 (수정 감지용)
  cells.forEach(c => { c._snapshot = snapshotCell(c); });
}

// GitHub API 인스턴스
let github = null;
let albumDataSha = null; // 기존 파일의 SHA (업데이트 시 필요)
let deletedImgPaths = []; // 삭제된 앨범의 이미지 경로 목록 (저장 시 GitHub에서 삭제)
let deletedAlbums = [];  // 삭제된 앨범의 정보 목록 (changelog 기록용)

// 스냅샷 비교용 필드 목록 및 레이블
const SNAPSHOT_FIELDS = ['artist', 'album', 'release', 'category', 'rating', 'duration', 'excludedTracks', 'favTrack', 'spotifyLink'];
const FIELD_LABELS_KO = { artist: '아티스트', album: '앨범명', release: '발매일', category: '구분', rating: '선호도', duration: '재생 시간', excludedTracks: '제외 트랙', favTrack: '최애 트랙', spotifyLink: 'Spotify' };
const FIELD_LABELS_JA = { artist: 'アーティスト', album: 'アルバム名', release: '発売日', category: '区分', rating: '好み', duration: '再生時間', excludedTracks: '除外トラック', favTrack: '最高トラック', spotifyLink: 'Spotify' };

function snapshotCell(c) {
  const snap = {};
  for (const f of SNAPSHOT_FIELDS) snap[f] = c[f] !== undefined ? c[f] : (f === 'rating' ? 0 : '');
  return snap;
}

function fieldDisplayVal(field, val) {
  if (field === 'rating') return (val || 0) === 0 ? '-' : String(val);
  return (val === undefined || val === null || val === '') ? '-' : String(val);
}

// GitHub 설정 초기화
function initGitHub() {
  const token = localStorage.getItem('github_token');
  const configStr = localStorage.getItem('github_config');

  if (!token || !configStr) {
    return false;
  }

  try {
    const config = JSON.parse(configStr);
    github = new GitHubAPI(token, config);
    return true;
  } catch (e) {
    console.error('GitHub config parse error:', e);
    return false;
  }
}

// GitHub에서 기존 파일의 SHA 가져오기
async function getExistingSha() {
  if (!github) return null;

  try {
    const fileInfo = await github.getFile('album/album_data.json');
    return fileInfo.sha;
  } catch (e) {
    // 파일이 없으면 null 반환
    console.log('No existing album_data.json found, will create new file');
    return null;
  }
}

// 고유한 파일명 생성 (타임스탬프 + 랜덤 문자열)
function generateUniqueFilename(ext) {
  const timestamp = Date.now();
  const random = Math.random().toString(36).substring(2, 8);
  return `${timestamp}_${random}.${ext}`;
}

// Base64 데이터에서 확장자 추출
function getExtFromBase64(base64Data) {
  if (base64Data.startsWith('data:image/png')) return 'png';
  if (base64Data.startsWith('data:image/gif')) return 'gif';
  if (base64Data.startsWith('data:image/webp')) return 'webp';
  return 'jpg';
}

// Save data to GitHub (일괄 커밋으로 한 번에 저장)
async function saveData() {
  // GitHub 설정 확인
  if (!initGitHub()) {
    alert('❌ GitHub 로그인이 필요합니다.\n관리자 페이지에서 먼저 로그인해주세요.');
    return;
  }

  try {
    // 저장 중 표시
    const saveBtn = document.getElementById('save-data');
    const originalText = saveBtn.textContent;
    saveBtn.textContent = '⏳ 저장 준비 중...';
    saveBtn.disabled = true;

    // 1. 변경 사항 수집
    const changes = [];
    let imageCount = 0;

    // 삭제된 앨범의 이미지 파일 제거
    // (현재 남아있는 imgPath와 중복되지 않는 경우만 삭제 — 이미지 교체 시 이전 경로가 deletedImgPaths에 남을 수 있음)
    const currentImgPaths = new Set(cells.map(c => c.imgPath).filter(Boolean));
    for (const imgPath of deletedImgPaths) {
      if (!currentImgPaths.has(imgPath)) {
        changes.push({ type: 'delete', path: imgPath });
      }
    }

    // 새로운/수정된 이미지 수집
    for (const cell of cells) {
      if (cell.img && cell.img.startsWith('data:')) {
        const ext = getExtFromBase64(cell.img);
        // 기존 경로가 있으면 재사용, 없으면 새 파일명 생성
        const path = cell.imgPath || `album/images/${generateUniqueFilename(ext)}`;

        changes.push({
          type: cell.imgPath ? 'update' : 'add',
          path: path,
          content: cell.img,
          binary: true
        });

        // imgPath 업데이트 (JSON에 저장될 값)
        cell.imgPath = path;
        imageCount++;
      }
    }

    // 2. JSON 데이터 준비 (img, isContentChanged, isNew 필드 제외)
    const dataForSave = {
      cells: cells.map(c => {
        const { img, isContentChanged, isNew, _snapshot, ...rest } = c;
        return rest;
      })
    };
    const jsonString = JSON.stringify(dataForSave, null, 2);

    changes.push({
      type: albumDataSha ? 'update' : 'add',
      path: 'album/album_data.json',
      content: jsonString,
      binary: false
    });

    // 3. changelog 항목 준비 (커밋 후 commitHash와 함께 별도 저장)
    let pendingChangelogEntry   = null;
    let pendingChangelogData    = null;
    let pendingChangelogFileSha = null;
    try {
      saveBtn.textContent = '⏳ changelog 준비 중...';
      const changelogFile = await github.getFile('changelog/changelog_data.json');
      const changelogData = JSON.parse(changelogFile.content);
      const today = new Date().toISOString().split('T')[0];

      // 변경 내역 상세 설명 빌드
      const lines = [];
      const linesJa = [];
      for (const d of deletedAlbums) {
        const label = [d.artist, d.album].filter(Boolean).join(' - ') || `ID ${d.id}`;
        lines.push(`삭제: ${label}`);
        linesJa.push(`削除: ${label}`);
      }
      for (const c of cells.filter(c => c.isNew && (c.artist || c.album))) {
        const label = [c.artist, c.album].filter(Boolean).join(' - ') || `ID ${c.id}`;
        lines.push(`추가: ${label}`);
        linesJa.push(`追加: ${label}`);
      }
      for (const c of cells.filter(c => c.isContentChanged && !c.isNew && (c.artist || c.album))) {
        const snap = c._snapshot || {};
        // 식별용 레이블은 수정 전 이름(스냅샷)을 우선 사용
        const labelArtist = snap.artist || c.artist || '';
        const labelAlbum  = snap.album  || c.album  || '';
        const label = [labelArtist, labelAlbum].filter(Boolean).join(' - ') || `ID ${c.id}`;
        const diffKo = [];
        const diffJa = [];
        // 이미지 변경 여부 (base64 로드된 경우)
        if (c.img && c.img.startsWith('data:')) {
          diffKo.push('이미지 변경');
          diffJa.push('画像変更');
        }
        // 필드별 before→after 비교
        for (const field of SNAPSHOT_FIELDS) {
          const oldVal = snap[field] !== undefined ? snap[field] : (field === 'rating' ? 0 : '');
          const newVal = c[field]    !== undefined ? c[field]    : (field === 'rating' ? 0 : '');
          if (String(oldVal) !== String(newVal)) {
            const oldDisp = fieldDisplayVal(field, oldVal);
            const newDisp = fieldDisplayVal(field, newVal);
            diffKo.push(`${FIELD_LABELS_KO[field]}: ${oldDisp}→${newDisp}`);
            diffJa.push(`${FIELD_LABELS_JA[field]}: ${oldDisp}→${newDisp}`);
          }
        }
        const diffStr   = diffKo.length > 0 ? ` (${diffKo.join(', ')})` : '';
        const diffStrJa = diffJa.length > 0 ? ` (${diffJa.join(', ')})` : '';
        lines.push(`수정: ${label}${diffStr}`);
        linesJa.push(`修正: ${label}${diffStrJa}`);
      }

      if (lines.length > 0) {
        const descKo = lines.join('\n');
        const descJa = linesJa.join('\n');
        const isDup = changelogData.entries.some(e =>
          e.date === today &&
          e.category === 'music' &&
          (typeof e.description === 'object' ? e.description.ko : e.description) === descKo
        );
        if (!isDup) {
          const entry = {
            id: Date.now(),
            date: today,
            category: 'music',
            description: { ko: descKo, ja: descJa }
            // commitHash는 커밋 후 추가됨
          };
          changelogData.entries.push(entry);
          changelogData.entries.sort((a, b) => {
            const dc = a.date.localeCompare(b.date);
            return dc !== 0 ? dc : a.id - b.id;
          });
          pendingChangelogEntry   = entry;
          pendingChangelogData    = changelogData;
          pendingChangelogFileSha = changelogFile.sha;
        }
      }
    } catch (e) {
      console.warn('changelog 기록 준비 실패 (무시됨):', e.message);
    }

    // 4. 일괄 커밋 실행 (changelog 제외 — 별도 커밋으로 분리)
    const commitMessage = imageCount > 0
      ? `앨범 데이터 업데이트 (이미지 ${imageCount}개 포함)`
      : '앨범 데이터 업데이트';

    const result = await github.createBatchCommit(
      changes,
      commitMessage,
      (status) => { saveBtn.textContent = `⏳ ${status}`; }
    );
    const commitSha = result?.commit?.sha || '';

    // 4b. changelog 별도 저장 (commitHash 포함)
    if (pendingChangelogEntry && pendingChangelogData) {
      try {
        saveBtn.textContent = '⏳ changelog 기록 중...';
        if (commitSha) pendingChangelogEntry.commitHash = commitSha;
        await github.saveFile(
          'changelog/changelog_data.json',
          JSON.stringify(pendingChangelogData, null, 2),
          '변경사항 데이터 업데이트',
          pendingChangelogFileSha
        );
      } catch (e) {
        console.warn('changelog 기록 실패 (무시됨):', e.message);
      }
    }

    // SHA 및 삭제 목록 초기화 (다음 저장을 위해)
    albumDataSha = null;
    deletedImgPaths = [];
    deletedAlbums = [];
    cells.forEach(c => { delete c.isContentChanged; delete c.isNew; c._snapshot = snapshotCell(c); });

    saveBtn.textContent = originalText;
    saveBtn.disabled = false;

    const msg = imageCount > 0
      ? `✅ 데이터가 GitHub에 저장되었습니다.\n(${changes.length}개 파일, 이미지 ${imageCount}개 포함)\n단일 커밋으로 처리되어 빌드가 1회만 실행됩니다.`
      : '✅ 데이터가 GitHub에 저장되었습니다.\nGitHub Actions에서 자동으로 빌드가 시작됩니다.';
    alert(msg);

  } catch (e) {
    console.error('Save failed:', e);

    const saveBtn = document.getElementById('save-data');
    saveBtn.textContent = '💾 데이터 저장';
    saveBtn.disabled = false;

    // SHA 불일치 에러인 경우 SHA 갱신 후 재시도 안내
    if (e.message.includes('sha') || e.message.includes('409') || e.message.includes('reference')) {
      albumDataSha = null; // SHA 초기화
      alert('❌ 저장에 실패했습니다.\n파일이 외부에서 수정되었을 수 있습니다.\n다시 시도해주세요.');
    } else {
      alert('❌ 저장에 실패했습니다.\n' + e.message);
    }
  }
}

// Initialize
loadData().then(() => {
  renderList();
});

function renderList() {
  const tbody = document.querySelector('#list-table tbody');
  tbody.innerHTML = '';

  const visible = cells.filter(c => c.id !== 0 && categoryFilters.has(c.category));
  const sorted = sortCells(visible, currentSort.key, currentSort.asc);

  // 정렬 인디케이터 업데이트
  document.querySelectorAll('#list-table th.sortable').forEach(th => {
    th.classList.remove('sort-asc', 'sort-desc');
    if (th.dataset.sort === currentSort.key) {
      th.classList.add(currentSort.asc ? 'sort-asc' : 'sort-desc');
    }
  });

  sorted.forEach(cell => {
    const index = cells.indexOf(cell);

    // 이미지 소스 결정: Base64가 있으면 사용, 없으면 imgPath 사용
    // admin 폴더에서 상위 폴더의 album/images를 참조
    const imgSrc = cell.img || (cell.imgPath ? `../${cell.imgPath}` : '');

    const tr = document.createElement('tr');
    tr.dataset.index = index;
    tr.innerHTML = `
      <td class="id-cell"><input type="number" class="id-input" min="1" max="200" value="${cell.id}"></td>
      <td>
        <label style="display:block">
          <input type="file" accept="image/*" style="display:none">
          ${imgSrc ? `<img src="${imgSrc}" class="preview">` : '<span class="no-image">이미지 없음</span>'}
        </label>
      </td>
      <td><input type="text" placeholder="아티스트" value="${cell.artist || ''}"></td>
      <td><input type="text" placeholder="앨범명" value="${cell.album || ''}"></td>
      <td><input type="text" placeholder="발매일" value="${cell.release || ''}"></td>
      <td>
        <select>
          <option value="CD" ${cell.category === 'CD' ? 'selected' : ''}>CD</option>
          <option value="ALBUM" ${cell.category === 'ALBUM' ? 'selected' : ''}>ALBUM</option>
          <option value="EP" ${cell.category === 'EP' ? 'selected' : ''}>EP</option>
          <option value="SINGLE" ${cell.category === 'SINGLE' ? 'selected' : ''}>SINGLE</option>
        </select>
      </td>
      <td>
        <select>
          <option value="0" ${!cell.rating ? 'selected' : ''}>-</option>
          <option value="1" ${cell.rating === 1 ? 'selected' : ''}>1</option>
          <option value="2" ${cell.rating === 2 ? 'selected' : ''}>2</option>
          <option value="3" ${cell.rating === 3 ? 'selected' : ''}>3</option>
          <option value="4" ${cell.rating === 4 ? 'selected' : ''}>4</option>
          <option value="5" ${cell.rating === 5 ? 'selected' : ''}>5</option>
        </select>
      </td>
      <td><input type="text" placeholder="재생 시간" value="${cell.duration || ''}"></td>
      <td class="extra-col"><input type="text" placeholder="제외 트랙" value="${cell.excludedTracks || ''}"></td>
      <td><input type="text" placeholder="최애 트랙" value="${cell.favTrack || ''}"></td>
      <td class="extra-col"><input type="url" placeholder="Spotify" value="${cell.spotifyLink || ''}"></td>
      <td>
        <button onclick="insertRow(${index})" title="행 추가">+</button>
        <button onclick="deleteRow(${index})" title="행 삭제">−</button>
      </td>
    `;
    tbody.appendChild(tr);

    const idInput = tr.querySelector('.id-input');
    const fileInput = tr.querySelector('input[type="file"]');
    const artistInput = tr.querySelector('input[type="text"][placeholder="아티스트"]');
    const albumInput = tr.querySelector('input[type="text"][placeholder="앨범명"]');
    const releaseInput = tr.querySelector('input[type="text"][placeholder="발매일"]');
    const categorySelect = tr.querySelector('select');
    const ratingSelect = tr.querySelectorAll('select')[1];
    const durationInput = tr.querySelector('input[type="text"][placeholder="재생 시간"]');
    const excludedTracksInput = tr.querySelector('input[type="text"][placeholder="제외 트랙"]');
    const favTrackInput = tr.querySelector('input[type="text"][placeholder="최애 트랙"]');
    const spotifyLinkInput = tr.querySelector('input[type="url"][placeholder="Spotify"]');

    idInput.addEventListener('change', e => {
      const newId = parseInt(e.target.value);
      if (isNaN(newId) || newId < 1 || newId > 200 || newId === cell.id) {
        e.target.value = cell.id; // 유효하지 않으면 원래 값으로 복원
        return;
      }
      changeId(cell, newId);
      renderList();
    });

    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => {
          cell.img = reader.result;
          cell.updatedAt = Date.now();
          cell.isContentChanged = true;
          renderList();
        };
        reader.readAsDataURL(file);
      }
    });

    // 셀 필드가 변경될 때마다 updatedAt 및 isContentChanged 갱신
    function markUpdated() {
      cell.updatedAt = Date.now();
      cell.isContentChanged = true;
    }

    artistInput.addEventListener('input', e => {
      cell.artist = e.target.value;
      markUpdated();
    });

    albumInput.addEventListener('input', e => {
      cell.album = e.target.value;
      markUpdated();
    });

    releaseInput.addEventListener('input', e => {
      cell.release = e.target.value;
      markUpdated();
    });

    categorySelect.addEventListener('change', e => {
      cell.category = e.target.value;
      markUpdated();
    });

    ratingSelect.addEventListener('change', e => {
      cell.rating = parseInt(e.target.value);
      markUpdated();
    });

    durationInput.addEventListener('input', e => {
      cell.duration = e.target.value;
      markUpdated();
    });

    excludedTracksInput.addEventListener('input', e => {
      cell.excludedTracks = e.target.value;
      markUpdated();
    });

    favTrackInput.addEventListener('input', e => {
      cell.favTrack = e.target.value;
      markUpdated();
    });

    spotifyLinkInput.addEventListener('input', e => {
      cell.spotifyLink = e.target.value;
      markUpdated();
    });
  });
}

function changeId(cell, newId) {
  const oldId = cell.id;
  if (newId < oldId) {
    // 예: 9→7: ID 7,8이 각각 8,9로 밀림
    cells.forEach(c => {
      if (c !== cell && c.id >= newId && c.id < oldId) {
        c.id++;
        c.updatedAt = Date.now();
      }
    });
  } else {
    // 예: 7→9: ID 8,9가 각각 7,8로 당겨짐
    cells.forEach(c => {
      if (c !== cell && c.id > oldId && c.id <= newId) {
        c.id--;
        c.updatedAt = Date.now();
      }
    });
  }
  cell.id = newId;
  cell.updatedAt = Date.now();
}

function insertRow(index) {
  const targetId = cells[index].id;
  for (let i = 0; i < cells.length; i++) {
    if (cells[i].id > targetId) cells[i].id++;
  }
  const newCell = { id: targetId + 1, img: '', imgPath: '', artist: '', album: '', release: '', category: 'ALBUM', rating: 0, duration: '', excludedTracks: '', favTrack: '', spotifyLink: '', updatedAt: Date.now(), isNew: true };
  cells.splice(index + 1, 0, newCell);
  renderList();
}

function deleteRow(index) {
  if (cells.length > 1) {
    const cell = cells[index];
    const label = cell.artist && cell.album ? `${cell.artist} - ${cell.album}` : `ID ${cell.id}`;
    if (!confirm(`정말로 삭제하시겠습니까?\n\n${label}`)) return;
    // 이미지 파일이 있으면 삭제 목록에 추가 (저장 시 GitHub에서 삭제)
    if (cell.imgPath) {
      deletedImgPaths.push(cell.imgPath);
    }
    // changelog 기록용: 삭제된 앨범 정보 보존
    deletedAlbums.push({ id: cell.id, artist: cell.artist || '', album: cell.album || '' });
    const removedId = cell.id;
    cells.splice(index, 1);
    cells.forEach(c => {
      if (c.id > removedId) c.id--;
    });
    renderList();
  }
}

// 테이블 헤더 정렬 클릭
document.querySelectorAll('#list-table th.sortable').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    if (currentSort.key === key) {
      currentSort.asc = !currentSort.asc;
    } else {
      currentSort.key = key;
      currentSort.asc = key === 'rating' ? false : true;
    }
    renderList();
  });
});

// 카테고리 필터
const filterBtn = document.getElementById('btn-filter');
const filterPopup = document.getElementById('filter-popup');

filterBtn.addEventListener('click', () => {
  filterPopup.classList.toggle('active');
});

document.addEventListener('click', e => {
  if (!filterBtn.contains(e.target) && !filterPopup.contains(e.target)) {
    filterPopup.classList.remove('active');
  }
});

filterPopup.querySelectorAll('input[type="checkbox"]').forEach(cb => {
  cb.addEventListener('change', () => {
    if (cb.checked) {
      categoryFilters.add(cb.value);
    } else {
      categoryFilters.delete(cb.value);
    }
    // 필터 활성 표시
    filterBtn.classList.toggle('filter-active', categoryFilters.size < 4);
    renderList();
  });
});

// 기타 정보 토글
const toggleExtraBtn = document.getElementById('toggle-extra');
const listTable = document.getElementById('list-table');
let extraVisible = true;

toggleExtraBtn.addEventListener('click', () => {
  extraVisible = !extraVisible;
  listTable.classList.toggle('hide-extra', !extraVisible);

});

// 이미지 소스 결정 헬퍼
// admin 폴더에서 상위 폴더의 album/images를 참조
function getImgSrc(cellData) {
  if (!cellData) return '';
  if (cellData.img) return cellData.img;
  if (cellData.imgPath) return '../' + cellData.imgPath;
  return '';
}

// PNG Export
document.getElementById('save-png').addEventListener('click', async () => {
  // Create temporary grid for export
  const tempGrid = document.createElement('div');
  tempGrid.style.display = 'grid';
  tempGrid.style.gridTemplateColumns = 'repeat(15, 50px)';
  tempGrid.style.gridTemplateRows = 'repeat(15, 50px)';
  tempGrid.style.position = 'fixed';
  tempGrid.style.left = '-9999px';
  document.body.appendChild(tempGrid);

  let id = 1;
  const gridSize = 15;
  const centerStart = 6;
  const centerEnd = 10;

  for (let r = 1; r <= gridSize; r++) {
    for (let c = 1; c <= gridSize; c++) {
      if (r >= centerStart && r <= centerEnd && c >= centerStart && c <= centerEnd) {
        if (r === centerStart && c === centerStart) {
          const cell = document.createElement('div');
          cell.style.width = '250px';
          cell.style.height = '250px';
          cell.style.gridColumn = `${centerStart} / span 5`;
          cell.style.gridRow = `${centerStart} / span 5`;
          cell.style.overflow = 'hidden';
          cell.style.background = '#e9ecef';

          const cellData = cells.find(c => c.id === 0);
          const imgSrc = getImgSrc(cellData);
          if (imgSrc) {
            const img = document.createElement('img');
            img.src = imgSrc;
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = 'cover';
            cell.appendChild(img);
          }
          tempGrid.appendChild(cell);
        }
      } else {
        const cell = document.createElement('div');
        cell.style.width = '50px';
        cell.style.height = '50px';
        cell.style.overflow = 'hidden';
        cell.style.background = '#e9ecef';

        const cellData = cells.find(c => c.id === id);
        const imgSrc = getImgSrc(cellData);
        if (imgSrc) {
          const img = document.createElement('img');
          img.src = imgSrc;
          img.style.width = '100%';
          img.style.height = '100%';
          img.style.objectFit = 'cover';
          cell.appendChild(img);
        }
        tempGrid.appendChild(cell);
        id++;
      }
    }
  }

  try {
    const canvas = await html2canvas(tempGrid, {
      scale: 4000 / 750,
      useCORS: true,
      backgroundColor: '#ffffff'
    });

    const link = document.createElement('a');
    link.download = 'album.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch (error) {
    console.error('Failed to export PNG:', error);
    alert('PNG 저장에 실패했습니다.');
  } finally {
    document.body.removeChild(tempGrid);
  }
});
