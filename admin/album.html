<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<title>앨범 관리</title>
<link rel="icon" type="image/x-icon" href="../static/images/favicon.ico">
<link rel="stylesheet" href="../static/css/style.css">
<link rel="stylesheet" href="../static/css/admin-album.css">
<script src="../static/js/theme.js"></script>
</head>
<body class="album-admin-page">

<!-- Header -->
<header class="site-header">
  <div class="container">
    <nav class="nav">
      <a href="../index.html" class="logo">iwna5724</a>
      <div class="nav-links">
        <a href="../lists.html" data-i18n="nav.lists">글 목록</a>
        <a href="../music.html">음악</a>
        <button id="lang-toggle" class="lang-toggle" aria-label="언어 전환">
          <img src="../static/images/flags/KOREA.svg" alt="한국어">
        </button>
        <button id="theme-toggle" class="theme-toggle" aria-label="테마 전환">🌙</button>
        <a href="login.html" class="admin-link" title="관리자 로그인">⚙️</a>
      </div>
    </nav>
  </div>
</header>

<!-- Main Content -->
<main class="main-content">
  <h1 class="page-title">앨범 관리 시스템</h1>

  <div class="main-container">
    <div class="controls">
      <button id="save-png">📷 앨범 PNG 저장</button>
      <button id="save-data">💾 데이터 저장</button>
    </div>

    <h2>데이터 리스트</h2>

    <div class="table-wrapper">
      <table id="list-table">
        <thead>
          <tr>
            <th style="width: 50px;">ID</th>
            <th style="width: 80px;">이미지</th>
            <th>아티스트</th>
            <th>앨범명</th>
            <th>발매일</th>
            <th>구분</th>
            <th>선호도</th>
            <th style="width: 90px;">재생 시간</th>
            <th style="width: 70px;">제외 트랙</th>
            <th>최애 트랙</th>
            <th>Spotify</th>
            <th>YT Music</th>
            <th style="width: 100px;">조작</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
// ================================
// Data Management
// ================================
let cells = [];

// Load data from JSON file
async function loadData() {
  try {
    const response = await fetch('../album/album_data.json');
    const data = await response.json();
    cells = data.cells || [];
  } catch (e) {
    console.log('No existing data file, starting fresh');
    cells = [];
  }

  // 기존 link → spotifyLink 마이그레이션
  cells.forEach(c => {
    if (c.link && !c.spotifyLink) {
      c.spotifyLink = c.link;
    }
    if (c.spotifyLink === undefined) c.spotifyLink = '';
    if (c.ytMusicLink === undefined) c.ytMusicLink = '';
    delete c.link;
  });

  // Ensure we have at least 201 cells (0-200)
  while (cells.length < 201) {
    cells.push({
      id: cells.length,
      img: '',
      artist: '',
      album: '',
      release: '',
      category: '앨범',
      rating: 0,
      duration: '',
      excludedTracks: '',
      favTrack: '',
      spotifyLink: '',
      ytMusicLink: ''
    });
  }
}

// Save data to JSON file
async function saveData() {
  const data = { cells: cells };
  const jsonString = JSON.stringify(data, null, 2);

  try {
    // Create a blob and download
    const blob = new Blob([jsonString], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'album_data.json';
    a.click();
    URL.revokeObjectURL(url);

    alert('✅ 데이터가 저장되었습니다. album_data.json 파일을 album 폴더에 저장해주세요.');
  } catch (e) {
    console.error('Save failed:', e);
    alert('❌ 저장에 실패했습니다.');
  }
}

// Initialize
loadData().then(() => {
  renderList();
});

function renderList() {
  const tbody = document.querySelector('#list-table tbody');
  tbody.innerHTML = '';

  cells.sort((a,b) => a.id - b.id);

  cells.forEach((cell, index) => {
    if (cell.id === 0) return;

    const tr = document.createElement('tr');
    tr.dataset.index = index;
    tr.innerHTML = `
      <td class="id-cell">${cell.id}</td>
      <td>
        <label style="display:block">
          <input type="file" accept="image/*" style="display:none">
          ${cell.img ? `<img src="${cell.img}" class="preview">` : '<span class="no-image">이미지 없음</span>'}
        </label>
      </td>
      <td><input type="text" placeholder="아티스트" value="${cell.artist || ''}"></td>
      <td><input type="text" placeholder="앨범명" value="${cell.album || ''}"></td>
      <td><input type="text" placeholder="발매일" value="${cell.release || ''}"></td>
      <td>
        <select>
          <option value="CD" ${cell.category === 'CD' ? 'selected' : ''}>CD</option>
          <option value="앨범" ${cell.category === '앨범' ? 'selected' : ''}>앨범</option>
          <option value="EP" ${cell.category === 'EP' ? 'selected' : ''}>EP</option>
          <option value="싱글" ${cell.category === '싱글' ? 'selected' : ''}>싱글</option>
        </select>
      </td>
      <td>
        <select>
          <option value="0" ${!cell.rating ? 'selected' : ''}>-</option>
          <option value="1" ${cell.rating === 1 ? 'selected' : ''}>1</option>
          <option value="2" ${cell.rating === 2 ? 'selected' : ''}>2</option>
          <option value="3" ${cell.rating === 3 ? 'selected' : ''}>3</option>
          <option value="4" ${cell.rating === 4 ? 'selected' : ''}>4</option>
          <option value="5" ${cell.rating === 5 ? 'selected' : ''}>5</option>
        </select>
      </td>
      <td><input type="text" placeholder="재생 시간" value="${cell.duration || ''}"></td>
      <td><input type="text" placeholder="제외 트랙" value="${cell.excludedTracks || ''}"></td>
      <td><input type="text" placeholder="최애 트랙" value="${cell.favTrack || ''}"></td>
      <td><input type="url" placeholder="Spotify" value="${cell.spotifyLink || ''}"></td>
      <td><input type="url" placeholder="YT Music" value="${cell.ytMusicLink || ''}"></td>
      <td>
        <button onclick="insertRow(${index})" title="행 추가">+</button>
        <button onclick="deleteRow(${index})" title="행 삭제">−</button>
      </td>
    `;
    tbody.appendChild(tr);

    const fileInput = tr.querySelector('input[type="file"]');
    const artistInput = tr.querySelector('input[type="text"][placeholder="아티스트"]');
    const albumInput = tr.querySelector('input[type="text"][placeholder="앨범명"]');
    const releaseInput = tr.querySelector('input[type="text"][placeholder="발매일"]');
    const categorySelect = tr.querySelector('select');
    const ratingSelect = tr.querySelectorAll('select')[1];
    const durationInput = tr.querySelector('input[type="text"][placeholder="재생 시간"]');
    const excludedTracksInput = tr.querySelector('input[type="text"][placeholder="제외 트랙"]');
    const favTrackInput = tr.querySelector('input[type="text"][placeholder="최애 트랙"]');
    const spotifyLinkInput = tr.querySelector('input[type="url"][placeholder="Spotify"]');
    const ytMusicLinkInput = tr.querySelector('input[type="url"][placeholder="YT Music"]');

    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => {
          cell.img = reader.result;
          renderList();
        };
        reader.readAsDataURL(file);
      }
    });

    artistInput.addEventListener('input', e => {
      cell.artist = e.target.value;
    });

    albumInput.addEventListener('input', e => {
      cell.album = e.target.value;
    });

    releaseInput.addEventListener('input', e => {
      cell.release = e.target.value;
    });

    categorySelect.addEventListener('change', e => {
      cell.category = e.target.value;
    });

    ratingSelect.addEventListener('change', e => {
      cell.rating = parseInt(e.target.value);
    });

    durationInput.addEventListener('input', e => {
      cell.duration = e.target.value;
    });

    excludedTracksInput.addEventListener('input', e => {
      cell.excludedTracks = e.target.value;
    });

    favTrackInput.addEventListener('input', e => {
      cell.favTrack = e.target.value;
    });

    spotifyLinkInput.addEventListener('input', e => {
      cell.spotifyLink = e.target.value;
    });

    ytMusicLinkInput.addEventListener('input', e => {
      cell.ytMusicLink = e.target.value;
    });
  });
}

function insertRow(index) {
  const targetId = cells[index].id;
  for (let i = 0; i < cells.length; i++) {
    if (cells[i].id > targetId) cells[i].id++;
  }
  const newCell = { id: targetId + 1, img: '', artist: '', album: '', release: '', category: '앨범', rating: 0, duration: '', excludedTracks: '', favTrack: '', spotifyLink: '', ytMusicLink: '' };
  cells.splice(index + 1, 0, newCell);
  renderList();
}

function deleteRow(index) {
  if (cells.length > 1) {
    const removedId = cells[index].id;
    cells.splice(index, 1);
    cells.forEach(c => {
      if (c.id > removedId) c.id--;
    });
    renderList();
  }
}

// PNG Export
document.getElementById('save-png').addEventListener('click', async () => {
  // Create temporary grid for export
  const tempGrid = document.createElement('div');
  tempGrid.style.display = 'grid';
  tempGrid.style.gridTemplateColumns = 'repeat(15, 50px)';
  tempGrid.style.gridTemplateRows = 'repeat(15, 50px)';
  tempGrid.style.position = 'fixed';
  tempGrid.style.left = '-9999px';
  document.body.appendChild(tempGrid);

  let id = 1;
  const gridSize = 15;
  const centerStart = 6;
  const centerEnd = 10;

  for (let r = 1; r <= gridSize; r++) {
    for (let c = 1; c <= gridSize; c++) {
      if (r >= centerStart && r <= centerEnd && c >= centerStart && c <= centerEnd) {
        if (r === centerStart && c === centerStart) {
          const cell = document.createElement('div');
          cell.style.width = '250px';
          cell.style.height = '250px';
          cell.style.gridColumn = `${centerStart} / span 5`;
          cell.style.gridRow = `${centerStart} / span 5`;
          cell.style.overflow = 'hidden';
          cell.style.background = '#e9ecef';

          const cellData = cells.find(c => c.id === 0);
          if (cellData && cellData.img) {
            const img = document.createElement('img');
            img.src = cellData.img;
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = 'cover';
            cell.appendChild(img);
          }
          tempGrid.appendChild(cell);
        }
      } else {
        const cell = document.createElement('div');
        cell.style.width = '50px';
        cell.style.height = '50px';
        cell.style.overflow = 'hidden';
        cell.style.background = '#e9ecef';

        const cellData = cells.find(c => c.id === id);
        if (cellData && cellData.img) {
          const img = document.createElement('img');
          img.src = cellData.img;
          img.style.width = '100%';
          img.style.height = '100%';
          img.style.objectFit = 'cover';
          cell.appendChild(img);
        }
        tempGrid.appendChild(cell);
        id++;
      }
    }
  }

  try {
    const canvas = await html2canvas(tempGrid, {
      scale: 4000 / 750,
      useCORS: true,
      backgroundColor: '#ffffff'
    });

    const link = document.createElement('a');
    link.download = 'album.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch (error) {
    console.error('Failed to export PNG:', error);
    alert('PNG 저장에 실패했습니다.');
  } finally {
    document.body.removeChild(tempGrid);
  }
});

// Save button
document.getElementById('save-data').addEventListener('click', saveData);
</script>
<script src="../static/js/language.js"></script>

</body>
</html>
