<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<title>앨범 관리 - Album Manager</title>
<link rel="icon" type="image/x-icon" href="../static/images/favicon.ico">
<script src="../static/js/theme.js"></script>
<style>
/* ================================
   CSS Variables (Light/Dark Mode)
   ================================ */
:root {
  /* Colors - Light Mode */
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --text-tertiary: #adb5bd;
  --accent-primary: #667eea;
  --accent-secondary: #764ba2;
  --border-color: #dee2e6;
  --shadow: rgba(0, 0, 0, 0.1);

  /* Spacing */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --spacing-2xl: 48px;

  /* Typography */
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-size-sm: 14px;
  --font-size-base: 16px;
  --font-size-lg: 18px;
  --font-size-xl: 24px;
  --font-size-2xl: 32px;

  /* Border Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;

  /* Transitions */
  --transition: all 0.2s ease;
}

/* Dark Mode */
html.dark {
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #3a3a3a;
  --text-primary: #e9ecef;
  --text-secondary: #adb5bd;
  --text-tertiary: #6c757d;
  --border-color: #3a3a3a;
  --shadow: rgba(0, 0, 0, 0.3);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: var(--font-sans);
  font-size: var(--font-size-base);
  line-height: 1.7;
  color: var(--text-primary);
  background-color: var(--bg-primary);
  min-height: 100vh;
}

/* ================================
   Header & Navigation
   ================================ */
.site-header {
  background: var(--bg-primary);
  border-bottom: 1px solid var(--border-color);
  padding: var(--spacing-lg) 0;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
  background: rgba(255, 255, 255, 0.95);
}

html.dark .site-header {
  background: rgba(26, 26, 26, 0.95);
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 var(--spacing-lg);
}

.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: var(--font-size-2xl);
  font-weight: 700;
  color: var(--text-primary);
  text-decoration: none;
  transition: var(--transition);
}

.logo:hover {
  color: var(--accent-primary);
}

.nav-links {
  display: flex;
  gap: var(--spacing-lg);
  align-items: center;
}

.nav-links a {
  color: var(--text-secondary);
  text-decoration: none;
  font-weight: 500;
  transition: var(--transition);
}

.nav-links a:hover {
  color: var(--accent-primary);
}

.theme-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  background: var(--bg-secondary);
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-size: 18px;
  transition: var(--transition);
}

.theme-toggle:hover {
  background: var(--bg-tertiary);
  transform: scale(1.1);
}

.lang-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  background: var(--bg-secondary);
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-size: 18px;
  transition: var(--transition);
}

.lang-toggle:hover {
  background: var(--bg-tertiary);
  transform: scale(1.1);
}

.lang-toggle img {
  width: 20px;
  height: 20px;
  display: block;
}

/* ================================
   Main Content
   ================================ */
.main-content {
  max-width: 1400px;
  margin: var(--spacing-2xl) auto;
  padding: 0 var(--spacing-lg);
}

.page-title {
  text-align: center;
  font-size: var(--font-size-2xl);
  font-weight: 700;
  margin-bottom: var(--spacing-xl);
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.main-container {
  background: var(--bg-secondary);
  border-radius: var(--radius-lg);
  padding: 30px;
  box-shadow: 0 8px 24px var(--shadow);
  border: 1px solid var(--border-color);
}

h2 {
  color: var(--text-primary);
  margin-bottom: 15px;
  font-size: 20px;
  font-weight: 700;
  text-align: center;
  position: relative;
  padding-bottom: 10px;
}

h2::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 50px;
  height: 3px;
  background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
  border-radius: 2px;
}

/* ================================
   Controls
   ================================ */
.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.controls button {
  background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: var(--radius-md);
  font-family: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition);
  font-size: 13px;
  box-shadow: 0 2px 4px var(--shadow);
}

.controls button:hover {
  background: linear-gradient(135deg, var(--accent-secondary) 0%, var(--accent-primary) 100%);
  transform: translateY(-2px);
  box-shadow: 0 4px 8px var(--shadow);
}

.controls input[type="file"] {
  display: none;
}

.file-label {
  padding: 10px 20px;
  background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
  color: white;
  border-radius: var(--radius-md);
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition);
  font-size: 13px;
  box-shadow: 0 2px 4px var(--shadow);
  display: inline-block;
  text-align: center;
}

.file-label:hover {
  background: linear-gradient(135deg, var(--accent-secondary) 0%, var(--accent-primary) 100%);
  transform: translateY(-2px);
  box-shadow: 0 4px 8px var(--shadow);
}

/* ================================
   Table
   ================================ */
.table-wrapper {
  overflow-y: auto;
  max-height: 70vh;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  margin-bottom: 20px;
}

table {
  border-collapse: collapse;
  width: 100%;
  background: var(--bg-primary);
}

thead {
  position: sticky;
  top: 0;
  z-index: 10;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

th {
  color: white;
  padding: 12px 8px;
  text-align: center;
  font-weight: 700;
  font-size: 13px;
  border: none;
}

td {
  border: 1px solid var(--border-color);
  padding: 8px;
  text-align: center;
  vertical-align: middle;
  background: var(--bg-primary);
}

tbody tr:hover {
  background: var(--bg-secondary);
}

img.preview {
  width: 50px;
  height: 50px;
  object-fit: cover;
  border-radius: var(--radius-md);
  border: 2px solid var(--border-color);
  cursor: pointer;
  transition: var(--transition);
}

img.preview:hover {
  border-color: var(--accent-primary);
  transform: scale(1.05);
}

input[type="text"],
input[type="url"] {
  width: 100%;
  padding: 6px 10px;
  font-family: inherit;
  border: 2px solid var(--border-color);
  border-radius: var(--radius-sm);
  font-size: 13px;
  transition: border-color 0.2s ease;
  background: var(--bg-primary);
  color: var(--text-primary);
}

input[type="text"]:focus,
input[type="url"]:focus {
  outline: none;
  border-color: var(--accent-primary);
}

select {
  width: 100%;
  padding: 6px 10px;
  font-family: inherit;
  border: 2px solid var(--border-color);
  border-radius: var(--radius-sm);
  font-size: 13px;
  transition: border-color 0.2s ease;
  background: var(--bg-primary);
  color: var(--text-primary);
  cursor: pointer;
}

select:focus {
  outline: none;
  border-color: var(--accent-primary);
}

td button {
  padding: 6px 12px;
  font-size: 16px;
  font-weight: 700;
  margin: 0 2px;
  width: 36px;
  height: 36px;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: var(--transition);
  box-shadow: 0 2px 4px var(--shadow);
}

td button:first-child {
  background: #4caf50;
  color: white;
}

td button:first-child:hover {
  background: #45a049;
  transform: translateY(-2px);
}

td button:last-child {
  background: #f44336;
  color: white;
}

td button:last-child:hover {
  background: #da190b;
  transform: translateY(-2px);
}

.no-image {
  color: var(--text-tertiary);
  font-size: 12px;
  padding: 8px;
  display: inline-block;
}

label {
  cursor: pointer;
  display: block;
}

.id-cell {
  font-weight: 700;
  color: var(--accent-primary);
  font-size: 14px;
}

/* ================================
   Responsive Design
   ================================ */
@media (max-width: 768px) {
  :root {
    --font-size-2xl: 24px;
    --font-size-xl: 20px;
    --spacing-2xl: 24px;
  }

  .site-header {
    padding: var(--spacing-md) 0;
  }

  .nav {
    flex-direction: column;
    gap: var(--spacing-md);
  }

  .logo {
    font-size: var(--font-size-xl);
  }

  .nav-links {
    width: 100%;
    justify-content: center;
  }

  .main-content {
    margin: var(--spacing-lg) auto;
    padding: 0 var(--spacing-md);
  }

  .page-title {
    font-size: var(--font-size-xl);
    margin-bottom: var(--spacing-lg);
  }

  .main-container {
    padding: var(--spacing-lg);
  }

  h2 {
    font-size: 18px;
  }

  .controls {
    flex-direction: column;
  }

  .controls button,
  .file-label {
    width: 100%;
  }

  .table-wrapper {
    max-height: 60vh;
  }

  table {
    font-size: 12px;
  }

  th, td {
    padding: 6px 4px;
  }

  th {
    font-size: 11px;
  }

  img.preview {
    width: 40px;
    height: 40px;
  }

  input[type="text"],
  input[type="url"],
  select {
    font-size: 12px;
    padding: 4px 6px;
  }

  td button {
    width: 28px;
    height: 28px;
    font-size: 14px;
    padding: 4px 8px;
  }
}
</style>
</head>
<body>

<!-- Header -->
<header class="site-header">
  <div class="container">
    <nav class="nav">
      <a href="../index.html" class="logo">iwna5724</a>
      <div class="nav-links">
        <a href="../lists.html" data-i18n="nav.lists">글 목록</a>
        <a href="../music.html">음악</a>
        <button id="lang-toggle" class="lang-toggle" aria-label="언어 전환">
          <img src="../static/images/flags/KOREA.svg" alt="한국어">
        </button>
        <button id="theme-toggle" class="theme-toggle" aria-label="테마 전환">🌙</button>
        <a href="login.html" class="admin-link" title="관리자 로그인">⚙️</a>
      </div>
    </nav>
  </div>
</header>

<!-- Main Content -->
<main class="main-content">
  <h1 class="page-title">앨범 관리 시스템</h1>

  <div class="main-container">
    <div class="controls">
      <button id="save-png">📷 앨범 PNG 저장</button>
      <button id="save-data">💾 데이터 저장</button>
    </div>

    <h2>데이터 리스트</h2>

    <div class="table-wrapper">
      <table id="list-table">
        <thead>
          <tr>
            <th style="width: 50px;">ID</th>
            <th style="width: 80px;">이미지</th>
            <th>아티스트</th>
            <th>앨범명</th>
            <th>발매일</th>
            <th>구분</th>
            <th>선호도</th>
            <th>링크</th>
            <th style="width: 100px;">조작</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
// ================================
// Data Management
// ================================
let cells = [];

// Load data from JSON file
async function loadData() {
  try {
    const response = await fetch('../album/album_data.json');
    const data = await response.json();
    cells = data.cells || [];
  } catch (e) {
    console.log('No existing data file, starting fresh');
    cells = [];
  }

  // Ensure we have at least 201 cells (0-200)
  while (cells.length < 201) {
    cells.push({
      id: cells.length,
      img: '',
      artist: '',
      album: '',
      release: '',
      category: '앨범',
      rating: 3,
      link: ''
    });
  }
}

// Save data to JSON file
async function saveData() {
  const data = { cells: cells };
  const jsonString = JSON.stringify(data, null, 2);

  try {
    // Create a blob and download
    const blob = new Blob([jsonString], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'album_data.json';
    a.click();
    URL.revokeObjectURL(url);

    alert('✅ 데이터가 저장되었습니다. album_data.json 파일을 album 폴더에 저장해주세요.');
  } catch (e) {
    console.error('Save failed:', e);
    alert('❌ 저장에 실패했습니다.');
  }
}

// Initialize
loadData().then(() => {
  renderList();
});

function renderList() {
  const tbody = document.querySelector('#list-table tbody');
  tbody.innerHTML = '';

  cells.sort((a,b) => a.id - b.id);

  cells.forEach((cell, index) => {
    if (cell.id === 0) return;

    const tr = document.createElement('tr');
    tr.dataset.index = index;
    tr.innerHTML = `
      <td class="id-cell">${cell.id}</td>
      <td>
        <label style="display:block">
          <input type="file" accept="image/*" style="display:none">
          ${cell.img ? `<img src="${cell.img}" class="preview">` : '<span class="no-image">이미지 없음</span>'}
        </label>
      </td>
      <td><input type="text" placeholder="아티스트" value="${cell.artist || ''}"></td>
      <td><input type="text" placeholder="앨범명" value="${cell.album || ''}"></td>
      <td><input type="text" placeholder="발매일" value="${cell.release || ''}"></td>
      <td>
        <select>
          <option value="보유중인 CD" ${cell.category === '보유중인 CD' ? 'selected' : ''}>보유중인 CD</option>
          <option value="앨범" ${cell.category === '앨범' ? 'selected' : ''}>앨범</option>
          <option value="EP" ${cell.category === 'EP' ? 'selected' : ''}>EP</option>
          <option value="싱글" ${cell.category === '싱글' ? 'selected' : ''}>싱글</option>
        </select>
      </td>
      <td>
        <select>
          <option value="1" ${cell.rating === 1 ? 'selected' : ''}>1</option>
          <option value="2" ${cell.rating === 2 ? 'selected' : ''}>2</option>
          <option value="3" ${cell.rating === 3 ? 'selected' : ''}>3</option>
          <option value="4" ${cell.rating === 4 ? 'selected' : ''}>4</option>
          <option value="5" ${cell.rating === 5 ? 'selected' : ''}>5</option>
        </select>
      </td>
      <td><input type="url" placeholder="링크" value="${cell.link || ''}"></td>
      <td>
        <button onclick="insertRow(${index})" title="행 추가">+</button>
        <button onclick="deleteRow(${index})" title="행 삭제">−</button>
      </td>
    `;
    tbody.appendChild(tr);

    const fileInput = tr.querySelector('input[type="file"]');
    const artistInput = tr.querySelector('input[type="text"][placeholder="아티스트"]');
    const albumInput = tr.querySelector('input[type="text"][placeholder="앨범명"]');
    const releaseInput = tr.querySelector('input[type="text"][placeholder="발매일"]');
    const categorySelect = tr.querySelector('select');
    const ratingSelect = tr.querySelectorAll('select')[1];
    const linkInput = tr.querySelector('input[type="url"]');

    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => {
          cell.img = reader.result;
          renderList();
        };
        reader.readAsDataURL(file);
      }
    });

    artistInput.addEventListener('input', e => {
      cell.artist = e.target.value;
    });

    albumInput.addEventListener('input', e => {
      cell.album = e.target.value;
    });

    releaseInput.addEventListener('input', e => {
      cell.release = e.target.value;
    });

    categorySelect.addEventListener('change', e => {
      cell.category = e.target.value;
    });

    ratingSelect.addEventListener('change', e => {
      cell.rating = parseInt(e.target.value);
    });

    linkInput.addEventListener('input', e => {
      cell.link = e.target.value;
    });
  });
}

function insertRow(index) {
  const targetId = cells[index].id;
  for (let i = 0; i < cells.length; i++) {
    if (cells[i].id > targetId) cells[i].id++;
  }
  const newCell = { id: targetId + 1, img: '', artist: '', album: '', release: '', category: '앨범', rating: 3, link: '' };
  cells.splice(index + 1, 0, newCell);
  renderList();
}

function deleteRow(index) {
  if (cells.length > 1) {
    const removedId = cells[index].id;
    cells.splice(index, 1);
    cells.forEach(c => {
      if (c.id > removedId) c.id--;
    });
    renderList();
  }
}

// PNG Export
document.getElementById('save-png').addEventListener('click', async () => {
  // Create temporary grid for export
  const tempGrid = document.createElement('div');
  tempGrid.style.display = 'grid';
  tempGrid.style.gridTemplateColumns = 'repeat(15, 50px)';
  tempGrid.style.gridTemplateRows = 'repeat(15, 50px)';
  tempGrid.style.position = 'fixed';
  tempGrid.style.left = '-9999px';
  document.body.appendChild(tempGrid);

  let id = 1;
  const gridSize = 15;
  const centerStart = 6;
  const centerEnd = 10;

  for (let r = 1; r <= gridSize; r++) {
    for (let c = 1; c <= gridSize; c++) {
      if (r >= centerStart && r <= centerEnd && c >= centerStart && c <= centerEnd) {
        if (r === centerStart && c === centerStart) {
          const cell = document.createElement('div');
          cell.style.width = '250px';
          cell.style.height = '250px';
          cell.style.gridColumn = `${centerStart} / span 5`;
          cell.style.gridRow = `${centerStart} / span 5`;
          cell.style.overflow = 'hidden';
          cell.style.background = '#e9ecef';

          const cellData = cells.find(c => c.id === 0);
          if (cellData && cellData.img) {
            const img = document.createElement('img');
            img.src = cellData.img;
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = 'cover';
            cell.appendChild(img);
          }
          tempGrid.appendChild(cell);
        }
      } else {
        const cell = document.createElement('div');
        cell.style.width = '50px';
        cell.style.height = '50px';
        cell.style.overflow = 'hidden';
        cell.style.background = '#e9ecef';

        const cellData = cells.find(c => c.id === id);
        if (cellData && cellData.img) {
          const img = document.createElement('img');
          img.src = cellData.img;
          img.style.width = '100%';
          img.style.height = '100%';
          img.style.objectFit = 'cover';
          cell.appendChild(img);
        }
        tempGrid.appendChild(cell);
        id++;
      }
    }
  }

  try {
    const canvas = await html2canvas(tempGrid, {
      scale: 4000 / 750,
      useCORS: true,
      backgroundColor: '#ffffff'
    });

    const link = document.createElement('a');
    link.download = 'album.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch (error) {
    console.error('Failed to export PNG:', error);
    alert('PNG 저장에 실패했습니다.');
  } finally {
    document.body.removeChild(tempGrid);
  }
});

// Save button
document.getElementById('save-data').addEventListener('click', saveData);
</script>
<script src="../static/js/language.js"></script>

</body>
</html>
