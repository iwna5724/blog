<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블로그 관리 - 로그인</title>
  <link rel="stylesheet" href="../static/css/admin.css">
  <link rel="stylesheet" href="../static/css/admin-login.css">
</head>
<body>
  <div class="login-container">
    <h1>🚀 블로그 관리</h1>
    <p class="subtitle">GitHub 토큰으로 로그인하세요</p>

    <div id="error-message" class="error-message"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="github-token">GitHub Personal Access Token</label>
        <input 
          type="password" 
          id="github-token" 
          placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" 
          required
          autocomplete="off"
        >
        <div class="input-hint">토큰은 브라우저에만 저장되며 외부로 전송되지 않습니다</div>
      </div>

      <details class="advanced-settings">
        <summary>고급 설정 (선택사항)</summary>
        <div class="form-group">
          <label for="github-owner">GitHub 사용자명</label>
          <input 
            type="text" 
            id="github-owner" 
            placeholder="your-username"
          >
        </div>
        <div class="settings-row">
          <div class="form-group">
            <label for="github-repo">저장소 이름</label>
            <input 
              type="text" 
              id="github-repo" 
              placeholder="my-blog"
            >
          </div>
          <div class="form-group">
            <label for="github-branch">브랜치</label>
            <input 
              type="text" 
              id="github-branch" 
              placeholder="main"
            >
          </div>
        </div>
        <div class="input-hint">비워두면 config.json의 설정을 사용합니다</div>
      </details>

      <button type="submit" id="login-btn">로그인</button>
      <div id="loading" class="loading" style="display: none;">
        인증 확인 중...
      </div>
    </form>
  </div>

  <script src="./js/auth.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const tokenInput = document.getElementById('github-token');
    const ownerInput = document.getElementById('github-owner');
    const repoInput = document.getElementById('github-repo');
    const branchInput = document.getElementById('github-branch');
    const loginBtn = document.getElementById('login-btn');
    const loading = document.getElementById('loading');
    const errorMessage = document.getElementById('error-message');

    // 이미 로그인된 경우 리다이렉트
    if (auth.isLoggedIn()) {
      window.location.href = './index.html';
    }

    // config.json 로드
    let defaultConfig = null;
    fetch('../config.json')
      .then(res => res.json())
      .then(config => {
        defaultConfig = config.github;
        // 기본값 설정
        ownerInput.placeholder = defaultConfig.owner;
        repoInput.placeholder = defaultConfig.repo;
        branchInput.placeholder = defaultConfig.branch || 'main';
      })
      .catch(err => {
        console.error('Failed to load config.json:', err);
        showError('config.json을 불러올 수 없습니다.');
      });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const token = tokenInput.value.trim();
      
      if (!token) {
        showError('GitHub 토큰을 입력해주세요.');
        return;
      }

      // 설정 가져오기 (입력값 또는 기본값)
      const config = {
        owner: ownerInput.value.trim() || defaultConfig?.owner,
        repo: repoInput.value.trim() || defaultConfig?.repo,
        branch: branchInput.value.trim() || defaultConfig?.branch || 'main'
      };

      if (!config.owner || !config.repo) {
        showError('GitHub 사용자명과 저장소 이름을 입력해주세요.');
        return;
      }

      // UI 업데이트
      loginBtn.disabled = true;
      loading.style.display = 'block';
      errorMessage.classList.remove('show');

      try {
        // 토큰 및 권한 검증
        const validation = await auth.validateCredentials(token, config);

        if (!validation.valid) {
          showError(validation.error);
          return;
        }

        // 로그인 성공
        auth.login(token, config);
        
        // 사용자 정보 표시 (선택사항)
        console.log('로그인 성공:', validation.user.login);
        
        // 리다이렉트
        auth.returnToPreviousPage();

      } catch (error) {
        console.error('Login error:', error);
        showError('로그인 중 오류가 발생했습니다. 다시 시도해주세요.');
      } finally {
        loginBtn.disabled = false;
        loading.style.display = 'none';
      }
    });

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
    }

    // Enter 키로 로그인
    tokenInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        form.dispatchEvent(new Event('submit'));
      }
    });
  </script>
</body>
</html>
