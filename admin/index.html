<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블로그 관리</title>

  <link rel="icon" type="image/x-icon" href="../static/images/favicon.ico">
  <link rel="stylesheet" href="../static/css/admin.css">
  <link rel="stylesheet" href="../static/css/admin-dashboard.css">
</head>
<body>
  <div class="header">
    <div class="header-content">
      <h1>📚 블로그 관리</h1>
      <div class="header-actions">
        <button class="btn btn-success" onclick="syncDrafts()" id="sync-btn" style="display:none;">
          🔄 동기화 (<span id="draft-count">0</span>)
        </button>
        <a href="../index.html" class="btn btn-outline">🏠 블로그 보기</a>
        <a href="./editor.html" class="btn btn-primary">✍️ 새 글 쓰기</a>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- 임시저장 글 섹션 -->
    <div class="drafts-section" id="drafts-section">
      <div class="drafts-header">
        <div class="drafts-title">
          💾 임시저장된 글 (<span id="drafts-count">0</span>개)
        </div>
      </div>
      <div class="drafts-list" id="drafts-list">
        <!-- JavaScript로 동적 생성 -->
      </div>
    </div>

    <!-- 삭제 대기 글 섹션 -->
    <div class="deleted-section" id="deleted-section">
      <div class="deleted-header">
        <div class="deleted-title">
          🗑️ 삭제 대기 (<span id="deleted-count">0</span>개)
        </div>
      </div>
      <div class="deleted-list" id="deleted-list">
        <!-- JavaScript로 동적 생성 -->
      </div>
    </div>

    <!-- 동기화 대기 항목이 없을 때 표시 -->
    <div class="empty-state" id="empty-state" style="display:none;">
      <div class="empty-state-icon">✅</div>
      <h3>동기화할 항목이 없습니다</h3>
      <p>새 글을 작성하거나 기존 글을 수정하세요.</p>
      <a href="./editor.html" class="btn btn-primary">✍️ 새 글 쓰기</a>
    </div>
  </div>

  <script src="./js/auth.js"></script>
  <script src="./js/github-api.js"></script>
  <script>
    // 인증 확인
    const token = checkAuth();
    const config = auth.getConfig();
    const github = new GitHubAPI(token, config);

    // 페이지 로드 시 실행
    init();

    function init() {
      loadDrafts();
      loadDeletedPosts();
      updateEmptyState();
    }

    // 임시저장 글 로드
    function loadDrafts() {
      try {
        const stored = localStorage.getItem('blog_drafts');
        if (!stored) {
          return;
        }

        const drafts = JSON.parse(stored);

        if (drafts.length === 0) {
          return;
        }

        // 동기화 버튼 업데이트
        updateSyncButton();

        // drafts 섹션 표시
        const draftsSection = document.getElementById('drafts-section');
        const draftsCountSpan = document.getElementById('drafts-count');
        if (draftsSection && draftsCountSpan) {
          draftsSection.classList.add('has-drafts');
          draftsCountSpan.textContent = drafts.length;
        }

        // drafts 목록 렌더링
        const draftsList = document.getElementById('drafts-list');
        if (!draftsList) return;

        draftsList.innerHTML = '';

        drafts.forEach(draft => {
          const draftItem = document.createElement('div');
          draftItem.className = 'draft-item';

          const formattedDate = new Date(draft.createdAt).toLocaleString('ko-KR', {
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
          });

          draftItem.innerHTML = `
            <div class="draft-info">
              <div class="draft-title">${escapeHtml(draft.titleKo)}</div>
              <div class="draft-meta">
                📅 ${draft.date} | 💾 ${formattedDate}
              </div>
            </div>
            <div class="draft-actions">
              <button class="btn btn-small btn-outline" onclick="editDraft(${draft.id})">
                ✏️ 수정
              </button>
              <button class="btn btn-small btn-danger" onclick="deleteDraft(${draft.id})">
                🗑️ 삭제
              </button>
            </div>
          `;

          draftsList.appendChild(draftItem);
        });

      } catch (error) {
        console.error('Failed to load drafts:', error);
      }
    }

    // Draft 수정
    window.editDraft = function(draftId) {
      window.location.href = `./editor.html?draftId=${draftId}`;
    };

    // Draft 삭제
    window.deleteDraft = function(draftId) {
      if (!confirm('이 임시저장 글을 삭제하시겠습니까?')) {
        return;
      }

      try {
        const stored = localStorage.getItem('blog_drafts');
        if (!stored) return;

        let drafts = JSON.parse(stored);
        drafts = drafts.filter(d => d.id !== draftId);

        localStorage.setItem('blog_drafts', JSON.stringify(drafts));

        // 페이지 새로고침
        location.reload();
      } catch (error) {
        console.error('Failed to delete draft:', error);
        alert('삭제 실패: ' + error.message);
      }
    };

    // 삭제 대기 글 로드
    function loadDeletedPosts() {
      try {
        const stored = localStorage.getItem('blog_deleted_posts');
        if (!stored) {
          return;
        }

        const deletedPosts = JSON.parse(stored);

        if (deletedPosts.length === 0) {
          return;
        }

        // 동기화 버튼 업데이트
        updateSyncButton();

        // deleted posts 섹션 표시
        const deletedSection = document.getElementById('deleted-section');
        const deletedCountSpan = document.getElementById('deleted-count');
        if (deletedSection && deletedCountSpan) {
          deletedSection.classList.add('has-deleted');
          deletedCountSpan.textContent = deletedPosts.length;
        }

        // deleted posts 목록 렌더링
        const deletedList = document.getElementById('deleted-list');
        if (!deletedList) return;

        deletedList.innerHTML = '';

        deletedPosts.forEach(deleted => {
          const deletedItem = document.createElement('div');
          deletedItem.className = 'deleted-item';

          const formattedDate = new Date(deleted.deletedAt).toLocaleString('ko-KR', {
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
          });

          deletedItem.innerHTML = `
            <div class="deleted-info">
              <div class="deleted-item-title">${escapeHtml(deleted.title)}</div>
              <div class="deleted-meta">
                📄 ${deleted.filename} | 🗑️ ${formattedDate}
              </div>
            </div>
            <div class="deleted-actions">
              <button class="btn btn-small btn-outline" onclick="cancelDelete('${deleted.filename}')">
                ↩️ 취소
              </button>
            </div>
          `;

          deletedList.appendChild(deletedItem);
        });

      } catch (error) {
        console.error('Failed to load deleted posts:', error);
      }
    }

    // 삭제 취소
    window.cancelDelete = function(filename) {
      if (!confirm('삭제를 취소하시겠습니까?')) {
        return;
      }

      try {
        const stored = localStorage.getItem('blog_deleted_posts');
        if (!stored) return;

        let deletedPosts = JSON.parse(stored);
        deletedPosts = deletedPosts.filter(d => d.filename !== filename);

        localStorage.setItem('blog_deleted_posts', JSON.stringify(deletedPosts));

        // 페이지 새로고침
        location.reload();
      } catch (error) {
        console.error('Failed to cancel delete:', error);
        alert('삭제 취소 실패: ' + error.message);
      }
    };

    // 동기화 버튼 업데이트
    function updateSyncButton() {
      const draftsStored = localStorage.getItem('blog_drafts');
      const deletedStored = localStorage.getItem('blog_deleted_posts');

      const draftsCount = draftsStored ? JSON.parse(draftsStored).length : 0;
      const deletedCount = deletedStored ? JSON.parse(deletedStored).length : 0;
      const totalCount = draftsCount + deletedCount;

      const syncBtn = document.getElementById('sync-btn');
      const draftCount = document.getElementById('draft-count');

      if (syncBtn && draftCount) {
        if (totalCount > 0) {
          syncBtn.style.display = 'inline-block';
          let text = [];
          if (draftsCount > 0) text.push(`발행 ${draftsCount}`);
          if (deletedCount > 0) text.push(`삭제 ${deletedCount}`);
          draftCount.textContent = text.join(' / ');
        } else {
          syncBtn.style.display = 'none';
        }
      }
    }

    // 빈 상태 표시 업데이트
    function updateEmptyState() {
      const draftsStored = localStorage.getItem('blog_drafts');
      const deletedStored = localStorage.getItem('blog_deleted_posts');

      const draftsCount = draftsStored ? JSON.parse(draftsStored).length : 0;
      const deletedCount = deletedStored ? JSON.parse(deletedStored).length : 0;
      const totalCount = draftsCount + deletedCount;

      const emptyState = document.getElementById('empty-state');
      if (emptyState) {
        emptyState.style.display = totalCount === 0 ? 'block' : 'none';
      }
    }

    // 동기화 함수 (모든 drafts를 GitHub에 발행하고 삭제 처리하고 Actions 트리거)
    window.syncDrafts = async function() {
      try {
        const draftsStored = localStorage.getItem('blog_drafts');
        const deletedStored = localStorage.getItem('blog_deleted_posts');

        const drafts = draftsStored ? JSON.parse(draftsStored) : [];
        const deletedPosts = deletedStored ? JSON.parse(deletedStored) : [];

        if (drafts.length === 0 && deletedPosts.length === 0) {
          alert('동기화할 항목이 없습니다.');
          return;
        }

        let confirmMsg = '동기화를 시작하시겠습니까?\n\n';
        if (drafts.length > 0) confirmMsg += `📝 발행: ${drafts.length}개\n`;
        if (deletedPosts.length > 0) confirmMsg += `🗑️ 삭제: ${deletedPosts.length}개\n`;
        confirmMsg += '\n동기화 후 자동으로 빌드가 시작됩니다.';

        if (!confirm(confirmMsg)) {
          return;
        }

        const syncBtn = document.getElementById('sync-btn');
        if (syncBtn) {
          syncBtn.disabled = true;
          syncBtn.innerHTML = '🔄 동기화 중...';
        }

        const publishedTitles = [];
        const deletedTitles = [];
        const changes = []; // 모든 변경사항을 담을 배열

        // diary changelog에 기록할 항목 정보 (commitHash는 커밋 후 채워넣음)
        const diaryEntries = [];

        // 1. 모든 drafts를 변경사항 배열에 추가
        for (const draft of drafts) {
          try {
            // Front matter 생성
            const tagArray = draft.tags ? draft.tags.split(',').map(t => t.trim()).filter(t => t) : [];
            const challengeArray = draft.challenges ? draft.challenges.split(',').map(c => c.trim()).filter(c => c) : [];

            const frontMatter = `---
title:
  ko: "${draft.titleKo}"
  ja: "${draft.titleJa}"
date: ${draft.date}
tags: [${tagArray.join(', ')}]
challenges: [${challengeArray.join(', ')}]${draft.musicTitle && draft.musicUrl ? `
music:
  title: "${draft.musicTitle}"
  url: "${draft.musicUrl}"` : ''}
---

`;

            // 본문 생성
            const body = `<!-- ko -->
${draft.contentKo}
<!-- /ko -->

<!-- ja -->
${draft.contentJa}
<!-- /ja -->`;

            const fullContent = frontMatter + body;

            // 파일명 처리: sha가 있으면 기존 파일 수정, 없으면 새 파일 생성
            let filename = draft.filename;

            // 새 파일 생성인 경우에만 중복 체크
            if (!draft.sha) {
              let counter = 2;
              while (await github.fileExists(`content/${filename}`)) {
                const baseName = draft.filename.replace('.md', '');
                filename = `${baseName}-${counter}.md`;
                counter++;
                if (counter > 100) break;
              }
            }

            const path = `content/${filename}`;

            // 변경사항 배열에 추가
            changes.push({
              type: draft.sha ? 'update' : 'add',
              path: path,
              content: fullContent,
              sha: draft.sha
            });

            publishedTitles.push(draft.titleKo);

            // diary changelog 항목 준비
            const slug = filename.replace(/\.md$/, '');
            const postDate = draft.date || slug;
            const postDateShort = postDate.replace(/^(\d{4})-(\d{2})-(\d{2})$/, (_, y, m, d) =>
              `${y.slice(2)}/${m}/${d}`
            );
            const isNew = !draft.sha;
            // 수정(isNew=false)인 경우에만 자동으로 changelog에 기록
            // 추가(isNew=true)는 자동 기록하지 않음 (수동으로 관리)
            if (!isNew) {
              diaryEntries.push({
                slug,
                descKo: `수정: [${postDateShort}] ${draft.titleKo}`,
                descJa: `修正: [${postDateShort}] ${draft.titleJa || draft.titleKo}`,
              });
            }

          } catch (error) {
            console.error(`Failed to prepare draft ${draft.id}:`, error);
            throw new Error(`"${draft.titleKo}" 준비 실패: ${error.message}`);
          }
        }

        // 2. 모든 삭제 대기 파일을 변경사항 배열에 추가
        for (const deleted of deletedPosts) {
          changes.push({
            type: 'delete',
            path: `content/${deleted.filename}`,
            sha: deleted.sha
          });

          deletedTitles.push(deleted.title);
        }

        // 3. 동기화 대상 draft의 이미지도 변경사항에 추가
        for (const draft of drafts) {
          const imageKey = `blog_draft_images_${draft.filename}`;
          let images = [];
          try { images = JSON.parse(localStorage.getItem(imageKey) || '[]'); } catch(e) {}
          for (const img of images) {
            // fromGitHub 항목이나 date/userFilename이 올바르지 않은 항목은 건너뜀
            if (img.fromGitHub) continue;
            if (typeof img.date !== 'string' || typeof img.userFilename !== 'string') continue;
            if (!img.date.match(/^\d{4}-\d{2}-\d{2}$/) || !img.userFilename) continue;
            changes.push({
              type: 'add',
              path: `content/images/${img.date}-${img.userFilename}`,
              content: img.dataUrl,
              binary: true
            });
          }
        }

        // 4. 모든 변경사항을 한 번의 커밋으로 처리
        try {
          let commitMessage = 'content: ';
          const parts = [];
          if (publishedTitles.length > 0) {
            parts.push(`add/update ${publishedTitles.length} post(s)`);
          }
          if (deletedTitles.length > 0) {
            parts.push(`delete ${deletedTitles.length} post(s)`);
          }
          commitMessage += parts.join(', ');

          const commitResult = await github.createBatchCommit(changes, commitMessage);
          const commitSha = commitResult?.commit?.sha || '';

          console.log('Batch commit successful:', commitSha);

          // diary 항목이 있으면 changelog_data.json에 기록 (commitHash 포함)
          if (diaryEntries.length > 0) {
            try {
              const today = new Date().toISOString().split('T')[0];
              const changelogFile = await github.getFile('changelog/changelog_data.json');
              const changelogData = JSON.parse(changelogFile.content);

              let idBase = Date.now();
              for (const entry of diaryEntries) {
                // 중복 체크 (같은 날짜 + category + descKo)
                const isDup = changelogData.entries.some(e =>
                  e.date === today &&
                  e.category === 'diary' &&
                  (typeof e.description === 'object' ? e.description.ko : e.description) === entry.descKo
                );
                if (isDup) continue;

                changelogData.entries.push({
                  id: idBase++,
                  date: today,
                  category: 'diary',
                  slug: entry.slug,
                  commitHash: commitSha,
                  description: { ko: entry.descKo, ja: entry.descJa },
                });
              }

              // 날짜 오름차순 정렬
              changelogData.entries.sort((a, b) => {
                const dc = a.date.localeCompare(b.date);
                return dc !== 0 ? dc : a.id - b.id;
              });

              const updatedJson = JSON.stringify(changelogData, null, 2);
              await github.saveFile(
                'changelog/changelog_data.json',
                updatedJson,
                '변경사항 데이터 업데이트',
                changelogFile.sha
              );
            } catch (e) {
              console.warn('changelog diary 기록 실패:', e.message);
              // changelog 실패는 동기화 전체를 막지 않음
            }
          }

        } catch (error) {
          console.error('Batch commit failed:', error);
          throw new Error(`일괄 커밋 실패: ${error.message}`);
        }

        // localStorage 정리 (drafts + 이미지)
        for (const draft of drafts) {
          localStorage.removeItem(`blog_draft_images_${draft.filename}`);
        }
        localStorage.removeItem('blog_drafts');
        localStorage.removeItem('blog_deleted_posts');

        // 동기화 완료 메시지
        let resultMsg = '✅ 동기화 완료!\n\n';
        if (publishedTitles.length > 0) resultMsg += `📝 발행: ${publishedTitles.join(', ')}\n`;
        if (deletedTitles.length > 0) resultMsg += `🗑️ 삭제: ${deletedTitles.join(', ')}\n`;
        resultMsg += '\nGitHub Actions에서 자동으로 빌드가 시작됩니다.\n약 1-2분 후 블로그에 반영됩니다.';

        alert(resultMsg);

        // 페이지 새로고침
        location.reload();

      } catch (error) {
        console.error('Sync error:', error);
        alert('동기화 실패: ' + error.message);
      } finally {
        const syncBtn = document.getElementById('sync-btn');
        if (syncBtn) {
          syncBtn.disabled = false;
          syncBtn.innerHTML = '🔄 동기화 (<span id="draft-count">0</span>)';
        }
      }
    };

    // 유틸리티 함수
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
